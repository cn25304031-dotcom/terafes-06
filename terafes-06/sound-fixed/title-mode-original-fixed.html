g, rgba(255, 255, 255, .025) 0 1px, transparent 1px 3px); mix-blend-mode: overlay; }\n\n/* ---------- HUD ---------- */\n.hud {\n    position: absolute;\n    top: 0; left: 0; right: 0;\n    display: flex;\n    justify-content: space-between;\n    padding: 2.2cqw 2.4cqw;\n    pointer-events: none;\n}\n.hud-block { display: flex; gap: 1.2cqw; }\n\n.stat {\n    min-width: 11cqw;\n    padding: .9cqw 1.5cqw 1cqw;\n    border-radius: 10px;\n    background: linear-gradient(160deg, rgba(14, 24, 58, .72), rgba(6, 10, 28, .6));\n    border: 1px solid rgba(120, 170, 255, .22);\n    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .07), 0 8px 24px -14px rgba(0, 0, 0, .9);\n    -webkit-backdrop-filter: blur(6px);\n    backdrop-filter: blur(6px);\n}\n.stat span {\n    display: block;\n    font: 500 clamp(8px, 1.25cqw, 11px)/1 var(--font-hud);\n    letter-spacing: .28em;\n    color: #7f93bd;\n}\n.stat strong {\n    display: block;\n    margin-top: .6cqw;\n    font: 700 clamp(14px, 2.6cqw, 24px)/1.1 var(--font-hud);\n    letter-spacing: .06em;\n    font-variant-numeric: tabular-nums;\n}\n#score { color: var(--gold); text-shadow: 0 0 14px rgba(255, 210, 122, .55); }\n#hp    { color: #ff6f94; text-shadow: 0 0 14px rgba(255, 90, 140, .6); letter-spacing: .12em; }\n#power { color: #79f7d4; text-shadow: 0 0 14px rgba(120, 255, 210, .5); }\n#bestScore { color: #c9d6f5; }\n\n/* ---------- boss bar ---------- */\n.boss-hud {\n    position: absolute;\n    left: 50%; bottom: 2.6cqw;\n    width: 58%;\n    display: flex; align-items: center; gap: 1.6cqw;\n    padding: .9cqw 1.6cqw;\n    border-radius: 999px;\n    background: rgba(18, 6, 28, .7);\n    border: 1px solid rgba(255, 92, 200, .4);\n    box-shadow: 0 0 30px -8px rgba(255, 60, 180, .6);\n    -webkit-backdrop-filter: blur(6px);\n    backdrop-filter: blur(6px);\n    transform: translate(-50%, 16px);\n    opacity: 0; pointer-events: none;\n    transition: opacity .4s, transform .5s cubic-bezier(.2, .7, .2, 1);\n}\n.boss-hud.show { opacity: 1; transform: translate(-50%, 0); }\n.boss-hud .bl { font: 700 clamp(9px, 1.5cqw, 13px)/1 var(--font-hud); letter-spacing: .3em; color: var(--pink); text-shadow: 0 0 12px var(--pink); }\n.boss-hud strong { min-width: 3.4em; text-align: right; font: 700 clamp(10px, 1.6cqw, 14px)/1 var(--font-hud); color: #ffc2e8; font-variant-numeric: tabular-nums; }\n.boss-bar-track { flex: 1; height: 1cqw; min-height: 6px; border-radius: 99px; background: rgba(255, 255, 255, .1); overflow: hidden; }\n#bossBarFill { width: 0; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #ff3f8e, #ff9be0); box-shadow: 0 0 14px #ff4fb0; transition: width .12s linear; }\n\n/* ---------- overlay (title / pause / result) ---------- */\n.overlay {\n    position: absolute;\n    inset: 0;\n    display: grid;\n    place-items: center;\n    padding: 4cqw;\n    background:\n        radial-gradient(ellipse at 50% 40%, rgba(10, 20, 60, .55), rgba(1, 3, 12, .9) 75%);\n    -webkit-backdrop-filter: blur(5px);\n    backdrop-filter: blur(5px);\n}\n.overlay.hidden { display: none; }\n\n.panel {\n    position: relative;\n    width: min(92%, 520px);\n    padding: 3.4cqw 4cqw 3cqw;\n    text-align: center;\n    border-radius: 20px;\n    background: linear-gradient(165deg, rgba(16, 26, 64, .8), rgba(5, 9, 26, .85));\n    border: 1px solid rgba(130, 180, 255, .28);\n    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .09), 0 30px 70px -30px #000, 0 0 70px -20px rgba(80, 130, 255, .5);\n    animation: panelIn .7s cubic-bezier(.2, .7, .2, 1) both;\n}\n@keyframes panelIn { from { opacity: 0; transform: translateY(18px) scale(.97); filter: blur(6px); } }\n\n.kicker { margin: 0 0 1.4cqw; font: 500 clamp(9px, 1.3cqw, 12px)/1 var(--font-hud); letter-spacing: .42em; color: #7f93bd; }\n\n.overlay h2 {\n    margin: 0;\n    font: 900 clamp(24px, 5.6cqw, 50px)/1.05 var(--font-hud);\n    letter-spacing: .08em;\n    background: linear-gradient(100deg, #7be4ff 0%, #b9a6ff 55%, #ff9be0 100%);\n    -webkit-background-clip: text; background-clip: text;\n    -webkit-text-fill-color: transparent; color: transparent;\n    filter: drop-shadow(0 0 18px rgba(110, 160, 255, .5));\n}\n\n.overlay p#overlayMessage {\n    margin: 2cqw 0 2.8cqw;\n    line-height: 1.9;\n    font-size: clamp(12px, 1.9cqw, 16px);\n    color: #c3d2ee;\n    white-space: pre-line;\n}\n\nbutton {\n    position: relative;\n    padding: 1.7cqw 5cqw;\n    border: 0;\n    border-radius: 999px;\n    font: 700 clamp(12px, 2cqw, 17px)/1 var(--font-hud);\n    letter-spacing: .22em;\n    color: #04101f;\n    cursor: pointer;\n    background: linear-gradient(120deg, #7be4ff, #7d8dff 60%, #c084ff);\n    box-shadow: 0 0 0 4px rgba(120, 160, 255, .14), 0 14px 34px -10px rgba(90, 140, 255, .8), inset 0 1px 0 rgba(255, 255, 255, .55);\n    transition: transform .3s cubic-bezier(.2, .7, .2, 1), box-shadow .3s, filter .3s;\n    animation: pulse 2.4s ease-in-out infinite;\n}\n@keyframes pulse { 50% { box-shadow: 0 0 0 9px rgba(120, 160, 255, .06), 0 14px 40px -8px rgba(110, 160, 255, 1), inset 0 1px 0 rgba(255, 255, 255, .55); } }\nbutton:hover { transform: translateY(-2px) scale(1.04); filter: brightness(1.12); }\nbutton:active { transform: scale(.97); }\nbutton:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }\n\n.keys {\n    list-style: none;\n    margin: 2.8cqw 0 0;\n    padding: 2cqw 0 0;\n    display: flex; justify-content: center; flex-wrap: wrap; gap: 1.4cqw 3cqw;\n    border-top: 1px solid rgba(255, 255, 255, .08);\n    font-size: clamp(10px, 1.45cqw, 13px);\n    color: #8fa3cb;\n}\n.keys li { display: flex; align-items: center; gap: .6cqw; }\nkbd {\n    padding: .35cqw .9cqw;\n    border-radius: 6px;\n    font: 500 clamp(9px, 1.3cqw, 12px)/1.2 var(--font-hud);\n    letter-spacing: .08em;\n    color: #d8e6ff;\n    background: rgba(255, 255, 255, .07);\n    border: 1px solid rgba(255, 255, 255, .18);\n    border-bottom-width: 2px;\n}\n\n@media (max-width: 560px) {\n    body { padding: 54px 4px 4px; }\n    .stat { min-width: 0; }\n}\n\n</style>\n    </head>\n<body>\n    <main class=\"stage\" id=\"stage\">\n        <canvas id=\"gameCanvas\" width=\"800\" height=\"600\"\n                aria-label=\"スペースシューティングゲーム\"></canvas>\n\n        <div class=\"fx fx-vignette\"></div>\n        <div class=\"fx fx-scan\"></div>\n\n        <header class=\"hud\" aria-label=\"ゲームステータス\">\n            <div class=\"hud-block\">\n                <div class=\"stat score\"><span>SCORE</span><strong id=\"score\">0</strong></div>\n                <div class=\"stat hull\"><span>HULL</span><strong id=\"hp\">♥ ♥ ♥</strong></div>\n            </div>\n            <div class=\"hud-block\">\n                <div class=\"stat power\"><span>SHOT</span><strong id=\"power\">1</strong></div>\n                <div class=\"stat best\"><span>BEST</span><strong id=\"bestScore\">0</strong></div>\n            </div>\n        </header>\n\n        <div class=\"boss-hud\" id=\"bossHud\">\n            <span class=\"bl\">BOSS</span>\n            <div class=\"boss-bar-track\"><div id=\"bossBarFill\"></div></div>\n            <strong id=\"bossHp\">---</strong>\n        </div>\n\n        <div id=\"overlay\" class=\"overlay\">\n            <div class=\"panel\">\n                <p class=\"kicker\">TERA FES 2026</p>\n                <h2 id=\"overlayTitle\">SPACE SHOOTER</h2>\n                <p id=\"overlayMessage\">敵を倒して、ボスを撃破しよう！</p>\n                <button id=\"startButton\">GAME START</button>\n                <ul class=\"keys\">\n                    <li><kbd>W A S D</kbd><kbd>↑ ← ↓ →</kbd><span>移動</span></li>\n                    <li><kbd>SPACE</kbd><span>射撃</span></li>\n                    <li><kbd>ESC</kbd><span>一時停止</span></li>\n                </ul>\n            </div>\n        </div>\n    </main>\n<script>\n\n\"use strict\";\n\n// ==============================\n// Space Shooter - Game Logic\n// ==============================\n\nconst canvas = document.getElementById(\"gameCanvas\");\nconst ctx = canvas.getContext(\"2d\");\n\nconst scoreElement = document.getElementById(\"score\");\nconst hpElement = document.getElementById(\"hp\");\nconst powerElement = document.getElementById(\"power\");\nconst bossHpElement = document.getElementById(\"bossHp\");\nconst bossBarFill = document.getElementById(\"bossBarFill\");\nconst bestScoreElement = document.getElementById(\"bestScore\");\n\nconst overlay = document.getElementById(\"overlay\");\nconst overlayTitle = document.getElementById(\"overlayTitle\");\nconst overlayMessage = document.getElementById(\"overlayMessage\");\nconst startButton = document.getElementById(\"startButton\");\n\nconst WIDTH = canvas.width;\nconst HEIGHT = canvas.height;\nconst BOSS_KILL_LIMIT = 24;   // 4 waves x 6 enemies, then the boss\nconst WAVE_LENGTH = 5.5;      // seconds per wave\nconst WAVE_NORMALS = 5;       // normal enemies per wave\nconst MAX_ON_SCREEN = 9;       // hard cap so the screen never floods\n\nconst keys = new Set();\n\nlet state = \"ready\";\nlet score = 0;\nlet bestScore = loadBestScore();\nlet defeatedEnemies = 0;\nlet waveTime = 0;\nlet waveSchedule = [];\nlet waveNumber = 0;\nlet gameTime = 0;\nlet lastTime = 0;\nlet animationId = 0;\nlet boss = null;\nlet bossSpawned = false;\nlet shake = 0;\n\nlet player;\nlet playerBullets = [];\nlet enemyBullets = [];\nlet enemies = [];\nlet items = [];\nlet particles = [];\nlet rings = [];\nlet hurtFlash = 0;\nlet bgScroll = 0;\nlet time = 0;\n\nconst bossHud = document.getElementById(\"bossHud\");\n\nconst stars = Array.from({ length: 140 }, () => {\n    const z = Math.random();\n    const roll = Math.random();\n\n    return {\n        x: Math.random() * WIDTH,\n        y: Math.random() * HEIGHT,\n        z,\n        size: 0.6 + z * 1.7,\n        speed: 14 + z * 80,\n        tw: Math.random() * Math.PI * 2,\n        color: roll < 0.2 ? \"#9fd8ff\" : roll < 0.33 ? \"#ffc6e8\" : \"#e6f1ff\"\n    };\n});\n\n// ---------- Local storage ----------\n\nfunction loadBestScore() {\n    try {\n        return Number(localStorage.getItem(\"spaceShooterBest\")) || 0;\n    } catch {\n        return 0;\n    }\n}\n\nfunction saveBestScore() {\n    if (score > bestScore) {\n        bestScore = score;\n\n        try {\n            localStorage.setItem(\"spaceShooterBest\", String(bestScore));\n        } catch {\n            // The game still works if storage is unavailable.\n        }\n    }\n\n    bestScoreElement.textContent = bestScore;\n}\n\n// ---------- Reset and start ----------\n\nfunction resetGame() {\n    score = 0;\n    defeatedEnemies = 0;\n    waveTime = 0;\n    waveSchedule = [];\n    waveNumber = 0;\n    startWave();\n    gameTime = 0;\n    boss = null;\n    bossSpawned = false;\n    shake = 0;\n\n    playerBullets = [];\n    enemyBullets = [];\n    enemies = [];\n    items = [];\n    particles = [];\n    rings = [];\n    hurtFlash = 0;\n\n    player = {\n        x: WIDTH / 2,\n        y: HEIGHT - 75,\n        width: 30,\n        height: 36,\n        speed: 300,\n        hp: 3,\n        power: 1,\n        double: 0,\n        shootTimer: 0,\n        invincible: 0,\n        shield: 0\n    };\n\n    updateUI();\n}\n\nfunction startGame() {\n    resetGame();\n    state = \"playing\";\n    overlay.classList.add(\"hidden\");\n    lastTime = performance.now();\n}\n\nstartButton.addEventListener(\"click\", () => {\n    if (state === \"ready\" || state === \"over\" || state === \"clear\") {\n        startGame();\n    } else if (state === \"paused\") {\n        state = \"playing\";\n        overlay.classList.add(\"hidden\");\n        lastTime = performance.now();\n    }\n});\n\n// ---------- Keyboard ----------\n\nwindow.addEventListener(\"keydown\", (event) => {\n    const key = event.key.toLowerCase();\n\n    if (\n        key === \" \" ||\n        key.startsWith(\"arrow\") ||\n        [\"w\", \"a\", \"s\", \"d\", \"escape\"].includes(key)\n    ) {\n        event.preventDefault();\n    }\n\n    if (key === \"escape\") {\n        if (state === \"playing\") {\n            state = \"paused\";\n            showOverlay(\"PAUSED\", \"Escキーで再開できます。\", \"RESUME\");\n        } else if (state === \"paused\") {\n            state = \"playing\";\n            overlay.classList.add(\"hidden\");\n            lastTime = performance.now();\n        }\n        return;\n    }\n\n    keys.add(key);\n});\n\nwindow.addEventListener(\"keyup\", (event) => {\n    keys.delete(event.key.toLowerCase());\n});\n\nwindow.addEventListener(\"blur\", () => {\n    keys.clear();\n\n    if (state === \"playing\") {\n        state = \"paused\";\n        showOverlay(\"PAUSED\", \"Escキーまたはボタンで再開できます。\", \"RESUME\");\n    }\n});\n\n// ---------- UI and overlay ----------\n\nfunction updateUI() {\n    scoreElement.textContent = score;\n    hpElement.textContent =\n        \"♥ \".repeat(Math.max(0, player.hp)).trim() || \"0\";\n\n    powerElement.textContent = player.double > 0 ? `x2 ${Math.ceil(player.double)}s` : \"x1\";\n\n    bossHud.classList.toggle(\"show\", !!boss);\n\n    if (boss) {\n        bossHpElement.textContent = Math.max(0, Math.ceil(boss.hp));\n        bossBarFill.style.width =\n            `${Math.max(0, boss.hp / boss.maxHp * 100)}%`;\n    } else {\n        bossHpElement.textContent = \"---\";\n        bossBarFill.style.width = \"0%\";\n    }\n\n    bestScoreElement.textContent = bestScore;\n}\n\nfunction showOverlay(title, message, buttonText) {\n    overlayTitle.textContent = title;\n    overlayMessage.textContent = message;\n    startButton.textContent = buttonText;\n    overlay.classList.remove(\"hidden\");\n}\n\nfunction gameOver() {\n    if (state !== \"playing\") return;\n\n    gameSfx(\"over\");\n    state = \"over\";\n    saveBestScore();\n\n    showOverlay(\n        \"GAME OVER\",\n        `SCORE: ${score}\\nBEST SCORE: ${bestScore}`,\n        \"RETRY\"\n    );\n}\n\nfunction stageClear() {\n    if (state !== \"playing\") return;\n\n    gameSfx(\"clear\");\n    state = \"clear\";\n    score += 1000;\n    saveBestScore();\n    updateUI();\n\n    showOverlay(\n        \"STAGE CLEAR!\",\n        `ボスを撃破しました！\\nSCORE: ${score}\\nボーナス +1000`,\n        \"PLAY AGAIN\"\n    );\n}\n\n// ---------- Utility ----------\n\nfunction random(min, max) {\n    return Math.random() * (max - min) + min;\n}\n\nfunction distanceSquared(a, b) {\n    const dx = a.x - b.x;\n    const dy = a.y - b.y;\n    return dx * dx + dy * dy;\n}\n\nfunction hit(a, b, radiusA, radiusB) {\n    const radius = radiusA + radiusB;\n    return distanceSquared(a, b) < radius * radius;\n}\n\nfunction createParticles(x, y, color, amount = 12) {\n    for (let i = 0; i < amount; i++) {\n        const angle = Math.random() * Math.PI * 2;\n        const speed = random(40, 190);\n\n        particles.push({\n            x,\n            y,\n            vx: Math.cos(angle) * speed,\n            vy: Math.sin(angle) * speed,\n            life: random(0.25, 0.7),\n            maxLife: 0.7,\n            size: random(2, 5),\n            color\n        });\n    }\n}\n\nfunction createRing(x, y, color, max = 70, speed = 260) {\n    rings.push({ x, y, r: 6, max, speed, color });\n}\n\nfunction addScore(points) {\n    score += points;\n    saveBestScore();\n}\n\n// ---------- Enemies ----------\n\n// One wave = 5 normal enemies + 1 mid-level enemy that drops a bonus.\nfunction startWave() {\n    waveNumber++;\n    waveTime = 0;\n    waveSchedule = [];\n\n    for (let i = 0; i < WAVE_NORMALS; i++) {\n        waveSchedule.push({ t: 0.3 + i * 0.85 + random(-0.12, 0.12), strong: false });\n    }\n\n    waveSchedule.push({ t: 2.3, strong: true });\n    waveSchedule.sort((a, b) => a.t - b.t);\n}\n\nfunction spawnEnemy(strong) {\n    enemies.push({\n        x: strong ? random(WIDTH * 0.3, WIDTH * 0.7) : random(35, WIDTH - 35),\n        y: -40,\n        width: strong ? 46 : 28,\n        height: strong ? 40 : 27,\n        hp: strong ? 8 : 1,\n        maxHp: strong ? 8 : 1,\n        speed: strong ? random(55, 70) : random(95, 135),\n        strong,\n        shootTimer: random(0.9, 1.5),\n        phase: random(0, Math.PI * 2)\n    });\n}\n\nfunction dropBonus(x, y) {\n    // The mid-level enemy always drops one benefit.\n    const pool = [\"shield\", \"double\"];\n    if (player.hp < 3) pool.push(\"heal\", \"heal\");\n\n    items.push({\n        x,\n        y,\n        type: pool[Math.floor(Math.random() * pool.length)],\n        radius: 14,\n        speed: 80\n    });\n}\n\nfunction defeatEnemy(enemy, index) {\n    gameSfx(\"enemy\");\n    createParticles(\n        enemy.x,\n        enemy.y,\n        enemy.strong ? \"#ff9c55\" : \"#ff587e\",\n        enemy.strong ? 22 : 12\n    );\n\n    createRing(enemy.x, enemy.y, enemy.strong ? \"255,156,85\" : \"255,88,126\", enemy.strong ? 100 : 60);\n    addScore(enemy.strong ? 250 : 50);\n    defeatedEnemies++;\n\n    if (enemy.strong) dropBonus(enemy.x, enemy.y);\n\n    enemies.splice(index, 1);\n\n    if (defeatedEnemies >= BOSS_KILL_LIMIT && !bossSpawned) {\n        spawnBoss();\n    }\n}\n\n// ---------- Boss ----------\n\nfunction spawnBoss() {\n    gameSfx(\"boss\");\n    bossSpawned = true;\n    enemies = [];\n    enemyBullets = [];\n\n    boss = {\n        x: WIDTH / 2,\n        y: 105,\n        width: 112,\n        height: 75,\n        hp: 180,\n        maxHp: 180,\n        speed: 125,\n        direction: 1,\n        attackTimer: 1.1,\n        pattern: 0,\n        patternTimer: 0,\n        flash: 0\n    };\n\n    showOverlay(\"WARNING!\", \"BOSS APPROACHING!\", \"FIGHT!\");\n    state = \"paused\";\n}\n\nfunction bossShoot() {\n    if (!boss) return;\n\n    boss.pattern = (boss.pattern + 1) % 3;\n\n    if (boss.pattern === 0) {\n        // Spread attack\n        for (let angle = -0.3; angle <= 0.31; angle += 0.15) {\n            enemyBullets.push({\n                x: boss.x,\n                y: boss.y + 25,\n                vx: Math.sin(angle) * 220,\n                vy: Math.cos(angle) * 230,\n                radius: 6,\n                color: \"#ff5caa\"\n            });\n        }\n    } else if (boss.pattern === 1) {\n        // Aimed three-shot attack\n        const dx = player.x - boss.x;\n        const dy = player.y - boss.y;\n        // Aim at the player but always keep shots heading downward (never sideways)\n        const baseAngle = Math.max(\n            Math.PI / 2 - 0.3,\n            Math.min(Math.PI / 2 + 0.3, Math.atan2(dy, dx))\n        );\n\n        for (const offset of [-0.12, 0, 0.12]) {\n            const angle = baseAngle + offset;\n\n            enemyBullets.push({\n                x: boss.x,\n                y: boss.y + 20,\n                vx: Math.cos(angle) * 240,\n                vy: Math.sin(angle) * 240,\n                radius: 6,\n                color: \"#ffb84d\"\n            });\n        }\n    } else {\n        // Horizontal wave\n        for (let i = 0; i < 9; i++) {\n            enemyBullets.push({\n                x: boss.x + (i - 4) * 13,\n                y: boss.y + 30,\n                vx: (i - 4) * 9,\n                vy: 190,\n                radius: 5,\n                color: \"#cf83ff\"\n            });\n        }\n    }\n}\n\nfunction damageBoss(damage) {\n    if (!boss) return;\n\n    boss.hp -= damage;\n    boss.flash = 0.08;\n\n    if (boss.hp <= 0) {\n        createParticles(boss.x, boss.y, \"#ff71d4\", 55);\n        createParticles(boss.x, boss.y, \"#7beaff\", 35);\n        createRing(boss.x, boss.y, \"255,113,212\", 220, 380);\n        createRing(boss.x, boss.y, \"123,234,255\", 150, 300);\n        shake = 14;\n        boss = null;\n        enemyBullets = [];\n        stageClear();\n    }\n}\n\n// ---------- Items ----------\n\nfunction collectItem(item) {\n    gameSfx(\"pickup\");\n    if (item.type === \"double\") {\n        player.double = 12;                          // double shot for 12 s\n        createParticles(item.x, item.y, \"#ffd27a\", 14);\n        createRing(player.x, player.y, \"255,210,122\", 60);\n    } else if (item.type === \"heal\") {\n        player.hp = Math.min(3, player.hp + 1);\n        createParticles(item.x, item.y, \"#ff718c\", 14);\n        createRing(player.x, player.y, \"255,113,140\", 60);\n    } else if (item.type === \"shield\") {\n        player.shield = 6;\n        player.invincible = Math.max(player.invincible, 6);\n        createParticles(item.x, item.y, \"#70caff\", 14);\n        createRing(player.x, player.y, \"112,202,255\", 60);\n    }\n}\n\n// ---------- Sound effects (lazy Web Audio; no external assets) ----------\nlet sfxContext = null;\nlet lastShotSfx = 0;\nfunction gameSfx(type) {\n    try {\n        const AudioCtx = window.AudioContext || window.webkitAudioContext;\n        if (!AudioCtx) return;\n        if (!sfxContext) sfxContext = new AudioCtx();\n        if (sfxContext.state === \"suspended\") sfxContext.resume();\n        const ctx = sfxContext;\n        const now = ctx.currentTime;\n        const presets = {\n            shoot:  { wave: \"square\",   start: 760, end: 330, duration: 0.075, volume: 0.045 },\n            enemy:  { wave: \"triangle\", start: 260, end: 90,  duration: 0.19,  volume: 0.12  },\n            damage: { wave: \"sawtooth\", start: 190, end: 55,  duration: 0.32,  volume: 0.16  },\n            pickup: { wave: \"sine\",     start: 440, end: 990, duration: 0.22,  volume: 0.11  },\n            boss:   { wave: \"sawtooth\", start: 110, end: 440, duration: 0.65,  volume: 0.13  },\n            clear:  { wave: \"triangle\", start: 520, end: 1040,duration: 0.48,  volume: 0.12  },\n            over:   { wave: \"sawtooth\", start: 280, end: 65,  duration: 0.5,   volume: 0.12  }\n        };\n        const p = presets[type];\n        if (!p) return;\n        const osc = ctx.createOscillator();\n        const gain = ctx.createGain();\n        osc.type = p.wave;\n        osc.frequency.setValueAtTime(p.start, now);\n        osc.frequency.exponentialRampToValueAtTime(Math.max(1, p.end), now + p.duration);\n        gain.gain.setValueAtTime(0.0001, now);\n        gain.gain.linearRampToValueAtTime(p.volume, now + 0.012);\n        gain.gain.exponentialRampToValueAtTime(0.0001, now + p.duration);\n        osc.connect(gain); gain.connect(ctx.destination);\n        osc.start(now); osc.stop(now + p.duration + 0.02);\n    } catch (err) { /* Sound must never interrupt gameplay. */ }\n}\n\n// ---------- Player ----------\n\nfunction playerShoot() {\n    const shotNow = performance.now();\n    if (shotNow - lastShotSfx > 95) { gameSfx(\"shoot\"); lastShotSfx = shotNow; }\n    // Bullets always fly straight up, from the nose of the ship.\n    const offsets = player.double > 0 ? [-9, 9] : [0];\n\n    for (const offset of offsets) {\n        playerBullets.push({\n            x: player.x + offset,\n            y: player.y - 24,\n            vx: 0,\n            vy: -540,\n            radius: 4,\n            damage: 1\n        });\n    }\n}\n\nfunction damagePlayer() {\n    if (player.invincible > 0) return;\n\n    gameSfx(\"damage\");\n    player.hp--;\n    player.invincible = 1.2;\n    shake = 7;\n\n    createParticles(player.x, player.y, \"#ff647d\", 18);\n    createRing(player.x, player.y, \"255,100,125\", 70);\n    hurtFlash = 0.55;\n\n    if (player.hp <= 0) {\n        player.hp = 0;\n        gameOver();\n    }\n\n    updateUI();\n}\n\n// ---------- Update game ----------\n\nfunction update(dt) {\n    gameTime += dt;\n\n    // Starfield\n    for (const star of stars) {\n        star.y += star.speed * dt;\n\n        if (star.y > HEIGHT) {\n            star.y = 0;\n            star.x = Math.random() * WIDTH;\n        }\n    }\n\n    // Particles\n    for (let i = particles.length - 1; i >= 0; i--) {\n        const p = particles[i];\n\n        p.x += p.vx * dt;\n        p.y += p.vy * dt;\n        p.life -= dt;\n        p.vx *= 0.98;\n        p.vy *= 0.98;\n\n        if (p.life <= 0) particles.splice(i, 1);\n    }\n\n    for (let i = rings.length - 1; i >= 0; i--) {\n        const ring = rings[i];\n        ring.r += ring.speed * dt;\n        if (ring.r >= ring.max) rings.splice(i, 1);\n    }\n\n    hurtFlash = Math.max(0, hurtFlash - dt * 1.6);\n\n    if (shake > 0) shake = Math.max(0, shake - 25 * dt);\n\n    // Player movement\n    let dx = 0;\n    let dy = 0;\n\n    if (keys.has(\"a\") || keys.has(\"arrowleft\")) dx--;\n    if (keys.has(\"d\") || keys.has(\"arrowright\")) dx++;\n    if (keys.has(\"w\") || keys.has(\"arrowup\")) dy--;\n    if (keys.has(\"s\") || keys.has(\"arrowdown\")) dy++;\n\n    const length = Math.hypot(dx, dy) || 1;\n\n    player.x += (dx / length) * player.speed * dt;\n    player.y += (dy / length) * player.speed * dt;\n\n    player.x = Math.max(20, Math.min(WIDTH - 20, player.x));\n    player.y = Math.max(25, Math.min(HEIGHT - 25, player.y));\n\n    player.invincible = Math.max(0, player.invincible - dt);\n    player.shield = Math.max(0, player.shield - dt);\n    player.double = Math.max(0, player.double - dt);\n\n    // Continuous shooting\n    player.shootTimer -= dt;\n\n    if (keys.has(\" \") && player.shootTimer <= 0) {\n        playerShoot();\n        player.shootTimer = 0.17;\n    }\n\n    // Waves: 5 normal enemies + 1 mid-level enemy every few seconds\n    if (!bossSpawned) {\n        waveTime += dt;\n\n        while (waveSchedule.length && waveSchedule[0].t <= waveTime) {\n            const next = waveSchedule.shift();\n            if (enemies.length < MAX_ON_SCREEN) spawnEnemy(next.strong);\n        }\n\n        if (waveTime >= WAVE_LENGTH && waveSchedule.length === 0) startWave();\n    }\n\n    // Enemy movement and shooting\n    for (let i = enemies.length - 1; i >= 0; i--) {\n        const enemy = enemies[i];\n\n        enemy.y += enemy.speed * dt;\n        enemy.x += Math.sin(gameTime * 2 + enemy.phase) * 45 * dt;\n        enemy.x = Math.max(20, Math.min(WIDTH - 20, enemy.x));\n\n        if (enemy.strong) {\n            enemy.shootTimer -= dt;\n\n            if (enemy.shootTimer <= 0) {\n                // Mid-level enemy fires straight down (very slight homing), never from the side\n                const aim = Math.max(-30, Math.min(30, (player.x - enemy.x) * 0.15));\n\n                enemyBullets.push({\n                    x: enemy.x,\n                    y: enemy.y + 16,\n                    vx: aim,\n                    vy: 210,\n                    radius: 5,\n                    color: \"#ffae58\"\n                });\n\n                enemy.shootTimer = random(1.6, 2.4);\n            }\n        }\n\n        if (hit(player, enemy, 15, enemy.width * 0.38)) {\n            damagePlayer();\n            defeatEnemy(enemy, i);\n            continue;\n        }\n\n        if (enemy.y > HEIGHT + 40) {\n            enemies.splice(i, 1);\n        }\n    }\n\n    // Boss movement and attack patterns\n    if (boss) {\n        boss.x += boss.speed * boss.direction * dt;\n\n        if (boss.x < 75 || boss.x > WIDTH - 75) {\n            boss.direction *= -1;\n        }\n\n        boss.y = 105 + Math.sin(gameTime * 1.4) * 18;\n        boss.attackTimer -= dt;\n        boss.flash = Math.max(0, boss.flash - dt);\n\n        if (boss.attackTimer <= 0) {\n            bossShoot();\n            boss.attackTimer = 0.85;\n        }\n    }\n\n    // Player bullets\n    for (let i = playerBullets.length - 1; i >= 0; i--) {\n        const bullet = playerBullets[i];\n\n        bullet.x += bullet.vx * dt;\n        bullet.y += bullet.vy * dt;\n\n        let removed = false;\n\n        if (boss && hit(bullet, boss, bullet.radius, 42)) {\n            damageBoss(bullet.damage);\n            playerBullets.splice(i, 1);\n            removed = true;\n        }\n\n        if (removed) continue;\n\n        for (let j = enemies.length - 1; j >= 0; j--) {\n            const enemy = enemies[j];\n\n            if (hit(bullet, enemy, bullet.radius, enemy.width * 0.38)) {\n                enemy.hp -= bullet.damage;\n                createParticles(bullet.x, bullet.y, \"#78f3ff\", 3);\n                playerBullets.splice(i, 1);\n                removed = true;\n\n                if (enemy.hp <= 0) {\n                    defeatEnemy(enemy, j);\n                }\n\n                break;\n            }\n        }\n\n        if (!removed && bullet.y < -20) {\n            playerBullets.splice(i, 1);\n        }\n    }\n\n    // Enemy bullets\n    for (let i = enemyBullets.length - 1; i >= 0; i--) {\n        const bullet = enemyBullets[i];\n\n        bullet.x += bullet.vx * dt;\n        bullet.y += bullet.vy * dt;\n\n        if (hit(player, bullet, 12, bullet.radius)) {\n            damagePlayer();\n            enemyBullets.splice(i, 1);\n            continue;\n        }\n\n        if (\n            bullet.y > HEIGHT + 30 ||\n            bullet.y < -30 ||\n            bullet.x < -30 ||\n            bullet.x > WIDTH + 30\n        ) {\n            enemyBullets.splice(i, 1);\n        }\n    }\n\n    // Pickups\n    for (let i = items.length - 1; i >= 0; i--) {\n        const item = items[i];\n\n        item.y += item.speed * dt;\n\n        if (hit(player, item, 15, item.radius)) {\n            collectItem(item);\n            items.splice(i, 1);\n            continue;\n        }\n\n        if (item.y > HEIGHT + 20) {\n            items.splice(i, 1);\n        }\n    }\n\n    updateUI();\n}\n\n// ---------- Drawing (premium dark look) ----------\n\n// Pre-rendered deep-space nebula, tiled vertically for a seamless scroll.\nconst nebula = (() => {\n    const c = document.createElement(\"canvas\");\n    c.width = WIDTH;\n    c.height = HEIGHT * 2;\n    const g = c.getContext(\"2d\");\n\n    g.fillStyle = \"#02030a\";\n    g.fillRect(0, 0, c.width, c.height);\n\n    const blobs = [\n        [150, 200, 280, \"92,44,210\", 0.34],\n        [650, 520, 320, \"24,120,230\", 0.26],\n        [420, 900, 340, \"180,34,160\", 0.24],\n        [90, 1060, 260, \"30,150,210\", 0.22],\n        [700, 1150, 300, \"104,54,230\", 0.26],\n        [330, 560, 220, \"60,24,150\", 0.22]\n    ];\n\n    for (const [x, y, r, color, alpha] of blobs) {\n        for (const offset of [-c.height, 0, c.height]) {\n            const gradient = g.createRadialGradient(x, y + offset, 0, x, y + offset, r);\n            gradient.addColorStop(0, `rgba(${color},${alpha})`);\n            gradient.addColorStop(1, `rgba(${color},0)`);\n            g.fillStyle = gradient;\n            g.fillRect(0, 0, c.width, c.height);\n        }\n    }\n\n    return c;\n})();\n\nfunction drawBackground() {\n    ctx.fillStyle = \"#02030a\";\n    ctx.fillRect(0, 0, WIDTH, HEIGHT);\n\n    const offset = bgScroll % (HEIGHT * 2);\n    ctx.drawImage(nebula, 0, offset - HEIGHT * 2);\n    ctx.drawImage(nebula, 0, offset);\n\n    // Distant planet with an atmosphere rim\n    const px = 640;\n    const py = ((bgScroll * 0.22) % (HEIGHT + 640)) - 320;\n\n    let glow = ctx.createRadialGradient(px, py, 120, px, py, 190);\n    glow.addColorStop(0, \"rgba(90,150,255,0.32)\");\n    glow.addColorStop(1, \"rgba(90,150,255,0)\");\n    ctx.fillStyle = glow;\n    ctx.beginPath();\n    ctx.arc(px, py, 190, 0, Math.PI * 2);\n    ctx.fill();\n\n    const body = ctx.createRadialGradient(px - 55, py - 55, 8, px, py, 135);\n    body.addColorStop(0, \"#2f448f\");\n    body.addColorStop(0.55, \"#0d1739\");\n    body.addColorStop(1, \"#02040c\");\n    ctx.fillStyle = body;\n    ctx.beginPath();\n    ctx.arc(px, py, 135, 0, Math.PI * 2);\n    ctx.fill();\n\n    // Stars (three depth layers, twinkling)\n    for (const star of stars) {\n        const twinkle = 0.55 + 0.45 * Math.sin(time * 2.2 + star.tw);\n        ctx.globalAlpha = (0.3 + star.z * 0.7) * twinkle;\n        ctx.fillStyle = star.color;\n        ctx.fillRect(star.x, star.y, star.size, star.size * (1 + star.z * 2.6));\n    }\n\n    ctx.globalAlpha = 1;\n}\n\nfunction glowCircle(x, y, radius, color, alpha) {\n    const g = ctx.createRadialGradient(x, y, 0, x, y, radius);\n    g.addColorStop(0, `rgba(${color},${alpha})`);\n    g.addColorStop(1, `rgba(${color},0)`);\n    ctx.fillStyle = g;\n    ctx.beginPath();\n    ctx.arc(x, y, radius, 0, Math.PI * 2);\n    ctx.fill();\n}\n\nfunction drawPlayer() {\n    if (\n        player.invincible > 0 &&\n        player.shield <= 0 &&\n        Math.floor(gameTime * 15) % 2 === 0\n    ) {\n        return;\n    }\n\n    ctx.save();\n    ctx.translate(player.x, player.y);\n\n    // Engine glow + flame (additive)\n    const flame = 24 + Math.random() * 9;\n    ctx.globalCompositeOperation = \"lighter\";\n    glowCircle(0, 16, 34, \"80,170,255\", 0.38);\n\n    for (const fx of [-9, 9]) {\n        const fg = ctx.createLinearGradient(0, 12, 0, 12 + flame * 0.75);\n        fg.addColorStop(0, \"rgba(160,240,255,0.95)\");\n        fg.addColorStop(0.5, \"rgba(70,140,255,0.55)\");\n        fg.addColorStop(1, \"rgba(70,70,255,0)\");\n        ctx.fillStyle = fg;\n        ctx.beginPath();\n        ctx.moveTo(fx - 4, 12);\n        ctx.lineTo(fx, 12 + flame * 0.75);\n        ctx.lineTo(fx + 4, 12);\n        ctx.closePath();\n        ctx.fill();\n    }\n\n    const cg = ctx.createLinearGradient(0, 10, 0, 10 + flame);\n    cg.addColorStop(0, \"rgba(255,255,255,0.95)\");\n    cg.addColorStop(0.35, \"rgba(110,225,255,0.75)\");\n    cg.addColorStop(1, \"rgba(60,90,255,0)\");\n    ctx.fillStyle = cg;\n    ctx.beginPath();\n    ctx.moveTo(-5, 10);\n    ctx.lineTo(0, 10 + flame);\n    ctx.lineTo(5, 10);\n    ctx.closePath();\n    ctx.fill();\n    ctx.globalCompositeOperation = \"source-over\";\n\n    // Wings\n    const wing = ctx.createLinearGradient(-30, 0, 30, 0);\n    wing.addColorStop(0, \"#12204a\");\n    wing.addColorStop(0.5, \"#5c8dff\");\n    wing.addColorStop(1, \"#12204a\");\n    ctx.fillStyle = wing;\n    ctx.strokeStyle = \"rgba(127,233,255,0.85)\";\n    ctx.lineWidth = 1;\n    ctx.beginPath();\n    ctx.moveTo(0, -20);\n    ctx.lineTo(8, -4);\n    ctx.lineTo(26, 12);\n    ctx.lineTo(31, 23);\n    ctx.lineTo(11, 15);\n    ctx.lineTo(0, 19);\n    ctx.lineTo(-11, 15);\n    ctx.lineTo(-31, 23);\n    ctx.lineTo(-26, 12);\n    ctx.lineTo(-8, -4);\n    ctx.closePath();\n    ctx.fill();\n    ctx.stroke();\n\n    // Fuselage\n    const body = ctx.createLinearGradient(0, -28, 0, 20);\n    body.addColorStop(0, \"#f2fbff\");\n    body.addColorStop(0.55, \"#8cc4ff\");\n    body.addColorStop(1, \"#3a63c8\");\n    ctx.fillStyle = body;\n    ctx.beginPath();\n    ctx.moveTo(0, -28);\n    ctx.lineTo(6, -6);\n    ctx.lineTo(5, 16);\n    ctx.lineTo(0, 21);\n    ctx.lineTo(-5, 16);\n    ctx.lineTo(-6, -6);\n    ctx.closePath();\n    ctx.fill();\n\n    // Cockpit\n    ctx.shadowBlur = 10;\n    ctx.shadowColor = \"#5fe8ff\";\n    const cockpit = ctx.createLinearGradient(0, -14, 0, 0);\n    cockpit.addColorStop(0, \"#c8fbff\");\n    cockpit.addColorStop(1, \"#1a8dff\");\n    ctx.fillStyle = cockpit;\n    ctx.beginPath();\n    ctx.ellipse(0, -7, 2.8, 7, 0, 0, Math.PI * 2);\n    ctx.fill();\n    ctx.shadowBlur = 0;\n\n    // Wing-tip lights\n    const blink = 0.5 + 0.5 * Math.sin(time * 6);\n    ctx.fillStyle = `rgba(255,90,140,${0.5 + blink * 0.5})`;\n    ctx.beginPath();\n    ctx.arc(-28, 21, 1.8, 0, Math.PI * 2);\n    ctx.fill();\n    ctx.fillStyle = `rgba(110,255,200,${0.5 + (1 - blink) * 0.5})`;\n    ctx.beginPath();\n    ctx.arc(28, 21, 1.8, 0, Math.PI * 2);\n    ctx.fill();\n\n    // Shield\n    if (player.shield > 0 && (player.shield > 1.2 || Math.floor(gameTime * 10) % 2 === 0)) {\n        ctx.globalCompositeOperation = \"lighter\";\n        glowCircle(0, 0, 34, \"90,200,255\", 0.22);\n        ctx.strokeStyle = \"rgba(130,225,255,0.9)\";\n        ctx.lineWidth = 2;\n        ctx.setLineDash([12, 7]);\n        ctx.lineDashOffset = -time * 40;\n        ctx.beginPath();\n        ctx.arc(0, 0, 30, 0, Math.PI * 2);\n        ctx.stroke();\n        ctx.setLineDash([]);\n        ctx.globalCompositeOperation = \"source-over\";\n    }\n\n    ctx.restore();\n}\n\nfunction drawEnemy(enemy) {\n    const rgb = enemy.strong ? \"255,156,85\" : \"255,88,126\";\n    const hex = enemy.strong ? \"#ff9c55\" : \"#ff587e\";\n    const pulse = 0.5 + 0.5 * Math.sin(time * 6 + enemy.phase);\n\n    ctx.save();\n    ctx.translate(enemy.x, enemy.y);\n\n    ctx.globalCompositeOperation = \"lighter\";\n    glowCircle(0, 2, enemy.width * 0.95, rgb, 0.2 + pulse * 0.08);\n    ctx.globalCompositeOperation = \"source-over\";\n\n    const body = ctx.createLinearGradient(0, -16, 0, 20);\n    body.addColorStop(0, enemy.strong ? \"#6a3418\" : \"#6e1630\");\n    body.addColorStop(1, \"#150814\");\n    ctx.fillStyle = body;\n    ctx.strokeStyle = hex;\n    ctx.lineWidth = 1.6;\n    ctx.shadowBlur = 12;\n    ctx.shadowColor = hex;\n\n    ctx.beginPath();\n    ctx.moveTo(0, 18);\n    ctx.lineTo(-enemy.width / 2, -8);\n    ctx.lineTo(-7, -3);\n    ctx.lineTo(0, -15);\n    ctx.lineTo(7, -3);\n    ctx.lineTo(enemy.width / 2, -8);\n    ctx.closePath();\n    ctx.fill();\n    ctx.stroke();\n    ctx.shadowBlur = 0;\n\n    if (enemy.strong) {\n        ctx.strokeStyle = \"rgba(255,200,150,0.55)\";\n        ctx.lineWidth = 1;\n        ctx.beginPath();\n        ctx.moveTo(-enemy.width / 2 + 5, -4);\n        ctx.lineTo(0, 12);\n        ctx.lineTo(enemy.width / 2 - 5, -4);\n        ctx.stroke();\n    }\n\n    // Glowing core\n    ctx.globalCompositeOperation = \"lighter\";\n    glowCircle(0, 1, 9, rgb, 0.7 + pulse * 0.3);\n    ctx.globalCompositeOperation = \"source-over\";\n    ctx.fillStyle = \"#fff\";\n    ctx.beginPath();\n    ctx.arc(0, 1, 2.2, 0, Math.PI * 2);\n    ctx.fill();\n\n    if (enemy.strong) {\n        // gold ring = \"defeat me for a bonus\"\n        ctx.strokeStyle = `rgba(255,210,122,${0.45 + pulse * 0.4})`;\n        ctx.lineWidth = 1.5;\n        ctx.setLineDash([7, 5]);\n        ctx.lineDashOffset = -time * 20;\n        ctx.beginPath();\n        ctx.arc(0, 1, enemy.width * 0.62, 0, Math.PI * 2);\n        ctx.stroke();\n        ctx.setLineDash([]);\n    }\n\n    if (enemy.strong) {\n        ctx.fillStyle = \"rgba(20,8,24,0.85)\";\n        ctx.fillRect(-20, -32, 40, 4);\n        ctx.fillStyle = hex;\n        ctx.shadowBlur = 6;\n        ctx.shadowColor = hex;\n        ctx.fillRect(-20, -32, 40 * enemy.hp / enemy.maxHp, 4);\n        ctx.shadowBlur = 0;\n    }\n\n    ctx.restore();\n}\n\nfunction drawBoss() {\n    if (!boss) return;\n\n    const ratio = boss.hp / boss.maxHp;\n    const pulse = 0.5 + 0.5 * Math.sin(time * (ratio < 0.35 ? 9 : 4));\n    const flash = boss.flash > 0;\n\n    ctx.save();\n    ctx.translate(boss.x, boss.y);\n\n    // Aura\n    ctx.globalCompositeOperation = \"lighter\";\n    glowCircle(0, 0, 130, ratio < 0.35 ? \"255,70,110\" : \"255,62,174\", 0.22 + pulse * 0.12);\n    ctx.globalCompositeOperation = \"source-over\";\n\n    // Thrusters\n    ctx.globalCompositeOperation = \"lighter\";\n    for (const tx of [-34, 0, 34]) {\n        const len = 16 + Math.random() * 10;\n        const tg = ctx.createLinearGradient(0, 30, 0, 30 + len);\n        tg.addColorStop(0, \"rgba(255,120,220,0.9)\");\n        tg.addColorStop(1, \"rgba(180,60,255,0)\");\n        ctx.fillStyle = tg;\n        ctx.beginPath();\n        ctx.moveTo(tx - 6, 30);\n        ctx.lineTo(tx, 30 + len);\n        ctx.lineTo(tx + 6, 30);\n        ctx.closePath();\n        ctx.fill();\n    }\n    ctx.globalCompositeOperation = \"source-over\";\n\n    // Hull\n    const hull = ctx.createLinearGradient(0, -40, 0, 34);\n    hull.addColorStop(0, flash ? \"#ffffff\" : \"#4a1a66\");\n    hull.addColorStop(1, flash ? \"#ffd6f2\" : \"#15061f\");\n    ctx.fillStyle = hull;\n    ctx.strokeStyle = \"#ff5cc8\";\n    ctx.lineWidth = 2;\n    ctx.shadowBlur = 24;\n    ctx.shadowColor = \"#ff3eae\";\n\n    ctx.beginPath();\n    ctx.moveTo(0, -40);\n    ctx.lineTo(35, -27);\n    ctx.lineTo(56, -4);\n    ctx.lineTo(48, 23);\n    ctx.lineTo(20, 34);\n    ctx.lineTo(0, 25);\n    ctx.lineTo(-20, 34);\n    ctx.lineTo(-48, 23);\n    ctx.lineTo(-56, -4);\n    ctx.lineTo(-35, -27);\n    ctx.closePath();\n    ctx.fill();\n    ctx.stroke();\n    ctx.shadowBlur = 0;\n\n    // Armor plating\n    ctx.strokeStyle = \"rgba(255,150,230,0.35)\";\n    ctx.lineWidth = 1;\n    ctx.beginPath();\n    ctx.moveTo(-30, -20); ctx.lineTo(-44, -2); ctx.lineTo(-38, 16);\n    ctx.moveTo(30, -20); ctx.lineTo(44, -2); ctx.lineTo(38, 16);\n    ctx.moveTo(-16, 24); ctx.lineTo(0, 14); ctx.lineTo(16, 24);\n    ctx.stroke();\n\n    // Cannons\n    for (const cx of [-34, 34]) {\n        ctx.fillStyle = \"#2a0d3d\";\n        ctx.fillRect(cx - 8, -6, 16, 14);\n        ctx.globalCompositeOperation = \"lighter\";\n        glowCircle(cx, 8, 11, \"255,110,210\", 0.5 + pulse * 0.4);\n        ctx.globalCompositeOperation = \"source-over\";\n        ctx.fillStyle = \"#ff8ad8\";\n        ctx.fillRect(cx - 3, 6, 6, 4);\n    }\n\n    // Core\n    ctx.globalCompositeOperation = \"lighter\";\n    glowCircle(0, -6, 26, \"100,230,255\", 0.55 + pulse * 0.3);\n    ctx.globalCompositeOperation = \"source-over\";\n    ctx.fillStyle = \"#e9fdff\";\n    ctx.beginPath();\n    ctx.arc(0, -6, 7 + pulse * 1.5, 0, Math.PI * 2);\n    ctx.fill();\n\n    ctx.strokeStyle = \"rgba(120,235,255,0.7)\";\n    ctx.lineWidth = 1.5;\n    ctx.setLineDash([6, 5]);\n    ctx.lineDashOffset = -time * 24;\n    ctx.beginPath();\n    ctx.arc(0, -6, 15, 0, Math.PI * 2);\n    ctx.stroke();\n    ctx.setLineDash([]);\n\n    // Damage cracks\n    if (ratio < 0.5) {\n        ctx.strokeStyle = \"rgba(255,90,110,0.85)\";\n        ctx.lineWidth = 1.4;\n        ctx.beginPath();\n        ctx.moveTo(-24, -26); ctx.lineTo(-14, -10); ctx.lineTo(-22, 2);\n        ctx.moveTo(26, -22); ctx.lineTo(16, -6); ctx.lineTo(24, 10);\n        ctx.stroke();\n    }\n\n    ctx.restore();\n}\n\nfunction drawBullet(bullet, friendly) {\n    ctx.save();\n    ctx.globalCompositeOperation = \"lighter\";\n\n    if (friendly) {\n        const length = 30;\n        const trail = ctx.createLinearGradient(bullet.x, bullet.y, bullet.x - bullet.vx * 0.06, bullet.y + length);\n        trail.addColorStop(0, \"rgba(140,250,255,0.95)\");\n        trail.addColorStop(1, \"rgba(60,120,255,0)\");\n\n        ctx.strokeStyle = trail;\n        ctx.lineWidth = bullet.radius * 1.7;\n        ctx.lineCap = \"round\";\n        ctx.beginPath();\n        ctx.moveTo(bullet.x, bullet.y);\n        ctx.lineTo(bullet.x - bullet.vx * 0.06, bullet.y + length);\n        ctx.stroke();\n\n        glowCircle(bullet.x, bullet.y, bullet.radius * 3.6, \"110,240,255\", 0.5);\n        ctx.fillStyle = \"#fff\";\n        ctx.beginPath();\n        ctx.arc(bullet.x, bullet.y, bullet.radius * 0.7, 0, Math.PI * 2);\n        ctx.fill();\n    } else {\n        const rgb = hexToRgb(bullet.color);\n        glowCircle(bullet.x, bullet.y, bullet.radius * 3.2, rgb, 0.6);\n        ctx.strokeStyle = `rgba(${rgb},0.9)`;\n        ctx.lineWidth = 1.5;\n        ctx.beginPath();\n        ctx.arc(bullet.x, bullet.y, bullet.radius * 0.95, 0, Math.PI * 2);\n        ctx.stroke();\n        ctx.fillStyle = \"#fff\";\n        ctx.beginPath();\n        ctx.arc(bullet.x, bullet.y, bullet.radius * 0.45, 0, Math.PI * 2);\n        ctx.fill();\n    }\n\n    ctx.restore();\n}\n\nfunction hexToRgb(hex) {\n    const n = parseInt(hex.slice(1), 16);\n    return `${(n >> 16) & 255},${(n >> 8) & 255},${n & 255}`;\n}\n\nfunction drawItem(item) {\n    const styles = {\n        double: { rgb: \"255,210,122\", label: \"x2\" },\n        heal: { rgb: \"255,120,155\", label: \"+\" },\n        shield: { rgb: \"112,186,255\", label: \"S\" }\n    };\n\n    const style = styles[item.type];\n\n    ctx.save();\n    ctx.translate(item.x, item.y);\n\n    ctx.globalCompositeOperation = \"lighter\";\n    glowCircle(0, 0, item.radius * 2.6, style.rgb, 0.4);\n    ctx.globalCompositeOperation = \"source-over\";\n\n    ctx.fillStyle = \"rgba(6,12,30,0.92)\";\n    ctx.beginPath();\n    ctx.arc(0, 0, item.radius, 0, Math.PI * 2);\n    ctx.fill();\n\n    ctx.strokeStyle = `rgba(${style.rgb},0.95)`;\n    ctx.lineWidth = 2;\n    ctx.setLineDash([9, 5]);\n    ctx.lineDashOffset = -time * 30;\n    ctx.beginPath();\n    ctx.arc(0, 0, item.radius, 0, Math.PI * 2);\n    ctx.stroke();\n    ctx.setLineDash([]);\n\n    ctx.fillStyle = `rgb(${style.rgb})`;\n    ctx.font = \"bold 14px Orbitron, Arial\";\n    ctx.textAlign = \"center\";\n    ctx.textBaseline = \"middle\";\n    ctx.fillText(style.label, 0, 1);\n\n    ctx.restore();\n}\n\nfunction drawParticles() {\n    ctx.save();\n    ctx.globalCompositeOperation = \"lighter\";\n\n    for (const p of particles) {\n        const life = Math.max(0, p.life / p.maxLife);\n        ctx.globalAlpha = life;\n        ctx.fillStyle = p.color;\n        const size = p.size * (0.5 + life * 0.8);\n        ctx.fillRect(p.x - size / 2, p.y - size / 2, size, size);\n    }\n\n    ctx.restore();\n}\n\nfunction drawRings() {\n    ctx.save();\n    ctx.globalCompositeOperation = \"lighter\";\n\n    for (const ring of rings) {\n        const life = 1 - ring.r / ring.max;\n        ctx.strokeStyle = `rgba(${ring.color},${life * 0.9})`;\n        ctx.lineWidth = 1 + life * 4;\n        ctx.beginPath();\n        ctx.arc(ring.x, ring.y, ring.r, 0, Math.PI * 2);\n        ctx.stroke();\n    }\n\n    ctx.restore();\n}\n\nfunction draw() {\n    ctx.save();\n\n    if (shake > 0) {\n        ctx.translate(\n            random(-shake, shake),\n            random(-shake, shake)\n        );\n    }\n\n    drawBackground();\n\n    for (const item of items) drawItem(item);\n    for (const enemy of enemies) drawEnemy(enemy);\n    for (const bullet of playerBullets) drawBullet(bullet, true);\n    for (const bullet of enemyBullets) drawBullet(bullet, false);\n\n    drawBoss();\n\n    if (player) drawPlayer();\n\n    drawParticles();\n    drawRings();\n\n    ctx.restore();\n\n    // Damage flash (red screen edge)\n    if (hurtFlash > 0) {\n        const g = ctx.createRadialGradient(\n            WIDTH / 2, HEIGHT / 2, HEIGHT * 0.3,\n            WIDTH / 2, HEIGHT / 2, HEIGHT * 0.85\n        );\n        g.addColorStop(0, \"rgba(255,40,80,0)\");\n        g.addColorStop(1, `rgba(255,40,80,${hurtFlash})`);\n        ctx.fillStyle = g;\n        ctx.fillRect(0, 0, WIDTH, HEIGHT);\n    }\n}\n\n// ---------- Main loop ----------\n\nfunction loop(timestamp) {\n    const dt = Math.min((timestamp - lastTime) / 1000 || 0, 0.033);\n    lastTime = timestamp;\n    time += dt;\n    bgScroll += dt * (state === \"playing\" ? 34 : 12);\n\n    if (state === \"playing\") {\n        update(dt);\n    } else {\n        // Stars continue moving while paused or at the title screen.\n        for (const star of stars) {\n            star.y += star.speed * dt * 0.35;\n\n            if (star.y > HEIGHT) {\n                star.y = 0;\n                star.x = Math.random() * WIDTH;\n            }\n        }\n    }\n\n    draw();\n    animationId = requestAnimationFrame(loop);\n}\n\n// ---------- Initial screen ----------\n\nplayer = {\n    x: WIDTH / 2,\n    y: HEIGHT - 75,\n    width: 30,\n    height: 36,\n    speed: 300,\n    hp: 3,\n    power: 1,\n    double: 0,\n    shootTimer: 0,\n    invincible: 0,\n    shield: 0\n};\n\nbestScoreElement.textContent = bestScore;\nupdateUI();\n\nshowOverlay(\n    \"SPACE SHOOTER\",\n    \"宇宙を守れ！敵を倒してボスを撃破しよう！\",\n    \"GAME START\"\n);\n\nlastTime = performance.now();\nanimationId = requestAnimationFrame(loop);\n\n<\/script>\n</body>\n</html>\n",
  'card-matching': "\n<!DOCTYPE html>\n<html lang=\"ja\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Card Matching - SPACE SHOOTER × CARD MATCHING</title>\n    <!-- Tailwind CSS -->\n    <script src=\"https://cdn.tailwindcss.com\"><\/script>\n    <!-- Google Fonts -->\n    <link href=\"https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Noto+Sans+JP:wght@400;700&display=swap\" rel=\"stylesheet\">\n    <!-- FontAwesome Icons -->\n    <link rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css\">\n    <!-- Canvas Confetti for Clear Effect -->\n    <script src=\"https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js\"><\/script>\n\n    <style>\n        body {\n            font-family: 'Noto Sans JP', sans-serif;\n            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);\n            color: #ffffff;\n            height: 100vh;\n            height: 100dvh;\n            overflow: hidden;\n            user-select: none;\n            -webkit-tap-highlight-color: transparent;\n        }\n\n        .font-orbitron {\n            font-family: 'Orbitron', sans-serif;\n        }\n\n        .stars-container {\n            position: fixed;\n            top: 0;\n            left: 0;\n            width: 100%;\n            height: 100%;\n            pointer-events: none;\n            z-index: 0;\n            overflow: hidden;\n        }\n\n        .star {\n            position: absolute;\n            background-color: #ffffff;\n            border-radius: 50%;\n            animation: infinite alternate animate-twinkle;\n        }\n\n        @keyframes animate-twinkle {\n            0% { opacity: 0.2; transform: scale(0.8); }\n            100% { opacity: 1; transform: scale(1.2); }\n        }\n\n        .neon-panel {\n            background: rgba(15, 23, 42, 0.75);\n            backdrop-filter: blur(12px);\n            border: 1px solid rgba(56, 189, 248, 0.3);\n            box-shadow: 0 0 20px rgba(56, 189, 248, 0.15), inset 0 0 15px rgba(56, 189, 248, 0.05);\n        }\n\n        .neon-text-cyan { text-shadow: 0 0 8px rgba(56, 189, 248, 0.8), 0 0 16px rgba(56, 189, 248, 0.4); }\n        .neon-text-pink { text-shadow: 0 0 8px rgba(244, 114, 182, 0.8), 0 0 16px rgba(244, 114, 182, 0.4); }\n        .neon-text-amber { text-shadow: 0 0 8px rgba(251, 191, 36, 0.8), 0 0 16px rgba(251, 191, 36, 0.4); }\n\n        .card-container { perspective: 1000px; }\n        .card-inner {\n            position: relative;\n            width: 100%;\n            height: 100%;\n            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);\n            transform-style: preserve-3d;\n            cursor: pointer;\n        }\n\n        .card-container.flipped .card-inner,\n        .card-container.matched .card-inner,\n        .card-container.hinted .card-inner {\n            transform: rotateY(180deg);\n        }\n\n        .card-container.matched { animation: pulse-match 0.5s ease-out; }\n\n        @keyframes pulse-match {\n            0% { transform: scale(1); }\n            50% { transform: scale(1.1); }\n            100% { transform: scale(1); }\n        }\n\n        /* 画面振れ演出 */\n        .shake { animation: shake-anim 0.3s ease-in-out; }\n        @keyframes shake-anim {\n            0%, 100% { transform: translate(0, 0); }\n            20% { transform: translate(-8px, 6px); }\n            40% { transform: translate(8px, -6px); }\n            60% { transform: translate(-5px, 3px); }\n            80% { transform: translate(5px, -3px); }\n        }\n\n        .card-front, .card-back {\n            position: absolute;\n            width: 100%;\n            height: 100%;\n            backface-visibility: hidden;\n            border-radius: 0.75rem;\n            display: flex;\n            align-items: center;\n            justify-content: center;\n
