 46px) !important;\n            color: #f7df9a !important;\n            filter: drop-shadow(0 2px 0 #6e151a) drop-shadow(0 0 8px rgba(255,210,105,.65));\n        }\n        .card-container:hover .card-back {\n            border-color: #fff0b0 !important;\n            box-shadow: inset 0 0 0 3px #31121b, inset 0 0 0 5px #fff0b0, 0 0 15px rgba(255,205,90,.55) !important;\n        }\n\n        .card-container:hover .card-back {\n            border-color: #fff0b0 !important;\n            box-shadow: inset 0 0 0 3px #31121b, inset 0 0 0 5px #fff0b0, 0 0 15px rgba(255,205,90,.55) !important;\n        }\n\n        .card-front {\n            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);\n            border: 2px solid #a855f7;\n            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);\n            transform: rotateY(180deg);\n        }\n\n        .card-container.matched .card-front {\n            border-color: #34d399;\n            box-shadow: 0 0 15px rgba(52, 211, 153, 0.5);\n            background: linear-gradient(135deg, #064e3b 0%, #022c22 100%);\n        }\n\n        .card-container.bomb .card-front {\n            border-color: #ef4444;\n            box-shadow: 0 0 15px rgba(239, 68, 68, 0.8);\n            background: linear-gradient(135deg, #450a0a 0%, #180505 100%);\n        }\n\n        .grid-2x2 { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); }\n        .grid-4x4 { grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(0, 1fr)); }\n        .grid-6x6 { grid-template-columns: repeat(6, minmax(0, 1fr)); grid-template-rows: repeat(6, minmax(0, 1fr)); }\n\n        /* Board always fits the remaining screen as a square */\n        #game-board-container { flex: 1; min-height: 0; container-type: size; display: flex; align-items: center; justify-content: center; }\n        #game-board { width: min(100cqw, 100cqh); height: min(100cqw, 100cqh); }\n        .card-container { width: 100%; height: 100%; min-width: 0; min-height: 0; container-type: size; touch-action: manipulation; }\n        .card-front, .card-back { -webkit-backface-visibility: hidden; }\n        .card-inner { transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1); }\n        .card-container:not(.flipped):not(.matched):active .card-inner { transform: scale(0.95); }\n\n        /* 3D logo */\n        .logo3d {\n            font-size: 58cqmin; line-height: 1; display: block;\n            filter: drop-shadow(0 4px 3px rgba(0,0,0,.55)) drop-shadow(0 0 8px rgba(255,255,255,.25));\n            transform: translateZ(30px);\n            animation: float3d 2.2s ease-in-out infinite;\n        }\n        @keyframes float3d { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-6%) rotate(3deg); } }\n        .card-front {\n            background: radial-gradient(circle at 30% 25%, #ffffff 0%, #c7d2fe 35%, #6366f1 100%) !important;\n            border-color: #a855f7 !important;\n        }\n        .card-container.matched .card-front { background: radial-gradient(circle at 30% 25%, #ecfdf5 0%, #6ee7b7 45%, #059669 100%) !important; }\n        .card-container.bomb .card-front { background: radial-gradient(circle at 30% 25%, #fee2e2 0%, #f87171 45%, #991b1b 100%) !important; }\n        .card-back { background: radial-gradient(circle at 30% 25%, #334155 0%, #1e293b 45%, #0b1020 100%); }\n        .back-logo { font-size: 45cqmin; color: rgba(56,189,248,.75); filter: drop-shadow(0 3px 3px rgba(0,0,0,.7)) drop-shadow(0 0 6px rgba(56,189,248,.6)); }\n\n        /* ===== INTRO CINEMATIC ===== */\n        #intro { background: radial-gradient(ellipse at center, #0b1330 0%, #03050d 100%); transition: opacity .6s ease; }\n        #intro.out { opacity: 0; pointer-events: none; }\n        #intro .vignette { position:absolute; inset:0; pointer-events:none; background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.75) 100%); }\n        .letterbox { position:absolute; left:0; right:0; height:0; background:#000; z-index:3; transition: height 1s ease; }\n        #intro.playing .letterbox { height: 7vh; }\n        .scene { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:0 1.25rem; opacity:0; pointer-events:none; transition: opacity .6s ease; z-index:2; }\n        .scene.show { opacity:1; pointer-events:auto; }\n        .scene.show .rise { animation: rise .8s cubic-bezier(.2,.8,.2,1) both; animation-delay: var(--d, 0s); }\n        .scene .rise { opacity:0; }\n        @keyframes rise { from { opacity:0; transform: translateY(24px) scale(.96); filter: blur(6px); } to { opacity:1; transform:none; filter:none; } }\n        .title-grad { background: linear-gradient(90deg,#67e8f9,#c084fc,#f472b6); -webkit-background-clip:text; background-clip:text; color:transparent; filter: drop-shadow(0 0 18px rgba(103,232,249,.45)); }\n        .emblem { font-size: clamp(3.5rem, 14vmin, 8rem); filter: drop-shadow(0 10px 10px rgba(0,0,0,.6)) drop-shadow(0 0 22px rgba(103,232,249,.5)); animation: spin3d 4s ease-in-out infinite; transform-style: preserve-3d; }\n        @keyframes spin3d { 0%,100% { transform: perspective(600px) rotateY(-25deg) rotateX(8deg); } 50% { transform: perspective(600px) rotateY(25deg) rotateX(-8deg) translateY(-8px); } }\n        .play-btn { position:relative; animation: pulse-glow 1.8s ease-in-out infinite; }\n        @keyframes pulse-glow { 0%,100% { box-shadow: 0 0 20px rgba(56,189,248,.5); transform: scale(1); } 50% { box-shadow: 0 0 45px rgba(56,189,248,.95); transform: scale(1.05); } }\n        .step-card { width: clamp(6.5rem, 26vw, 11rem); }\n        .count-num { font-size: clamp(6rem, 28vmin, 14rem); animation: pop .75s ease-out both; }\n        @keyframes pop { 0% { transform: scale(2.2); opacity:0; } 35% { transform: scale(1); opacity:1; } 100% { transform: scale(.9); opacity:.85; } }\n        #intro-progress { position:absolute; left:0; bottom:0; height:4px; width:0; z-index:4; background: linear-gradient(90deg,#22d3ee,#a855f7,#f472b6); box-shadow: 0 0 12px #22d3ee; }\n        #intro.playing #intro-progress { width:100%; transition: width 12.3s linear; }\n        #skip-btn { display:none; }\n        #intro.playing #skip-btn { display:flex; }\n        .dealing .card-container { animation: deal .55s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i) * 35ms); }\n        @keyframes deal { from { opacity:0; transform: translateY(-40px) scale(.6) rotate(-8deg); } to { opacity:1; transform:none; } }\n\n        /* Embedded inside title-mode.html (parent provides the BACK button) */\n        html.embedded body { padding-top: 58px; }\n        html.embedded header { justify-content: flex-end; }\n        html.embedded #home-link, html.embedded #scene-0 { display: none; }\n\n        /* ===== Intro: scattered cards ===== */\n        #play-stage { position:absolute; inset:0; z-index:2; pointer-events:none; opacity:0; transition: opacity .5s; }\n        #intro.playing #play-stage { opacity:1; }\n        #cap { position:absolute; left:0; right:0; top:calc(7vh + 14px); text-align:center; padding:0 16px; z-index:8; }\n        #cap.cap-anim { animation: rise .7s cubic-bezier(.2,.8,.2,1) both; }\n        #cap-t { font-family:'Orbitron',sans-serif; font-weight:900; letter-spacing:.14em; font-size:clamp(1.15rem,4.6vw,2.4rem); }\n        #cap-s { margin-top:6px; color:#bae6fd; font-size:clamp(.78rem,2.1vw,1.05rem); text-shadow:0 2px 8px #000; }\n        #cap-j { margin-top:2px; color:#94a3b8; font-size:clamp(.68rem,1.7vw,.85rem); }\n        #intro-count { margin-top:8px; font-family:'Orbitron',sans-serif; font-weight:800; color:#fde047; letter-spacing:.2em; font-size:clamp(.8rem,2vw,1rem); text-shadow:0 0 10px rgba(250,204,21,.6); }\n        #intro-rules { margin-top:6px; font-family:'Orbitron',sans-serif; color:#cbd5e1; font-size:clamp(.62rem,1.6vw,.8rem); letter-spacing:.06em; }\n        #cardfield { position:absolute; inset:0; }\n        .ic { position:absolute; left:0; top:0; width:var(--cs); height:var(--cs); transition: transform var(--t,.6s) cubic-bezier(.2,.8,.2,1); will-change:transform; }\n        .ic-in { width:100%; height:100%; perspective:600px; animation: drift 3s ease-in-out infinite alternate; }\n        .ic.settled .ic-in { animation:none; }\n        @keyframes drift { from { transform: translate(-6px,-8px) rotate(-5deg); } to { transform: translate(6px,8px) rotate(5deg); } }\n        .flipper { position:relative; width:100%; height:100%; transform-style:preserve-3d; transition: transform .55s; }\n        .ic.flipcard .flipper { transform: rotateY(180deg); }\n        .ic .f, .ic .b { position:absolute; inset:0; border-radius:16%; display:flex; align-items:center; justify-content:center; -webkit-backface-visibility:hidden; backface-visibility:hidden; box-shadow:0 8px 18px rgba(0,0,0,.55); }\n        .ic .f { background:radial-gradient(circle at 30% 25%,#fff 0%,#c7d2fe 35%,#6366f1 100%); border:2px solid #a855f7; }\n        .ic .b { transform:rotateY(180deg); background:radial-gradient(circle at 30% 25%,#334155 0%,#1e293b 45%,#0b1020 100%); border:2px solid rgba(56,189,248,.65); color:rgba(56,189,248,.85); font-size:calc(var(--cs)*.4); }\n        .ilogo { font-size:calc(var(--cs)*.56); line-height:1; filter:drop-shadow(0 4px 3px rgba(0,0,0,.5)); }\n        .ic.pick { filter:drop-shadow(0 0 12px #22d3ee) drop-shadow(0 0 24px rgba(34,211,238,.7)); }\n        .ic.pick::after { content:''; position:absolute; inset:-8%; border:2px solid #22d3ee; border-radius:20%; animation: ringp .7s ease-out infinite; }\n        @keyframes ringp { from { transform:scale(.92); opacity:1; } to { transform:scale(1.3); opacity:0; } }\n        .ic.done { filter:drop-shadow(0 0 14px #34d399); }\n        #tray { position:absolute; left:50%; bottom:calc(7vh + 16px); transform:translateX(-50%); display:grid; grid-template-columns:repeat(8,var(--ss)); grid-auto-rows:var(--ss); gap:6px; padding:10px 12px; border-radius:16px; border:1px solid rgba(56,189,248,.35); background:rgba(8,14,34,.55); backdrop-filter:blur(6px); transition: border-color .5s, box-shadow .5s; }\n        #tray .slot { border:1px dashed rgba(148,163,184,.4); border-radius:20%; }\n        #tray.restored { border-color:#34d399; box-shadow:0 0 30px rgba(52,211,153,.55); }\n        #seeker { position:absolute; left:0; top:0; width:64px; height:64px; opacity:0; z-index:25; transition: transform var(--t,.4s) cubic-bezier(.3,.8,.3,1), opacity .3s; }\n        #seeker.show { opacity:1; }\n        #seeker .ring { position:absolute; inset:0; border:3px dashed #22d3ee; border-radius:50%; box-shadow:0 0 16px #22d3ee, inset 0 0 12px rgba(34,211,238,.5); animation: xspin 3s linear infinite; }\n        #seeker i { position:absolute; left:34px; top:30px; font-size:30px; color:#fff; filter:drop-shadow(0 3px 4px #000) drop-shadow(0 0 8px #22d3ee); transform:rotate(-20deg); }\n        .burst { position:absolute; z-index:30; pointer-events:none; }\n        .burst span { position:absolute; transform:translate(-50%,-50%); white-space:nowrap; font:900 clamp(14px,3.4vw,26px) 'Orbitron',sans-serif; color:#fde047; text-shadow:0 0 14px #facc15; animation: bpop .9s ease-out forwards; }\n        .burst i { position:absolute; left:0; top:0; width:8px; height:8px; margin:-4px; border-radius:50%; background:#fde047; box-shadow:0 0 10px #facc15; animation: spark .7s ease-out forwards; }\n        @keyframes spark { from { transform:rotate(var(--a)) translateX(0); } to { transform:rotate(var(--a)) translateX(70px); opacity:0; } }\n        @keyframes bpop { 0% { opacity:0; transform:translate(-50%,-50%) scale(.4); } 25% { opacity:1; transform:translate(-50%,-90%) scale(1.15); } 100% { opacity:0; transform:translate(-50%,-170%) scale(1); } }\n        @keyframes xspin { to { transform:rotate(360deg); } }\n        #count-wrap { position:absolute; left:0; right:0; top:42%; display:flex; justify-content:center; z-index:9; }\n        #count-wrap .count-num { font-size:clamp(4.5rem,20vmin,10rem); }\n    </style>\n</head>\n<body id=\"body-root\" class=\"flex flex-col items-center gap-2 p-2 md:p-4 relative overflow-hidden\">\n\n    <div class=\"stars-container\" id=\"stars-bg\"></div>\n\n    <header class=\"w-full max-w-4xl z-10 shrink-0 flex flex-wrap items-center justify-between gap-2\">\n        <a id=\"home-link\" href=\"title-mode.html\" class=\"px-4 py-2 bg-slate-800/80 hover:bg-slate-700/90 text-cyan-300 border border-cyan-500/40 rounded-xl text-xs font-bold font-orbitron transition flex items-center gap-2 shadow-lg\">\n            <i class=\"fa-solid fa-house\"></i>\n            <span>タイトルへ</span>\n        </a>\n\n        <div class=\"flex items-center gap-2\">\n            <span class=\"text-xs text-slate-400 font-bold uppercase font-orbitron mr-1 hidden sm:inline\">Difficulty:</span>\n            <button onclick=\"setDifficulty('easy')\" id=\"btn-easy\" class=\"diff-btn px-3 py-1.5 rounded-lg text-xs font-orbitron font-bold transition border border-cyan-500/30 text-slate-300 hover:text-white\">EASY (2x2)</button>\n            <button onclick=\"setDifficulty('normal')\" id=\"btn-normal\" class=\"diff-btn px-3 py-1.5 rounded-lg text-xs font-orbitron font-bold transition border border-cyan-500/30 text-slate-300 hover:text-white\">NORMAL (4x4)</button>\n            <button onclick=\"setDifficulty('hard')\" id=\"btn-hard\" class=\"diff-btn px-3 py-1.5 rounded-lg text-xs font-orbitron font-bold transition border border-cyan-500/30 text-slate-300 hover:text-white\">HARD (6x6)</button>\n        </div>\n    </header>\n\n    <main class=\"w-full max-w-4xl z-10 flex flex-col items-center flex-1 min-h-0\">\n        <!-- Dashboard Panel -->\n        <div class=\"w-full neon-panel rounded-2xl p-2 md:p-3 mb-2 shrink-0 grid grid-cols-5 gap-2 text-center items-center\">\n            <!-- SCORE -->\n            <div class=\"flex flex-col items-center\">\n                <span class=\"text-[10px] md:text-xs text-cyan-400 font-orbitron tracking-wider uppercase font-bold\">SCORE</span>\n                <span id=\"score-display\" class=\"text-base md:text-2xl font-black font-orbitron neon-text-cyan text-cyan-300\">0</span>\n            </div>\n\n            <!-- COMBO -->\n            <div class=\"flex flex-col items-center border-l border-slate-700/60\">\n                <span class=\"text-[10px] md:text-xs text-yellow-400 font-orbitron tracking-wider uppercase font-bold\">COMBO</span>\n                <span id=\"combo-display\" class=\"text-base md:text-2xl font-black font-orbitron text-yellow-300\">x0</span>\n            </div>\n\n            <!-- TIMER -->\n            <div class=\"flex flex-col items-center border-l border-slate-700/60\">\n                <span class=\"text-[10px] md:text-xs text-pink-400 font-orbitron tracking-wider uppercase font-bold\">TIMER</span>\n                <span id=\"timer-display\" class=\"text-base md:text-2xl font-black font-orbitron neon-text-pink text-pink-400\">030</span>\n            </div>\n\n            <!-- MOVES -->\n            <div class=\"flex flex-col items-center border-l border-slate-700/60\">\n                <span class=\"text-[10px] md:text-xs text-amber-400 font-orbitron tracking-wider uppercase font-bold\">MOVES</span>\n                <span id=\"moves-display\" class=\"text-base md:text-2xl font-black font-orbitron neon-text-amber text-amber-300\">0</span>\n            </div>\n\n            <!-- RESET / HINT -->\n            <div class=\"flex flex-col gap-1 items-center justify-center border-l border-slate-700/60\">\n                <button id=\"hint-btn\" onclick=\"useHint()\" class=\"w-full py-1 px-1 bg-purple-600/80 hover:bg-purple-500 text-white font-bold font-orbitron text-[10px] md:text-xs rounded-lg shadow transition active:scale-95 border border-purple-400/40 flex items-center justify-center gap-1\">\n                    <i class=\"fa-solid fa-eye\"></i>\n                    <span id=\"hint-text\">HINT (1)</span>\n                </button>\n                <button onclick=\"resetGame()\" class=\"w-full py-1 px-1 bg-red-600/80 hover:bg-red-500 text-white font-bold font-orbitron text-[10px] md:text-xs rounded-lg shadow transition active:scale-95 border border-red-400/40 flex items-center justify-center gap-1\">\n                    <i class=\"fa-solid fa-rotate-right\"></i>\n                    <span>RESET</span>\n                </button>\n            </div>\n        </div>\n\n        <!-- Combo Banner Pop-up -->\n        <div id=\"combo-banner\" class=\"fixed left-0 right-0 top-28 text-center pointer-events-none z-40 text-lg md:text-2xl font-black font-orbitron text-yellow-400 tracking-widest uppercase transition-opacity opacity-0\" style=\"text-shadow:0 0 12px rgba(250,204,21,.9)\">\n            FEVER MODE x2!\n        </div>\n\n        <div id=\"game-board-container\" class=\"w-full\">\n            <div id=\"game-board\" class=\"grid gap-2 p-2 neon-panel rounded-2xl\"></div>\n        </div>\n    </main>\n\n    <!-- 学園祭ハイスコア掲示板 (フッター上) -->\n    <div class=\"z-10 shrink-0 w-full max-w-4xl neon-panel rounded-xl p-1.5 md:p-2 flex items-center justify-between text-xs font-orbitron\">\n        <span class=\"text-amber-400 font-bold flex items-center gap-1\">\n            <i class=\"fa-solid fa-crown text-yellow-400\"></i> HIGH SCORES:\n        </span>\n        <div id=\"high-scores-list\" class=\"flex gap-4 text-slate-300 font-bold\">\n            <!-- JSで上位スコアを動的更新 -->\n        </div>\n    </div>\n\n\n    <!-- INTRO CINEMATIC -->\n    <div id=\"intro\" class=\"fixed inset-0 z-[60] overflow-hidden\">\n        <canvas id=\"warp\" class=\"absolute inset-0 w-full h-full\"></canvas>\n        <div class=\"vignette\"></div>\n        <div class=\"letterbox\" style=\"top:0\"></div>\n        <div class=\"letterbox\" style=\"bottom:0\"></div>\n\n        <button id=\"skip-btn\" onclick=\"skipIntro()\" class=\"absolute top-[8vh] right-4 z-10 items-center gap-2 px-4 py-2 rounded-lg bg-slate-900/70 hover:bg-slate-800 border border-slate-500/50 text-slate-200 text-xs font-orbitron font-bold tracking-widest transition backdrop-blur\">\n            SKIP <i class=\"fa-solid fa-forward\"></i>\n        </button>\n\n        <!-- Scene 0: Launch -->\n        <div id=\"scene-0\" class=\"scene show\">\n            <div class=\"rise text-[10px] md:text-xs font-orbitron tracking-[.4em] text-cyan-300/80 mb-4\" style=\"--d:.1s\">FESTIVAL EDITION 2026</div>\n            <div class=\"rise emblem mb-2\" style=\"--d:.2s\">🚀</div>\n            <h1 class=\"rise font-orbitron font-black title-grad text-3xl md:text-6xl tracking-wider leading-tight\" style=\"--d:.3s\">SPACE SHOOTER</h1>\n            <div class=\"rise font-orbitron text-slate-300 tracking-[.5em] text-sm md:text-lg my-1\" style=\"--d:.4s\">×</div>\n            <h2 class=\"rise font-orbitron font-extrabold text-white text-2xl md:text-5xl tracking-widest mb-8\" style=\"--d:.5s\">CARD MATCHING</h2>\n            <button id=\"play-btn\" onclick=\"startIntro()\" class=\"rise play-btn px-10 py-4 rounded-2xl bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-orbitron font-black tracking-[.3em] text-base md:text-lg border border-cyan-300/60\" style=\"--d:.7s\">\n                <i class=\"fa-solid fa-play mr-2\"></i>PLAY\n            </button>\n            <div class=\"rise mt-4 text-[10px] text-slate-400 font-orbitron tracking-widest\" style=\"--d:.9s\">PRESS ENTER / クリックでスタート</div>\n        </div>\n\n        <!-- Intro stage: scattered cards -> player matches pairs -> order restored -->\n        <div id=\"play-stage\">\n            <div id=\"cap\">\n                <div id=\"cap-t\" class=\"title-grad\"></div>\n                <div id=\"cap-s\"></div>\n                <div id=\"cap-j\"></div>\n                <div id=\"intro-count\"></div>\n                <div id=\"intro-rules\"></div>\n            </div>\n            <div id=\"cardfield\"></div>\n            <div id=\"tray\"></div>\n            <div id=\"seeker\"><span class=\"ring\"></span><i class=\"fa-solid fa-hand-pointer\"></i></div>\n            <div id=\"count-wrap\"><div id=\"count-num\" class=\"count-num font-orbitron font-black title-grad\"></div></div>\n        </div>\n\n        <div id=\"intro-progress\"></div>\n    </div>\n\n    <!-- CLEAR MODAL -->\n    <div id=\"clear-modal\" class=\"fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md hidden p-4\">\n        <div class=\"neon-panel rounded-3xl p-6 md:p-8 max-w-md w-full text-center space-y-5 border-2 border-cyan-400 shadow-[0_0_50px_rgba(56,189,248,0.4)]\">\n            <div class=\"text-5xl text-amber-400 animate-bounce\">\n                <i class=\"fa-solid fa-trophy drop-shadow-[0_0_20px_rgba(251,191,36,0.8)]\"></i>\n            </div>\n            <h2 class=\"text-2xl md:text-3xl font-black font-orbitron neon-text-cyan text-cyan-300 uppercase tracking-wider\">\n                MISSION CLEAR!\n            </h2>\n            \n            <div class=\"bg-slate-900/80 rounded-2xl p-4 space-y-2 border border-slate-700 text-sm\">\n                <div class=\"flex justify-between items-center text-slate-300\">\n                    <span>基本スコア:</span>\n                    <span id=\"modal-base-score\" class=\"font-bold font-orbitron text-cyan-300\">0</span>\n                </div>\n                <div class=\"flex justify-between items-center text-slate-300\">\n                    <span>タイムボーナス:</span>\n                    <span id=\"modal-time-bonus\" class=\"font-bold font-orbitron text-amber-300\">+0</span>\n                </div>\n                <div class=\"flex justify-between items-center text-slate-300\">\n                    <span>最大コンボ:</span>\n                    <span id=\"modal-max-combo\" class=\"font-bold font-orbitron text-yellow-300\">x0</span>\n                </div>\n                <div class=\"flex justify-between items-center text-slate-300\">\n                    <span>総移動回数 (Moves):</span>\n                    <span id=\"modal-moves\" class=\"font-bold font-orbitron text-purple-300\">0</span>\n                </div>\n                <hr class=\"border-slate-800 my-1\">\n                <div class=\"flex justify-between items-center text-base font-extrabold text-white\">\n                    <span>最終スコア:</span>\n                    <span id=\"modal-final-score\" class=\"text-xl font-orbitron text-amber-400 neon-text-amber\">0</span>\n                </div>\n            </div>\n\n            <div class=\"flex flex-col gap-2.5\">\n                <button id=\"next-level-btn\" onclick=\"nextLevel()\" class=\"w-full py-3 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-black font-orbitron rounded-xl shadow-lg transition active:scale-95 text-xs md:text-sm uppercase tracking-wider flex items-center justify-center gap-2\">\n                    <span>次のレベルへ</span>\n                    <i class=\"fa-solid fa-arrow-right\"></i>\n                </button>\n\n                <div class=\"flex gap-2.5\">\n                    <button onclick=\"resetGame()\" class=\"flex-1 py-2.5 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold font-orbitron rounded-xl shadow-lg transition active:scale-95 text-xs\">\n                        もう一度あそぶ\n                    </button>\n                    <a href=\"title-mode.html\" class=\"flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold font-orbitron rounded-xl border border-slate-600 transition flex items-center justify-center text-xs\">\n                        タイトルへ\n                    </a>\n                </div>\n            </div>\n        </div>\n    </div>\n\n    <!-- GAME OVER MODAL -->\n    <div id=\"gameover-modal\" class=\"fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-md hidden p-4\">\n        <div class=\"neon-panel rounded-3xl p-6 md:p-8 max-w-md w-full text-center space-y-5 border-2 border-red-500 shadow-[0_0_50px_rgba(239,68,68,0.4)]\">\n            <div class=\"text-5xl text-red-500 animate-pulse\">\n                <i class=\"fa-solid fa-triangle-exclamation\"></i>\n            </div>\n            <h2 class=\"text-2xl md:text-3xl font-black font-orbitron text-red-500 drop-shadow-[0_0_15px_rgba(239,68,68,0.8)] uppercase tracking-wider\">\n                TIME UP - GAME OVER\n            </h2>\n            <p class=\"text-xs text-slate-300\">制限時間内に全てのカードを揃えることができませんでした。</p>\n\n            <div class=\"flex gap-3 pt-2\">\n                <button onclick=\"resetGame()\" class=\"flex-1 py-3 bg-gradient-to-r from-red-600 to-pink-600 hover:from-red-500 hover:to-pink-500 text-white font-bold font-orbitron rounded-xl shadow-lg transition active:scale-95 text-xs md:text-sm\">\n                    RETRY\n                </button>\n                <a href=\"title-mode.html\" class=\"flex-1 py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold font-orbitron rounded-xl border border-slate-600 transition flex items-center justify-center text-xs md:text-sm\">\n                    タイトルへ\n                </a>\n            </div>\n        </div>\n    </div>\n\n    <script>\n        // Web Audio API による即時効果音（ファイル読み込み不要）\n        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();\n        function playSound(type) {\n            if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});\n            const osc = audioCtx.createOscillator();\n            const gain = audioCtx.createGain();\n            osc.connect(gain);\n            gain.connect(audioCtx.destination);\n\n            const now = audioCtx.currentTime;\n            if (type === 'flip') {\n                osc.frequency.setValueAtTime(400, now);\n                osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);\n                gain.gain.setValueAtTime(0.1, now);\n                gain.gain.linearRampToValueAtTime(0.01, now + 0.08);\n                osc.start(now); osc.stop(now + 0.08);\n            } else if (type === 'match') {\n                osc.type = 'triangle';\n                osc.frequency.setValueAtTime(523.25, now);\n                osc.frequency.setValueAtTime(659.25, now + 0.08);\n                gain.gain.setValueAtTime(0.2, now);\n                gain.gain.linearRampToValueAtTime(0.01, now + 0.25);\n                osc.start(now); osc.stop(now + 0.25);\n            } else if (type === 'combo') {\n                osc.type = 'sawtooth';\n                osc.frequency.setValueAtTime(587.33, now);\n                osc.frequency.setValueAtTime(880, now + 0.1);\n                gain.gain.setValueAtTime(0.2, now);\n                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);\n                osc.start(now); osc.stop(now + 0.3);\n            } else if (type === 'bomb') {\n                osc.type = 'square';\n                osc.frequency.setValueAtTime(150, now);\n                osc.frequency.exponentialRampToValueAtTime(40, now + 0.3);\n                gain.gain.setValueAtTime(0.3, now);\n                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);\n                osc.start(now); osc.stop(now + 0.3);\n            } else if (type === 'over') {\n                osc.type = 'sawtooth';\n                osc.frequency.setValueAtTime(300, now);\n                osc.frequency.linearRampToValueAtTime(100, now + 0.5);\n                gain.gain.setValueAtTime(0.2, now);\n                gain.gain.linearRampToValueAtTime(0.01, now + 0.5);\n                osc.start(now); osc.stop(now + 0.5);\n            } else if (type === 'wrong') {\n                osc.type = 'square';\n                osc.frequency.setValueAtTime(240, now);\n                osc.frequency.exponentialRampToValueAtTime(110, now + 0.18);\n                gain.gain.setValueAtTime(0.11, now);\n                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);\n                osc.start(now); osc.stop(now + 0.19);\n            } else if (type === 'hint') {\n                osc.type = 'sine';\n                osc.frequency.setValueAtTime(660, now);\n                osc.frequency.setValueAtTime(880, now + 0.09);\n                gain.gain.setValueAtTime(0.1, now);\n                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);\n                osc.start(now); osc.stop(now + 0.21);\n            } else if (type === 'clear') {\n                osc.type = 'triangle';\n                osc.frequency.setValueAtTime(523.25, now);\n                osc.frequency.setValueAtTime(659.25, now + 0.1);\n                osc.frequency.setValueAtTime(783.99, now + 0.2);\n                osc.frequency.setValueAtTime(1046.5, now + 0.3);\n                gain.gain.setValueAtTime(0.16, now);\n                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);\n                osc.start(now); osc.stop(now + 0.56);\n            }\n        }\n\n        const ICON_POOL = [\n            { icon: '🚀' }, { icon: '🪐' }, { icon: '🛸' }, { icon: '👽' },\n            { icon: '🌙' }, { icon: '⭐' }, { icon: '🌍' }, { icon: '☄️' },\n            { icon: '🌞' }, { icon: '🛰️' }, { icon: '👨‍🚀' }, { icon: '💎' },\n            { icon: '⚡' }, { icon: '🧭' }, { icon: '🔭' }, { icon: '🛡️' },\n            { icon: '🎯' }, { icon: '🔥' }\n        ];\n\n        // 難易度ごとにヒント回数 (hints) を設定\n        const DIFFICULTY_SETTINGS = {\n            easy: { grid: 2, pairs: 2, time: 30, hints: 1, fontScale: 'text-4xl md:text-6xl', hasBomb: false, next: 'normal' },\n            normal: { grid: 4, pairs: 8, time: 60, hints: 3, fontScale: 'text-2xl md:text-4xl', hasBomb: false, next: 'hard' },\n            hard: { grid: 6, pairs: 17, time: 120, hints: 5, fontScale: 'text-lg md:text-2xl', hasBomb: true, next: null }\n        };\n\n        let currentDifficulty = 'easy';\n        let cards = [];\n        let flippedCards = [];\n        let matchedPairs = 0;\n        let score = 0;\n        let moves = 0;\n        let combo = 0;\n        let maxCombo = 0;\n        let remainingHints = 1;\n        let timer = 0;\n        let timerInterval = null;\n        let isBoardLocked = false;\n        let isGameStarted = false;\n\n        function createStars() {\n            const container = document.getElementById('stars-bg');\n            container.innerHTML = '';\n            for (let i = 0; i < 70; i++) {\n                const star = document.createElement('div');\n                star.className = 'star';\n                const size = Math.random() * 2.5 + 1;\n                star.style.width = `${size}px`;\n                star.style.height = `${size}px`;\n                star.style.left = `${Math.random() * 100}%`;\n                star.style.top = `${Math.random() * 100}%`;\n                star.style.animationDuration = `${Math.random() * 3 + 1.5}s`;\n                star.style.animationDelay = `${Math.random() * 2}s`;\n                container.appendChild(star);\n            }\n        }\n\n        function setDifficulty(diff) {\n            currentDifficulty = diff;\n            document.querySelectorAll('.diff-btn').forEach(btn => {\n                btn.classList.remove('bg-cyan-500', 'text-black', 'shadow-lg', 'shadow-cyan-500/30');\n                btn.classList.add('text-slate-300');\n            });\n            const activeBtn = document.getElementById(`btn-${diff}`);\n            if (activeBtn) {\n                activeBtn.classList.add('bg-cyan-500', 'text-black', 'shadow-lg', 'shadow-cyan-500/30');\n                activeBtn.classList.remove('text-slate-300');\n            }\n            resetGame();\n        }\n\n        function nextLevel() {\n            const nextDiff = DIFFICULTY_SETTINGS[currentDifficulty].next;\n            setDifficulty(nextDiff ? nextDiff : 'easy');\n        }\n\n        function resetGame() {\n            clearInterval(timerInterval);\n            timerInterval = null;\n\n            const setting = DIFFICULTY_SETTINGS[currentDifficulty];\n            score = 0;\n            moves = 0;\n            combo = 0;\n            maxCombo = 0;\n            matchedPairs = 0;\n            remainingHints = setting.hints; // 難易度別のヒント回数を初期化\n            timer = setting.time;\n            flippedCards = [];\n            isBoardLocked = false;\n            isGameStarted = false;\n\n            updateHintButton();\n            updateHUD();\n            document.getElementById('clear-modal').classList.add('hidden');\n            document.getElementById('gameover-modal').classList.add('hidden');\n\n            generateBoard(setting);\n            renderHighScores();\n        }\n\n        function updateHintButton() {\n            const hintBtn = document.getElementById('hint-btn');\n            document.getElementById('hint-text').textContent = `HINT (${remainingHints})`;\n\n            if (remainingHints <= 0) {\n                hintBtn.disabled = true;\n                hintBtn.classList.add('opacity-50', 'cursor-not-allowed');\n            } else {\n                hintBtn.disabled = false;\n                hintBtn.classList.remove('opacity-50', 'cursor-not-allowed');\n            }\n        }\n\n        function updateHUD() {\n            document.getElementById('score-display').textContent = score;\n            document.getElementById('timer-display').textContent = String(timer).padStart(3, '0');\n            document.getElementById('moves-display').textContent = moves;\n            document.getElementById('combo-display').textContent = `x${combo}`;\n        }\n\n        function generateBoard(setting) {\n            const board = document.getElementById('game-board');\n            board.innerHTML = '';\n            board.className = `grid gap-1.5 md:gap-2.5 p-2 neon-panel rounded-2xl grid-${setting.grid}x${setting.grid}`;\n\n            let selectedIcons = ICON_POOL.slice(0, setting.pairs);\n            let deck = [...selectedIcons, ...selectedIcons];\n\n            // 爆弾カード追加（Hardモード用）\n            if (setting.hasBomb) {\n                deck.push({ icon: '💣', isBomb: true });\n                deck.push({ icon: '💣', isBomb: true });\n            }\n\n            for (let i = deck.length - 1; i > 0; i--) {\n                const j = Math.floor(Math.random() * (i + 1));\n                [deck[i], deck[j]] = [deck[j], deck[i]];\n            }\n\n            cards = deck.map((item, index) => {\n                const cardEl = document.createElement('div');\n                cardEl.className = `card-container w-full h-full ${item.isBomb ? 'bomb' : ''}`;\n                cardEl.dataset.id = index;\n                cardEl.dataset.icon = item.icon;\n                if (item.isBomb) cardEl.dataset.isBomb = \"true\";\n\n                cardEl.innerHTML = `\n                    <div class=\"card-inner\">\n                        <div class=\"card-back\">\n                            <i class=\"fa-solid fa-skull-crossbones back-logo\"></i>\n                        </div>\n                        <div class=\"card-front\">\n                            <span class=\"logo3d\">${item.icon}</span>\n                        </div>\n                    </div>\n                `;\n\n                cardEl.addEventListener('click', () => handleCardClick(cardEl));\n                board.appendChild(cardEl);\n                return cardEl;\n            });\n        }\n\n        function useHint() {\n            if (remainingHints <= 0 || isBoardLocked) return;\n            playSound('hint');\n            remainingHints--;\n            updateHintButton();\n\n            cards.forEach(card => {\n                if (!card.classList.contains('matched') && !card.classList.contains('flipped')) {\n                    card.classList.add('hinted');\n                }\n            });\n\n            setTimeout(() => {\n                cards.forEach(card => card.classList.remove('hinted'));\n            }, 1200);\n        }\n\n        function startTimer() {\n            if (isGameStarted) return;\n            isGameStarted = true;\n\n            timerInterval = setInterval(() => {\n                timer--;\n                document.getElementById('timer-display').textContent = String(timer).padStart(3, '0');\n                if (timer <= 0) {\n                    clearInterval(timerInterval);\n                    playSound('over');\n                    handleGameOver();\n                }\n            }, 1000);\n        }\n\n        function handleCardClick(cardEl) {\n            if (isBoardLocked) return;\n            if (cardEl.classList.contains('flipped') || cardEl.classList.contains('matched')) return;\n\n            if (!isGameStarted) startTimer();\n\n            playSound('flip');\n            cardEl.classList.add('flipped');\n\n            // 爆弾処理\n            if (cardEl.dataset.isBomb === \"true\") {\n                playSound('bomb');\n                triggerShake();\n                timer = Math.max(0, timer - 5);\n                updateHUD();\n                setTimeout(() => {\n                    cardEl.classList.remove('flipped');\n                }, 800);\n                return;\n            }\n\n            flippedCards.push(cardEl);\n\n            if (flippedCards.length === 2) {\n                moves++;\n                updateHUD();\n                checkPairMatch();\n            }\n        }\n\n        function triggerShake() {\n            const body = document.getElementById('body-root');\n            body.classList.add('shake');\n            setTimeout(() => body.classList.remove('shake'), 300);\n        }\n\n        function triggerComboBanner(multiplier) {\n            const banner = document.getElementById('combo-banner');\n            banner.textContent = `🔥 FEVER COMBO x${multiplier}! 🔥`;\n            banner.classList.remove('opacity-0');\n            setTimeout(() => banner.classList.add('opacity-0'), 1000);\n        }\n\n        function checkPairMatch() {\n            isBoardLocked = true;\n            const [card1, card2] = flippedCards;\n            const isMatch = card1.dataset.icon === card2.dataset.icon;\n\n            if (isMatch) {\n                combo++;\n                if (combo > maxCombo) maxCombo = combo;\n\n                if (combo > 1) {\n                    playSound('combo');\n                    triggerComboBanner(combo);\n                } else {\n                    playSound('match');\n                }\n\n                setTimeout(() => {\n                    card1.classList.add('matched');\n                    card2.classList.add('matched');\n                    flippedCards = [];\n                    isBoardLocked = false;\n\n                    score += 100 * combo;\n                    matchedPairs++;\n                    updateHUD();\n\n                    if (matchedPairs === DIFFICULTY_SETTINGS[currentDifficulty].pairs) {\n                        handleGameClear();\n                    }\n                }, 300);\n            } else {\n                playSound('wrong');\n                combo = 0; // コンボリセット\n                setTimeout(() => {\n                    card1.classList.remove('flipped');\n                    card2.classList.remove('flipped');\n                    flippedCards = [];\n                    isBoardLocked = false;\n\n                    score = Math.max(0, score - 10);\n                    updateHUD();\n                }, 800);\n            }\n        }\n\n        function saveHighScore(finalScore) {\n            let key = `matching_hs_${currentDifficulty}`;\n            let scores = [];\n            try { scores = JSON.parse(localStorage.getItem(key) || \"[]\"); } catch (e) {}\n            scores.push(finalScore);\n            scores.sort((a, b) => b - a);\n            scores = scores.slice(0, 3);\n            try { localStorage.setItem(key, JSON.stringify(scores)); } catch (e) {}\n            renderHighScores();\n        }\n\n        function renderHighScores() {\n            let key = `matching_hs_${currentDifficulty}`;\n            let scores = [];\n            try { scores = JSON.parse(localStorage.getItem(key) || \"[]\"); } catch (e) {}\n            const container = document.getElementById('high-scores-list');\n            if (scores.length === 0) {\n                container.innerHTML = `<span class=\"text-slate-500\">NO RECORDS YET</span>`;\n            } else {\n                container.innerHTML = scores.map((s, i) => `<span>#${i+1}: <span class=\"text-cyan-300\">${s}</span></span>`).join('');\n            }\n        }\n\n        function handleGameClear() {\n            playSound('clear');\n            clearInterval(timerInterval);\n\n            const timeBonus = timer * 10;\n            const finalScore = score + timeBonus;\n\n            saveHighScore(finalScore);\n\n            document.getElementById('modal-base-score').textContent = score;\n            document.getElementById('modal-time-bonus').textContent = `+${timeBonus}`;\n            document.getElementById('modal-max-combo').textContent = `x${maxCombo}`;\n            document.getElementById('modal-moves').textContent = moves;\n            document.getElementById('modal-final-score').textContent = finalScore;\n\n            const nextBtn = document.getElementById('next-level-btn');\n            const nextDiff = DIFFICULTY_SETTINGS[currentDifficulty].next;\n\n            if (nextDiff === 'normal') {\n                nextBtn.innerHTML = `<span>NORMAL (4x4) へ挑戦</span> <i class=\"fa-solid fa-arrow-right\"></i>`;\n            } else if (nextDiff === 'hard') {\n                nextBtn.innerHTML = `<span>HARD (6x6) へ挑戦</span> <i class=\"fa-solid fa-arrow-right\"></i>`;\n            } else {\n                nextBtn.innerHTML = `<span>最初 (EASY) から遊ぶ</span> <i class=\"fa-solid fa-rotate-left\"></i>`;\n            }\n\n            document.getElementById('clear-modal').classList.remove('hidden');\n\n            if (typeof confetti === 'function') {\n                confetti({ particleCount: 150, spread: 90, origin: { y: 0.6 } });\n            }\n        }\n\n        function handleGameOver() {\n            isBoardLocked = true;\n            document.getElementById('gameover-modal').classList.remove('hidden');\n        }\n\n        // ===== INTRO CINEMATIC (~12s, skippable) =====\n        const INTRO_MS = 12300;\n        let introTimers = [], introActive = false, warpRAF = null, warpSpeed = 2, warpTarget = 2;\n\n        function introSound(type) {\n            try {\n                if (audioCtx.state === 'suspended') audioCtx.resume();\n                const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = audioCtx.currentTime;\n                o.connect(g); g.connect(audioCtx.destination);\n                if (type === 'whoosh') { o.type='sawtooth'; o.frequency.setValueAtTime(60,t); o.frequency.exponentialRampToValueAtTime(700,t+.9); g.gain.setValueAtTime(.001,t); g.gain.linearRampToValueAtTime(.12,t+.4); g.gain.linearRampToValueAtTime(.001,t+.9); o.start(t); o.stop(t+.9); }\n                else if (type === 'tick') { o.type='sine'; o.frequency.setValueAtTime(660,t); g.gain.setValueAtTime(.2,t); g.gain.exponentialRampToValueAtTime(.001,t+.25); o.start(t); o.stop(t+.25); }\n                else if (type === 'blip') { o.type='square'; o.frequency.setValueAtTime(900,t); g.gain.setValueAtTime(.06,t); g.gain.exponentialRampToValueAtTime(.001,t+.09); o.start(t); o.stop(t+.09); }\n                else if (type === 'chime') { o.type='triangle'; o.frequency.setValueAtTime(784,t); o.frequency.setValueAtTime(1175,t+.09); g.gain.setValueAtTime(.2,t); g.gain.exponentialRampToValueAtTime(.001,t+.35); o.start(t); o.stop(t+.35); }\n                else if (type === 'collect') { o.type='sine'; o.frequency.setValueAtTime(400,t); o.frequency.exponentialRampToValueAtTime(900,t+.2); g.gain.setValueAtTime(.12,t); g.gain.exponentialRampToValueAtTime(.001,t+.25); o.start(t); o.stop(t+.25); }\n                else if (type === 'go') { o.type='triangle'; o.frequency.setValueAtTime(523,t); o.frequency.setValueAtTime(784,t+.1); o.frequency.setValueAtTime(1047,t+.2); g.gain.setValueAtTime(.25,t); g.gain.exponentialRampToValueAtTime(.001,t+.6); o.start(t); o.stop(t+.6); }\n            } catch (e) {}\n        }\n\n        // Warp-speed starfield\n        function startWarp() {\n            const cv = document.getElementById('warp'), ctx = cv.getContext('2d');\n            const resize = () => { cv.width = innerWidth; cv.height = innerHeight; };\n            resize(); window.onresize = resize;\n            const stars = Array.from({ length: 220 }, () => ({ x: (Math.random()-.5)*2, y: (Math.random()-.5)*2, z: Math.random()*1.5+.1, px: null, py: null }));\n            (function loop() {\n                warpSpeed += (warpTarget - warpSpeed) * 0.04;\n                ctx.fillStyle = 'rgba(3,5,13,0.35)'; ctx.fillRect(0, 0, cv.width, cv.height);\n                const cx = cv.width/2, cy = cv.height/2, k = Math.max(cv.width, cv.height) * 0.6;\n                for (const st of stars) {\n                    st.z -= warpSpeed * 0.0035;\n                    if (st.z <= 0.02) { st.x=(Math.random()-.5)*2; st.y=(Math.random()-.5)*2; st.z=1.5; st.px=null; }\n                    const sx = cx + st.x / st.z * k * 0.5, sy = cy + st.y / st.z * k * 0.5;\n                    const a = Math.min(1, (1.5 - st.z) * 1.2);\n                    ctx.strokeStyle = `rgba(190,230,255,${a})`; ctx.lineWidth = Math.max(.6, (1.5 - st.z) * 1.8);\n                    ctx.beginPath(); ctx.moveTo(st.px ?? sx, st.py ?? sy); ctx.lineTo(sx, sy); ctx.stroke();\n                    st.px = sx; st.py = sy;\n                }\n                warpRAF = requestAnimationFrame(loop);\n            })();\n        }\n        function stopWarp() { cancelAnimationFrame(warpRAF); warpRAF = null; }\n\n        function showScene(n) {\n            document.querySelectorAll('#intro .scene').forEach((el, i) => el.classList.toggle('show', i === n));\n        }\n        function at(ms, fn) { introTimers.push(setTimeout(fn, ms) const $ = (id) => document.getElementById(id);

/* ---------- screen transitions (fade-out, then staggered fade-in) ---------- */
let switching = false;
function show(nextId) {
  const current = document.querySelector('.screen.is-active');
  if (switching || !current || current.id === nextId) return;
  switching = true;
  current.classList.add('is-leaving');
  setTimeout(() => {
    current.classList.remove('is-active', 'is-leaving');
    const next = $(nextId);
    next.classList.add('is-active');   // CSS animations restart on display change
    window.scrollTo(0, 0);
    switching = false;
  }, 380);
}

/* ---------- game cards ---------- */
function renderGames() {
  $('game-list').innerHTML = GAMES.map((g, i) => `
    <button class="game" data-id="${g.id}" style="--i:${i}">

}


/* ---------- 12-second story intro, then the game ---------- */
const Intro = (() => {
  const root = $('intro'), cv = $('ic'), cap = $('cap'), cx = cv.getContext('2d');
  const scenes = [...root.querySelectorAll('.sc')];
  const TIMES = [0, 4000, 8000], TOTAL = 12000;
  let timers = [], raf = 0, speed = 0.4, stars = [], done = null, running = false;
  function size() { cv.width = innerWidth; cv.height = innerHeight; stars = Array.from({ length: 140 }, () => ({ x: Math.random() * cv.width, y: Math.random() * cv.height, z: Math.random() * .9 + .1 })); }
  function frame() {
    cx.clearRect(0, 0, cv.width, cv.height);
    for (const s of stars) {
      s.y += s.z * speed * 6; if (s.y > cv.height) { s.y = -20; s.x = Math.random() * cv.width; }
      const len = 1 + speed * s.z * 10;
      cx.fillStyle = 'rgba(214,237,255,' + (.35 + s.z * .6) + ')';
      cx.fillRect(s.x, s.y, 1.4 * s.z + .6, len);
    }
    raf = requestAnimationFrame(frame);
  }
  function scene(i) {
    scenes.forEach((el, k) => el.classList.toggle('on', k === i));
    cap.className = 'cap'; void cap.offsetWidth; cap.className = 'cap in';
    cap.textContent = t('st' + (i + 1));
    try { i === 2 ? Chip.sfx.launch() : Chip.sfx.select(); } catch (e) {}
  }
  function end(skipped) {
    if (!running) return; running = false;
    timers.forEach(clearTimeout); timers = []; cancelAnimationFrame(raf);
    const f = root.querySelector('.iflash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
    setTimeout(() => { root.hidden = true; root.classList.remove('run'); scenes.forEach((el) => el.classList.remove('on')); }, 120);
    const cb = done; done = null; if (cb) cb();
  }
  function play(cb) {
    done = cb; running = true; size(); speed = .4;
    root.hidden = false; root.classList.remove('run'); void root.offsetWidth; root.classList.add('run');
    scene(0);
    timers.push(setTimeout(() => { scene(1); speed = .9; }, TIMES[1]));
    timers.push(setTimeout(() => { scene(2); speed = 6; }, TIMES[2]));
    timers.push(setTimeout(() => end(false), TOTAL));
    raf = requestAnimationFrame(frame);

  addEventListener('resize', () => { if (running) size(); });
  return { play, isRunning: () => running, applyText: () => { if (running) { const k = scenes.findIndex((e) => e.classList.contains('on')); if (k >= 0) cap.textContent = t('st' + (k + 1)); } } };
})();

let musicWas = null;
function startGame(id) {
  const game = GAMES.find((g) => g.id === id);
  if (game && GAME_SRC[id]) {
    if (Intro.isRunning()) return;
    const launch = () => {
      $('gf').srcdoc = GAME_SRC[id];
      $('game-frame').hidden = false;
      musicWas = Chip.isMuted(); Chip.setMuted(true);   // menu music off while playing
      setTimeout(() => { try { $('gf').focus(); } catch (e) {} }, 150);
    };
    if (game.ownIntro) launch();                 // game plays its own 12 s intro (skippable)
    else Intro.play(launch);                     // story intro (12 s) -> game built into this page
  } else if (game && game.href) {
    location.href = game.href;
  } else {
    alert(t('soon').replace('{name}', game.name));
  }
}
function exitGame() {
  $('game-frame').hidden = true;
  $('gf').srcdoc = '';
  if (musicWas === false) Chip.setMuted(false);
  musicWas = null;
}
$('game-exit').addEventListener('click', exitGame);

/* ---------- starfield (canvas, sparse, twinkling, mouse parallax) ---------- */
(function stars() {
  const cv = $('stars'), ctx = cv.getContext('2d');
  let w, h, dpr, list = [], mx = 0, my = 0, tx = 0, ty = 0;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = cv.width = innerWidth * dpr; h = cv.height = innerHeight * dpr;
    const n = Math.round((innerWidth * innerHeight) / 11000);
    list = Array.from({ length: n }, () => ({
      x: Math.random() * w, y: Math.random() * h,
      r: (Math.random() * 1.1 + .35) * dpr,
      z: Math.random() * .9 + .1,               // depth: parallax + drift speed
      p: Math.random() * Math.PI * 2,           // twinkle phase
      s: Math.random() * .8 + .4,               // twinkle speed
    }));
  }
  addEventListener('resize', resize);
  addEventListener('pointermove', (e) => { tx = (e.clientX / innerWidth - .5); ty = (e.clientY / innerHeight - .5); });
  function frame(t) {
    mx += (tx - mx) * .05; my += (ty - my) * .05;
    ctx.clearRect(0, 0, w, h);
    for (const s of list) {
      s.y -= s.z * .12 * dpr;                  // slow upward drift
      if (s.y < -2) { s.y = h + 2; s.x = Math.random() * w; }
      const px = s.x + mx * s.z * 40 * dpr, py = s.y + my * s.z * 40 * dpr;
      const a = .25 + .55 * (.5 + .5 * Math.sin(t / 1000 * s.s + s.p));
      ctx.globalAlpha = a * (.4 + s.z * .6);
      ctx.fillStyle = '#dbe8ff';
      ctx.beginPath(); ctx.arc(px, py, s.r, 0, 6.2832); ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  resize(); requestAnimationFrame(frame);
})();

/* ---------- title letters: split for per-letter hover colour ---------- */
(function letters() {
  const wm = document.querySelector('.wordmark');
  wm.querySelectorAll('.line > span').forEach((el, li) => {
    const text = el.textContent, frag = document.createDocumentFragment();
    const hue = li === 0 ? [44, 20] : [268, 305];            // champagne→rose gold | lavender→orchid
    [...text].forEach((c, i) => {
      if (c === ' ') { frag.appendChild(document.createTextNode(' ')); return; }
      const s = document.createElement('span');
      s.className = 'ch'; s.textContent = c;
      const t = i / Math.max(text.length - 1, 1);

  });
  setTimeout(() => wm.classList.add('settled'), 1900);
})();

const Chip = (() => {

    A4 x C5 x E5 x C5 x A5 - G5 - E5 - C5 x
    F4 x A4 x C5 x A4 x F5 - E5 - C5 - A4 x
    G4 x C5 x E5 x C5 x G5 - E5 - C5 - E5 x
    D5 x G5 x B5 x G5 x D6 - B5 - G5 - D5 x`);
  const CHORDS = [[57, 60, 64], [53, 57, 60], [60, 64, 67], [55, 59, 62]];
  const ROOTS = [45, 41, 48, 43];

  function tone(type, f, t, dur, vol, o = {}) {
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(f, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.005);
    g.gain.exponentialRampToValueAtTime(Math.max(vol * (o.sus ?? .55), 0.0002), t + dur * .6);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(master);
    osc.start(t); osc.stop(t + dur + 0.03);
  }
  function noise(t, dur, vol, hp) {
    const src = ctx.createBufferSource(), g = ctx.createGain(), f = ctx.createBiquadFilter();
    src.buffer = noiseBuf; f.type = 'highpass'; f.frequency.value = hp;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t, Math.random() * 0.8); src.stop(t + dur + 0.02);
  }

  function schedule(s, t) {
    const bar = Math.floor(s / 16) % 4, n = LEAD[s];
    if (n) tone('square', hz(n.m), t, n.len * S * .94, .5);                         // lead
    tone('square', hz(CHORDS[bar][[0, 1, 2, 1][s % 4]]), t, S * .8, .15);           // arpeggio
    if (s % 4 === 0) tone('triangle', hz(ROOTS[bar]), t, S * 3.6, .95);              // bass
    if (s % 4 === 2) tone('triangle', hz(ROOTS[bar] + 12), t, S * 1.6, .6);
    if (s % 8 === 0) tone('sine', 150, t, .16, .9, { to: 42, sus: .3 });            // kick
    if (s % 8 === 4) { noise(t, .13, .5, 1800); tone('triangle', 220, t, .08, .3, { to: 120 }); } // snare
    if (s % 2 === 0) noise(t, .035, s % 4 === 2 ? .2 : .11, 7500);                  // hat
  }
  function tick() {
    while (next < ctx.currentTime + 0.15) { schedule(step % 64, next); next += S; step++; }
  }

  let jingled = false;
  function hint(show) { const el = document.getElementById('sound-hint'); if (el) el.classList.toggle('show', show && !muted); }
  function onState() {                                   // fires whenever the browser lets the audio run / pauses it
    if (ctx.state !== 'running') { hint(true); return; }
    hint(false);
    next = Math.max(next, ctx.currentTime + 0.05);
    master.gain.setTargetAtTime(muted ? 0 : VOL, ctx.currentTime, .4);   // gentle fade-in
    if (!jingled && !muted) { jingled = true; [72, 76, 79, 84].forEach((m, i) => tone('square', hz(m), ctx.currentTime + .02 + i * .07, .12, .35)); }
  }
  function start() {
    if (started) { if (ctx.state === 'suspended') ctx.resume().catch(() => {}); return; }
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const comp = ctx.createDynamicsCompressor();
    master = ctx.createGain(); master.gain.value = 0;
    master.connect(comp); comp.connect(ctx.destination);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    started = true; next = ctx.currentTime + 0.08;
    timer = setInterval(tick, 25);
    ctx.onstatechange = onState;
    ctx.resume().catch(() => {});                        // plays at once if the browser allows autoplay
    onState(); ui();
  }
  function setMuted(v) {
    muted = v; try { localStorage.setItem('arcadeMuted', v ? '1' : '0'); } catch (e) {}
    if (started) { master.gain.setTargetAtTime(v ? 0 : VOL, ctx.currentTime, .05); hint(ctx.state !== 'running'); }
    ui();
  }
  function ui() {
    const b = document.getElementById('btn-sound');
    const on = started && !muted;
    b.classList.toggle('on', on); b.classList.toggle('idle', false);
    b.setAttribute('aria-pressed', String(on));
    const label = window.tr ? window.tr(!started ? 'sound' : on ? 'soundOn' : 'soundOff') : 'Sound';
    b.setAttribute('aria-label', label); b.title = label;
  }

  // tiny UI effects
  const sfx = {
    attract() {   // "coin + fanfare": draws passers-by to the machine
      if (!(started && !muted && ctx.state === 'running')) return;
      const t = ctx.currentTime;
      tone('square', hz(83), t, .07, .3); tone('square', hz(88), t + .07, .4, .3, { sus: .3 });
      [72, 76, 79, 84, 88].forEach((m, i) => tone('square', hz(m), t + .55 + i * .09, .16, .26));
      tone('triangle', hz(60), t + .55, .6, .55);
    },
    blip()   { if (started && !muted && ctx.state === 'running') tone('square', 1175, ctx.currentTime, .045, .22); },
    select() { if (started && !muted && ctx.state === 'running') { const t = ctx.currentTime; tone('square', 660, t, .07, .3); tone('square', 990, t + .07, .12, .3); } },
    launch() { if (started && !muted && ctx.state === 'running') { const t = ctx.currentTime; for (let i = 0; i < 10; i++) tone('sawtooth', 110 + i * 70, t + i * .07, .12, .16); } },
    back()   { if (started && !muted && ctx.state === 'running') { const t = ctx.currentTime; tone('square', 880, t, .07, .28); tone('square', 520, t + .07, .12, .28); } },
  };

  document.addEventListener('visibilitychange', () => {
    if (!started) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });
  return { start, setMuted, ui, sfx, isStarted: () => started, isMuted: () => muted, isRunning: () => started && ctx.state === 'running' };
})();

(function wireAudio() {
  const btn = document.getElementById('btn-sound');
  Chip.start();                                           // theme is ON by default; the player can switch it off
  // browsers may hold audio until the first tap/key press — resume on any gesture, then stop listening
  const evs = ['pointerdown', 'keydown', 'touchend', 'click'];
  const unlock = () => { Chip.start(); if (Chip.isRunning()) evs.forEach((e) => document.removeEventListener(e, unlock, true)); };
  evs.forEach((e) => document.addEventListener(e, unlock, true));
  btn.addEventListener('click', () => Chip.setMuted(!Chip.isMuted()));
  const hot = '.btn, .game, .back';
  document.addEventListener('mouseover', (e) => {
    const el = e.target.closest(hot);
    if (el && !el.contains(e.relatedTarget)) Chip.sfx.blip();
  });
  document.addEventListener('click', (e) => {
    const el = e.target.closest(hot);
    if (!el) return;
    el.classList.contains('back') ? Chip.sfx.back() : Chip.sfx.select();
  });
})();

(function wireLang() {
  const btn = document.getElementById('lang-btn'), menu = document.getElementById('lang-menu');
  menu.innerHTML = LANG_CODES.map((c) =>
    `<button role="option" data-lang="${c}"><span>${langName(c)}</span><span class="lc">${c.toUpperCase()}</span></button>`).join('');
  const setOpen = (o) => { menu.hidden = !o; btn.setAttribute('aria-expanded', String(o)); };
  btn.addEventListener('click', (e) => { e.stopPropagation(); setOpen(menu.hidden); });
  menu.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-lang]'); if (!b) return;
    applyLang(b.dataset.lang); setOpen(false);
  });
  document.addEventListener('click', (e) => { if (!e.target.closest('#lang')) setOpen(false); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setOpen(false); });
  applyLang(pickInitialLang());
})();

/* ---------- arcade attract mode: if nobody touches the machine, call people over ---------- */
(function attract() {
  const btn = document.getElementById('btn-start'), flash = document.getElementById('flash');
  const title = document.getElementById('screen-title'), sheet = document.getElementById('howto');
  const IDLE = 7000, EVERY = 9000;                       // ms of quiet before the first call, then between calls
  let last = Date.now(), lastBurst = 0;
  const bump = () => { last = Date.now(); };
  ['pointerdown', 'pointermove', 'keydown', 'touchstart'].forEach((e) => addEventListener(e, bump, { passive: true }));
  function burst() {
    btn.classList.remove('attract'); flash.classList.remove('go'); void btn.offsetWidth;   // restart the animations
    btn.classList.add('attract'); flash.classList.add('go');
    Chip.sfx.attract();
  }
  setInterval(() => {
    if (document.hidden || !title.classList.contains('is-active') || !sheet.hidden) return;
    const now = Date.now();
    if (now - last >= IDLE && now - lastBurst >= EVERY) { lastBurst = now; burst(); }
  }, 500);
})();
