ull py-1 px-1 bg-red-600/80 hover:bg-red-500 text-white font-bold font-orbitron text-[10px] md:text-xs rounded-lg shadow transition active:scale-95 border border-red-400/40 flex items-center justify-center gap-1\">\n                    <i class=\"fa-solid fa-rotate-right\"><\/i>\n                    <span>RESET<\/span>\n                <\/button>\n            <\/div>\n        <\/div>\n\n        <!-- Combo Banner Pop-up -->\n        <div id=\"combo-banner\" class=\"fixed left-0 right-0 top-28 text-center pointer-events-none z-40 text-lg md:text-2xl font-black font-orbitron text-yellow-400 tracking-widest uppercase transition-opacity opacity-0\" style=\"text-shadow:0 0 12px rgba(250,204,21,.9)\">\n            FEVER MODE x2!\n        <\/div>\n\n        <div id=\"game-board-container\" class=\"w-full\">\n            <div id=\"game-board\" class=\"grid gap-2 p-2 neon-panel rounded-2xl\"><\/div>\n        <\/div>\n    <\/main>\n\n    <!-- 学園祭ハイスコア掲示板 (フッター上) -->\n    <div class=\"z-10 shrink-0 w-full max-w-4xl neon-panel rounded-xl p-1.5 md:p-2 flex items-center justify-between text-xs font-orbitron\">\n        <span class=\"text-amber-400 font-bold flex items-center gap-1\">\n            <i class=\"fa-solid fa-crown text-yellow-400\"><\/i> HIGH SCORES:\n        <\/span>\n        <div id=\"high-scores-list\" class=\"flex gap-4 text-slate-300 font-bold\">\n            <!-- JSで上位スコアを動的更新 -->\n        <\/div>\n    <\/div>\n\n\n    <!-- INTRO CINEMATIC -->\n    <div id=\"intro\" class=\"fixed inset-0 z-[60] overflow-hidden\">\n        <canvas id=\"warp\" class=\"absolute inset-0 w-full h-full\"><\/canvas>\n        <div class=\"vignette\"><\/div>\n        <div class=\"letterbox\" style=\"top:0\"><\/div>\n        <div class=\"letterbox\" style=\"bottom:0\"><\/div>\n\n        <button id=\"skip-btn\" onclick=\"skipIntro()\" class=\"absolute top-[8vh] right-4 z-10 items-center gap-2 px-4 py-2 rounded-lg bg-slate-900/70 hover:bg-slate-800 border border-slate-500/50 text-slate-200 text-xs font-orbitron font-bold tracking-widest transition backdrop-blur\">\n            SKIP <i class=\"fa-solid fa-forward\"><\/i>\n        <\/button>\n\n        <!-- Scene 0: Launch -->\n        <div id=\"scene-0\" class=\"scene show\">\n            <div class=\"rise text-[10px] md:text-xs font-orbitron tracking-[.4em] text-cyan-300/80 mb-4\" style=\"--d:.1s\">FESTIVAL EDITION 2026<\/div>\n            <div class=\"rise emblem mb-2\" style=\"--d:.2s\">🚀<\/div>\n            <h1 class=\"rise font-orbitron font-black title-grad text-3xl md:text-6xl tracking-wider leading-tight\" style=\"--d:.3s\">SPACE SHOOTER<\/h1>\n            <div class=\"rise font-orbitron text-slate-300 tracking-[.5em] text-sm md:text-lg my-1\" style=\"--d:.4s\">×<\/div>\n            <h2 class=\"rise font-orbitron font-extrabold text-white text-2xl md:text-5xl tracking-widest mb-8\" style=\"--d:.5s\">CARD MATCHING<\/h2>\n            <button id=\"play-btn\" onclick=\"startIntro()\" class=\"rise play-btn px-10 py-4 rounded-2xl bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-orbitron font-black tracking-[.3em] text-base md:text-lg border border-cyan-300/60\" style=\"--d:.7s\">\n                <i class=\"fa-solid fa-play mr-2\"><\/i>PLAY\n            <\/button>\n            <div class=\"rise mt-4 text-[10px] text-slate-400 font-orbitron tracking-widest\" style=\"--d:.9s\">PRESS ENTER / クリックでスタート<\/div>\n        <\/div>\n\n        <!-- Intro stage: scattered cards -> player matches pairs -> order restored -->\n        <div id=\"play-stage\">\n            <div id=\"cap\">\n                <div id=\"cap-t\" class=\"title-grad\"><\/div>\n                <div id=\"cap-s\"><\/div>\n                <div id=\"cap-j\"><\/div>\n                <div id=\"intro-count\"><\/div>\n                <div id=\"intro-rules\"><\/div>\n            <\/div>\n            <div id=\"cardfield\"><\/div>\n            <div id=\"tray\"><\/div>\n            <div id=\"seeker\"><span class=\"ring\"><\/span><i class=\"fa-solid fa-hand-pointer\"><\/i><\/div>\n            <div id=\"count-wrap\"><div id=\"count-num\" class=\"count-num font-orbitron font-black title-grad\"><\/div><\/div>\n        <\/div>\n\n        <div id=\"intro-progress\"><\/div>\n    <\/div>\n\n    <!-- CLEAR MODAL -->\n    <div id=\"clear-modal\" class=\"fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md hidden p-4\">\n        <div class=\"neon-panel rounded-3xl p-6 md:p-8 max-w-md w-full text-center space-y-5 border-2 border-cyan-400 shadow-[0_0_50px_rgba(56,189,248,0.4)]\">\n            <div class=\"text-5xl text-amber-400 animate-bounce\">\n                <i class=\"fa-solid fa-trophy drop-shadow-[0_0_20px_rgba(251,191,36,0.8)]\"><\/i>\n            <\/div>\n            <h2 class=\"text-2xl md:text-3xl font-black font-orbitron neon-text-cyan text-cyan-300 uppercase tracking-wider\">\n                MISSION CLEAR!\n            <\/h2>\n            \n            <div class=\"bg-slate-900/80 rounded-2xl p-4 space-y-2 border border-slate-700 text-sm\">\n                <div class=\"flex justify-between items-center text-slate-300\">\n                    <span>基本スコア:<\/span>\n                    <span id=\"modal-base-score\" class=\"font-bold font-orbitron text-cyan-300\">0<\/span>\n                <\/div>\n                <div class=\"flex justify-between items-center text-slate-300\">\n                    <span>タイムボーナス:<\/span>\n                    <span id=\"modal-time-bonus\" class=\"font-bold font-orbitron text-amber-300\">+0<\/span>\n                <\/div>\n                <div class=\"flex justify-between items-center text-slate-300\">\n                    <span>最大コンボ:<\/span>\n                    <span id=\"modal-max-combo\" class=\"font-bold font-orbitron text-yellow-300\">x0<\/span>\n                <\/div>\n                <div class=\"flex justify-between items-center text-slate-300\">\n                    <span>総移動回数 (Moves):<\/span>\n                    <span id=\"modal-moves\" class=\"font-bold font-orbitron text-purple-300\">0<\/span>\n                <\/div>\n                <hr class=\"border-slate-800 my-1\">\n                <div class=\"flex justify-between items-center text-base font-extrabold text-white\">\n                    <span>最終スコア:<\/span>\n                    <span id=\"modal-final-score\" class=\"text-xl font-orbitron text-amber-400 neon-text-amber\">0<\/span>\n                <\/div>\n            <\/div>\n\n            <div class=\"flex flex-col gap-2.5\">\n                <button id=\"next-level-btn\" onclick=\"nextLevel()\" class=\"w-full py-3 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-black font-orbitron rounded-xl shadow-lg transition active:scale-95 text-xs md:text-sm uppercase tracking-wider flex items-center justify-center gap-2\">\n                    <span>次のレベルへ<\/span>\n                    <i class=\"fa-solid fa-arrow-right\"><\/i>\n                <\/button>\n\n                <div class=\"flex gap-2.5\">\n                    <button onclick=\"resetGame()\" class=\"flex-1 py-2.5 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold font-orbitron rounded-xl shadow-lg transition active:scale-95 text-xs\">\n                        もう一度あそぶ\n                    <\/button>\n                    <a href=\"title-mode.html\" class=\"flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold font-orbitron rounded-xl border border-slate-600 transition flex items-center justify-center text-xs\">\n                        タイトルへ\n                    <\/a>\n                <\/div>\n            <\/div>\n        <\/div>\n    <\/div>\n\n    <!-- GAME OVER MODAL -->\n    <div id=\"gameover-modal\" class=\"fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-md hidden p-4\">\n        <div class=\"neon-panel rounded-3xl p-6 md:p-8 max-w-md w-full text-center space-y-5 border-2 border-red-500 shadow-[0_0_50px_rgba(239,68,68,0.4)]\">\n            <div class=\"text-5xl text-red-500 animate-pulse\">\n                <i class=\"fa-solid fa-triangle-exclamation\"><\/i>\n            <\/div>\n            <h2 class=\"text-2xl md:text-3xl font-black font-orbitron text-red-500 drop-shadow-[0_0_15px_rgba(239,68,68,0.8)] uppercase tracking-wider\">\n                TIME UP - GAME OVER\n            <\/h2>\n            <p class=\"text-xs text-slate-300\">制限時間内に全てのカードを揃えることができませんでした。<\/p>\n\n            <div class=\"flex gap-3 pt-2\">\n                <button onclick=\"resetGame()\" class=\"flex-1 py-3 bg-gradient-to-r from-red-600 to-pink-600 hover:from-red-500 hover:to-pink-500 text-white font-bold font-orbitron rounded-xl shadow-lg transition active:scale-95 text-xs md:text-sm\">\n                    RETRY\n                <\/button>\n                <a href=\"title-mode.html\" class=\"flex-1 py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold font-orbitron rounded-xl border border-slate-600 transition flex items-center justify-center text-xs md:text-sm\">\n                    タイトルへ\n                <\/a>\n            <\/div>\n        <\/div>\n    <\/div>\n\n    <script>\n        // Web Audio API による即時効果音（ファイル読み込み不要）\n        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();\n        function playSound(type) {\n            if (audioCtx.state === 'suspended') audioCtx.resume();\n            const osc = audioCtx.createOscillator();\n            const gain = audioCtx.createGain();\n            osc.connect(gain);\n            gain.connect(audioCtx.destination);\n\n            const now = audioCtx.currentTime;\n            if (type === 'flip') {\n                osc.frequency.setValueAtTime(400, now);\n                osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);\n                gain.gain.setValueAtTime(0.1, now);\n                gain.gain.linearRampToValueAtTime(0.01, now + 0.08);\n                osc.start(now); osc.stop(now + 0.08);\n            } else if (type === 'match') {\n                osc.type = 'triangle';\n                osc.frequency.setValueAtTime(523.25, now);\n                osc.frequency.setValueAtTime(659.25, now + 0.08);\n                gain.gain.setValueAtTime(0.2, now);\n                gain.gain.linearRampToValueAtTime(0.01, now + 0.25);\n                osc.start(now); osc.stop(now + 0.25);\n            } else if (type === 'combo') {\n                osc.type = 'sawtooth';\n                osc.frequency.setValueAtTime(587.33, now);\n                osc.frequency.setValueAtTime(880, now + 0.1);\n                gain.gain.setValueAtTime(0.2, now);\n                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);\n                osc.start(now); osc.stop(now + 0.3);\n            } else if (type === 'bomb') {\n                osc.type = 'square';\n                osc.frequency.setValueAtTime(150, now);\n                osc.frequency.exponentialRampToValueAtTime(40, now + 0.3);\n                gain.gain.setValueAtTime(0.3, now);\n                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);\n                osc.start(now); osc.stop(now + 0.3);\n            } else if (type === 'over') {\n                osc.type = 'sawtooth';\n                osc.frequency.setValueAtTime(300, now);\n                osc.frequency.linearRampToValueAtTime(100, now + 0.5);\n                gain.gain.setValueAtTime(0.2, now);\n                gain.gain.linearRampToValueAtTime(0.01, now + 0.5);\n                osc.start(now); osc.stop(now + 0.5);\n            }\n        }\n\n        const ICON_POOL = [\n            { icon: '🚀' }, { icon: '🪐' }, { icon: '🛸' }, { icon: '👽' },\n            { icon: '🌙' }, { icon: '⭐' }, { icon: '🌍' }, { icon: '☄️' },\n            { icon: '🌞' }, { icon: '🛰️' }, { icon: '👨‍🚀' }, { icon: '💎' },\n            { icon: '⚡' }, { icon: '🧭' }, { icon: '🔭' }, { icon: '🛡️' },\n            { icon: '🎯' }, { icon: '🔥' }\n        ];\n\n        // 難易度ごとにヒント回数 (hints) を設定\n        const DIFFICULTY_SETTINGS = {\n            easy: { grid: 2, pairs: 2, time: 30, hints: 1, fontScale: 'text-4xl md:text-6xl', hasBomb: false, next: 'normal' },\n            normal: { grid: 4, pairs: 8, time: 60, hints: 3, fontScale: 'text-2xl md:text-4xl', hasBomb: false, next: 'hard' },\n            hard: { grid: 6, pairs: 17, time: 120, hints: 5, fontScale: 'text-lg md:text-2xl', hasBomb: true, next: null }\n        };\n\n        let currentDifficulty = 'easy';\n        let cards = [];\n        let flippedCards = [];\n        let matchedPairs = 0;\n        let score = 0;\n        let moves = 0;\n        let combo = 0;\n        let maxCombo = 0;\n        let remainingHints = 1;\n        let timer = 0;\n        let timerInterval = null;\n        let isBoardLocked = false;\n        let isGameStarted = false;\n\n        function createStars() {\n            const container = document.getElementById('stars-bg');\n            container.innerHTML = '';\n            for (let i = 0; i < 70; i++) {\n                const star = document.createElement('div');\n                star.className = 'star';\n                const size = Math.random() * 2.5 + 1;\n                star.style.width = `${size}px`;\n                star.style.height = `${size}px`;\n                star.style.left = `${Math.random() * 100}%`;\n                star.style.top = `${Math.random() * 100}%`;\n                star.style.animationDuration = `${Math.random() * 3 + 1.5}s`;\n                star.style.animationDelay = `${Math.random() * 2}s`;\n                container.appendChild(star);\n            }\n        }\n\n        function setDifficulty(diff) {\n            currentDifficulty = diff;\n            document.querySelectorAll('.diff-btn').forEach(btn => {\n                btn.classList.remove('bg-cyan-500', 'text-black', 'shadow-lg', 'shadow-cyan-500/30');\n                btn.classList.add('text-slate-300');\n            });\n            const activeBtn = document.getElementById(`btn-${diff}`);\n            if (activeBtn) {\n                activeBtn.classList.add('bg-cyan-500', 'text-black', 'shadow-lg', 'shadow-cyan-500/30');\n                activeBtn.classList.remove('text-slate-300');\n            }\n            resetGame();\n        }\n\n        function nextLevel() {\n            const nextDiff = DIFFICULTY_SETTINGS[currentDifficulty].next;\n            setDifficulty(nextDiff ? nextDiff : 'easy');\n        }\n\n        function resetGame() {\n            clearInterval(timerInterval);\n            timerInterval = null;\n\n            const setting = DIFFICULTY_SETTINGS[currentDifficulty];\n            score = 0;\n            moves = 0;\n            combo = 0;\n            maxCombo = 0;\n            matchedPairs = 0;\n            remainingHints = setting.hints; // 難易度別のヒント回数を初期化\n            timer = setting.time;\n            flippedCards = [];\n            isBoardLocked = false;\n            isGameStarted = false;\n\n            updateHintButton();\n            updateHUD();\n            document.getElementById('clear-modal').classList.add('hidden');\n            document.getElementById('gameover-modal').classList.add('hidden');\n\n            generateBoard(setting);\n            renderHighScores();\n        }\n\n        function updateHintButton() {\n            const hintBtn = document.getElementById('hint-btn');\n            document.getElementById('hint-text').textContent = `HINT (${remainingHints})`;\n\n            if (remainingHints <= 0) {\n                hintBtn.disabled = true;\n                hintBtn.classList.add('opacity-50', 'cursor-not-allowed');\n            } else {\n                hintBtn.disabled = false;\n                hintBtn.classList.remove('opacity-50', 'cursor-not-allowed');\n            }\n        }\n\n        function updateHUD() {\n            document.getElementById('score-display').textContent = score;\n            document.getElementById('timer-display').textContent = String(timer).padStart(3, '0');\n            document.getElementById('moves-display').textContent = moves;\n            document.getElementById('combo-display').textContent = `x${combo}`;\n        }\n\n        function generateBoard(setting) {\n            const board = document.getElementById('game-board');\n            board.innerHTML = '';\n            board.className = `grid gap-1.5 md:gap-2.5 p-2 neon-panel rounded-2xl grid-${setting.grid}x${setting.grid}`;\n\n            let selectedIcons = ICON_POOL.slice(0, setting.pairs);\n            let deck = [...selectedIcons, ...selectedIcons];\n\n            // 爆弾カード追加（Hardモード用）\n            if (setting.hasBomb) {\n                deck.push({ icon: '💣', isBomb: true });\n                deck.push({ icon: '💣', isBomb: true });\n            }\n\n            for (let i = deck.length - 1; i > 0; i--) {\n                const j = Math.floor(Math.random() * (i + 1));\n                [deck[i], deck[j]] = [deck[j], deck[i]];\n            }\n\n            cards = deck.map((item, index) => {\n                const cardEl = document.createElement('div');\n                cardEl.className = `card-container w-full h-full ${item.isBomb ? 'bomb' : ''}`;\n                cardEl.dataset.id = index;\n                cardEl.dataset.icon = item.icon;\n                if (item.isBomb) cardEl.dataset.isBomb = \"true\";\n\n                cardEl.innerHTML = `\n                    <div class=\"card-inner\">\n                        <div class=\"card-back\">\n                            <i class=\"fa-solid fa-atom back-logo\"><\/i>\n                        <\/div>\n                        <div class=\"card-front\">\n                            <span class=\"logo3d\">${item.icon}<\/span>\n                        <\/div>\n                    <\/div>\n                `;\n\n                cardEl.addEventListener('click', () => handleCardClick(cardEl));\n                board.appendChild(cardEl);\n                return cardEl;\n            });\n        }\n\n        function useHint() {\n            if (remainingHints <= 0 || isBoardLocked) return;\n            remainingHints--;\n            updateHintButton();\n\n            cards.forEach(card => {\n                if (!card.classList.contains('matched') && !card.classList.contains('flipped')) {\n                    card.classList.add('hinted');\n                }\n            });\n\n            setTimeout(() => {\n                cards.forEach(card => card.classList.remove('hinted'));\n            }, 1200);\n        }\n\n        function startTimer() {\n            if (isGameStarted) return;\n            isGameStarted = true;\n\n            timerInterval = setInterval(() => {\n                timer--;\n                document.getElementById('timer-display').textContent = String(timer).padStart(3, '0');\n                if (timer <= 0) {\n                    clearInterval(timerInterval);\n                    playSound('over');\n                    handleGameOver();\n                }\n            }, 1000);\n        }\n\n        function handleCardClick(cardEl) {\n            if (isBoardLocked) return;\n            if (cardEl.classList.contains('flipped') || cardEl.classList.contains('matched')) return;\n\n            if (!isGameStarted) startTimer();\n\n            playSound('flip');\n            cardEl.classList.add('flipped');\n\n            // 爆弾処理\n            if (cardEl.dataset.isBomb === \"true\") {\n                playSound('bomb');\n                triggerShake();\n                timer = Math.max(0, timer - 5);\n                updateHUD();\n                setTimeout(() => {\n                    cardEl.classList.remove('flipped');\n                }, 800);\n                return;\n            }\n\n            flippedCards.push(cardEl);\n\n            if (flippedCards.length === 2) {\n                moves++;\n                updateHUD();\n                checkPairMatch();\n            }\n        }\n\n        function triggerShake() {\n            const body = document.getElementById('body-root');\n            body.classList.add('shake');\n            setTimeout(() => body.classList.remove('shake'), 300);\n        }\n\n        function triggerComboBanner(multiplier) {\n            const banner = document.getElementById('combo-banner');\n            banner.textContent = `🔥 FEVER COMBO x${multiplier}! 🔥`;\n            banner.classList.remove('opacity-0');\n            setTimeout(() => banner.classList.add('opacity-0'), 1000);\n        }\n\n        function checkPairMatch() {\n            isBoardLocked = true;\n            const [card1, card2] = flippedCards;\n            const isMatch = card1.dataset.icon === card2.dataset.icon;\n\n            if (isMatch) {\n                combo++;\n                if (combo > maxCombo) maxCombo = combo;\n\n                if (combo > 1) {\n                    playSound('combo');\n                    triggerComboBanner(combo);\n                } else {\n                    playSound('match');\n                }\n\n                setTimeout(() => {\n                    card1.classList.add('matched');\n                    card2.classList.add('matched');\n                    flippedCards = [];\n                    isBoardLocked = false;\n\n                    score += 100 * combo;\n                    matchedPairs++;\n                    updateHUD();\n\n                    if (matchedPairs === DIFFICULTY_SETTINGS[currentDifficulty].pairs) {\n                        handleGameClear();\n                    }\n                }, 300);\n            } else {\n                combo = 0; // コンボリセット\n                setTimeout(() => {\n                    card1.classList.remove('flipped');\n                    card2.classList.remove('flipped');\n                    flippedCards = [];\n                    isBoardLocked = false;\n\n                    score = Math.max(0, score - 10);\n                    updateHUD();\n                }, 800);\n            }\n        }\n\n        function saveHighScore(finalScore) {\n            let key = `matching_hs_${currentDifficulty}`;\n            let scores = [];\n            try { scores = JSON.parse(localStorage.getItem(key) || \"[]\"); } catch (e) {}\n            scores.push(finalScore);\n            scores.sort((a, b) => b - a);\n            scores = scores.slice(0, 3);\n            try { localStorage.setItem(key, JSON.stringify(scores)); } catch (e) {}\n            renderHighScores();\n        }\n\n        function renderHighScores() {\n            let key = `matching_hs_${currentDifficulty}`;\n            let scores = [];\n            try { scores = JSON.parse(localStorage.getItem(key) || \"[]\"); } catch (e) {}\n            const container = document.getElementById('high-scores-list');\n            if (scores.length === 0) {\n                container.innerHTML = `<span class=\"text-slate-500\">NO RECORDS YET<\/span>`;\n            } else {\n                container.innerHTML = scores.map((s, i) => `<span>#${i+1}: <span class=\"text-cyan-300\">${s}<\/span><\/span>`).join('');\n            }\n        }\n\n        function handleGameClear() {\n            clearInterval(timerInterval);\n\n            const timeBonus = timer * 10;\n            const finalScore = score + timeBonus;\n\n            saveHighScore(finalScore);\n\n            document.getElementById('modal-base-score').textContent = score;\n            document.getElementById('modal-time-bonus').textContent = `+${timeBonus}`;\n            document.getElementById('modal-max-combo').textContent = `x${maxCombo}`;\n            document.getElementById('modal-moves').textContent = moves;\n            document.getElementById('modal-final-score').textContent = finalScore;\n\n            const nextBtn = document.getElementById('next-level-btn');\n            const nextDiff = DIFFICULTY_SETTINGS[currentDifficulty].next;\n\n            if (nextDiff === 'normal') {\n                nextBtn.innerHTML = `<span>NORMAL (4x4) へ挑戦<\/span> <i class=\"fa-solid fa-arrow-right\"><\/i>`;\n            } else if (nextDiff === 'hard') {\n                nextBtn.innerHTML = `<span>HARD (6x6) へ挑戦<\/span> <i class=\"fa-solid fa-arrow-right\"><\/i>`;\n            } else {\n                nextBtn.innerHTML = `<span>最初 (EASY) から遊ぶ<\/span> <i class=\"fa-solid fa-rotate-left\"><\/i>`;\n            }\n\n            document.getElementById('clear-modal').classList.remove('hidden');\n\n            if (typeof confetti === 'function') {\n                confetti({ particleCount: 150, spread: 90, origin: { y: 0.6 } });\n            }\n        }\n\n        function handleGameOver() {\n            isBoardLocked = true;\n            document.getElementById('gameover-modal').classList.remove('hidden');\n        }\n\n        // ===== INTRO CINEMATIC (~12s, skippable) =====\n        const INTRO_MS = 12300;\n        let introTimers = [], introActive = false, warpRAF = null, warpSpeed = 2, warpTarget = 2;\n\n        function introSound(type) {\n            try {\n                if (audioCtx.state === 'suspended') audioCtx.resume();\n                const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = audioCtx.currentTime;\n                o.connect(g); g.connect(audioCtx.destination);\n                if (type === 'whoosh') { o.type='sawtooth'; o.frequency.setValueAtTime(60,t); o.frequency.exponentialRampToValueAtTime(700,t+.9); g.gain.setValueAtTime(.001,t); g.gain.linearRampToValueAtTime(.12,t+.4); g.gain.linearRampToValueAtTime(.001,t+.9); o.start(t); o.stop(t+.9); }\n                else if (type === 'tick') { o.type='sine'; o.frequency.setValueAtTime(660,t); g.gain.setValueAtTime(.2,t); g.gain.exponentialRampToValueAtTime(.001,t+.25); o.start(t); o.stop(t+.25); }\n                else if (type === 'blip') { o.type='square'; o.frequency.setValueAtTime(900,t); g.gain.setValueAtTime(.06,t); g.gain.exponentialRampToValueAtTime(.001,t+.09); o.start(t); o.stop(t+.09); }\n                else if (type === 'chime') { o.type='triangle'; o.frequency.setValueAtTime(784,t); o.frequency.setValueAtTime(1175,t+.09); g.gain.setValueAtTime(.2,t); g.gain.exponentialRampToValueAtTime(.001,t+.35); o.start(t); o.stop(t+.35); }\n                else if (type === 'collect') { o.type='sine'; o.frequency.setValueAtTime(400,t); o.frequency.exponentialRampToValueAtTime(900,t+.2); g.gain.setValueAtTime(.12,t); g.gain.exponentialRampToValueAtTime(.001,t+.25); o.start(t); o.stop(t+.25); }\n                else if (type === 'go') { o.type='triangle'; o.frequency.setValueAtTime(523,t); o.frequency.setValueAtTime(784,t+.1); o.frequency.setValueAtTime(1047,t+.2); g.gain.setValueAtTime(.25,t); g.gain.exponentialRampToValueAtTime(.001,t+.6); o.start(t); o.stop(t+.6); }\n            } catch (e) {}\n        }\n\n        // Warp-speed starfield\n        function startWarp() {\n            const cv = document.getElementById('warp'), ctx = cv.getContext('2d');\n            const resize = () => { cv.width = innerWidth; cv.height = innerHeight; };\n            resize(); window.onresize = resize;\n            const stars = Array.from({ length: 220 }, () => ({ x: (Math.random()-.5)*2, y: (Math.random()-.5)*2, z: Math.random()*1.5+.1, px: null, py: null }));\n            (function loop() {\n                warpSpeed += (warpTarget - warpSpeed) * 0.04;\n                ctx.fillStyle = 'rgba(3,5,13,0.35)'; ctx.fillRect(0, 0, cv.width, cv.height);\n                const cx = cv.width/2, cy = cv.height/2, k = Math.max(cv.width, cv.height) * 0.6;\n                for (const st of stars) {\n                    st.z -= warpSpeed * 0.0035;\n                    if (st.z <= 0.02) { st.x=(Math.random()-.5)*2; st.y=(Math.random()-.5)*2; st.z=1.5; st.px=null; }\n                    const sx = cx + st.x / st.z * k * 0.5, sy = cy + st.y / st.z * k * 0.5;\n                    const a = Math.min(1, (1.5 - st.z) * 1.2);\n                    ctx.strokeStyle = `rgba(190,230,255,${a})`; ctx.lineWidth = Math.max(.6, (1.5 - st.z) * 1.8);\n                    ctx.beginPath(); ctx.moveTo(st.px ?? sx, st.py ?? sy); ctx.lineTo(sx, sy); ctx.stroke();\n                    st.px = sx; st.py = sy;\n                }\n                warpRAF = requestAnimationFrame(loop);\n            })();\n        }\n        function stopWarp() { cancelAnimationFrame(warpRAF); warpRAF = null; }\n\n        function showScene(n) {\n            document.querySelectorAll('#intro .scene').forEach((el, i) => el.classList.toggle('show', i === n));\n        }\n        function at(ms, fn) { introTimers.push(setTimeout(fn, ms)); }\n        const $i = (id) => document.getElementById(id);\n        const rnd = (a, b) => a + Math.random() * (b - a);\n\n        // ---- scattered-card story helpers ----\n        const INTRO_ICONS = ['🚀', '🪐', '🛸', '👽', '🌙', '⭐', '🌍', '☄️'];\n        const ic = { cards: [], cs: 80, ss: 40, collected: 0 };\n\n        function icPlace(c, x, y, r, s, t) {\n            c.x = x; c.y = y;\n            c.el.style.setProperty('--t', t + 's');\n            c.el.style.transform = `translate(${x - ic.cs / 2}px, ${y - ic.cs / 2}px) rotate(${r}deg) scale(${s})`;\n        }\n        function icSeek(x, y, t) {\n            const s = $i('seeker');\n            s.style.setProperty('--t', t + 's');\n            s.style.transform = `translate(${x - 32}px, ${y - 32}px)`;\n        }\n        function icSlot(i) {\n            const r = $i('tray').children[i].getBoundingClientRect();\n            return { x: r.left + r.width / 2, y: r.top + r.height / 2 };\n        }\n        function icCap(t, s, j) {\n            $i('cap-t').textContent = t; $i('cap-s').textContent = s; $i('cap-j').textContent = j;\n            const box = $i('cap'); box.classList.remove('cap-anim'); void box.offsetWidth; box.classList.add('cap-anim');\n        }\n        function icBurst(x, y) {\n            const b = document.createElement('div');\n            b.className = 'burst'; b.style.left = x + 'px'; b.style.top = y + 'px';\n            b.innerHTML = '<span>MATCH!<\/span>' + Array.from({ length: 10 }, (_, i) => `<i style=\"--a:${i * 36}deg\"><\/i>`).join('');\n            $i('cardfield').appendChild(b);\n            setTimeout(() => b.remove(), 1000);\n        }\n\n        // 16 cards (8 pairs) burst out of the centre and tumble around the screen\n        function icBuild() {\n            const W = innerWidth, H = innerHeight;\n            ic.cs = Math.round(Math.max(54, Math.min(104, Math.min(W, H) * 0.14)));\n            ic.ss = Math.round(Math.max(28, Math.min(54, (W - 70) / 9.2)));\n            ic.collected = 0;\n            const root = $i('intro');\n            root.style.setProperty('--cs', ic.cs + 'px'); root.style.setProperty('--ss', ic.ss + 'px');\n            const tray = $i('tray'); tray.className = ''; tray.innerHTML = '<i class=\"slot\"><\/i>'.repeat(16);\n            const field = $i('cardfield'); field.innerHTML = '';\n            $i('seeker').classList.remove('show');\n            ic.cards = [];\n            INTRO_ICONS.forEach((icon, p) => [0, 1].forEach(() => {\n                const el = document.createElement('div');\n                el.className = 'ic';\n                el.style.zIndex = 1 + Math.floor(Math.random() * 10);\n                el.innerHTML = `<div class=\"ic-in\" style=\"animation-duration:${rnd(2.4, 4.4).toFixed(2)}s;animation-delay:-${rnd(0, 3).toFixed(2)}s\"><div class=\"flipper\"><div class=\"f\"><span class=\"ilogo\">${icon}<\/span><\/div><div class=\"b\"><i class=\"fa-solid fa-atom\"><\/i><\/div><\/div><\/div>`;\n                field.appendChild(el);\n                const c = { el, p, x: W / 2, y: H / 2 };\n                icPlace(c, W / 2, H * 0.5, 0, 0, 0);\n                ic.cards.push(c);\n            }));\n            void field.offsetWidth;\n            const capBottom = $i('cap').getBoundingClientRect().bottom;\n            const yMin = capBottom + ic.cs * 0.55;\n            const yMax = Math.max(yMin + 40, tray.getBoundingClientRect().top - ic.cs * 0.6);\n            [...ic.cards].sort(() => Math.random() - 0.5).forEach((c, i) =>\n                at(120 + i * 55, () => icPlace(c, rnd(ic.cs * 0.7, W - ic.cs * 0.7), rnd(yMin, yMax), rnd(-70, 70), rnd(0.8, 1.25), 1.1)));\n        }\n\n        // The player's cursor finds a card, finds its twin, they merge and are collected\n        function icMatch(p, f) {\n            const [A, B] = ic.cards.filter((c) => c.p === p);\n            let mx = 0, my = 0;\n            icSeek(A.x, A.y, 0.38 * f);\n            at(400 * f, () => { A.el.classList.add('pick'); introSound('blip'); icSeek(B.x, B.y, 0.38 * f); });\n            at(800 * f, () => {\n                B.el.classList.add('pick'); introSound('blip');\n                mx = (A.x + B.x) / 2; my = (A.y + B.y) / 2;\n                const off = ic.cs * 0.58;\n                A.el.style.zIndex = B.el.style.zIndex = 20;\n                icPlace(A, mx - off, my, -6, 1.15, 0.35 * f);\n                icPlace(B, mx + off, my, 6, 1.15, 0.35 * f);\n            });\n            at(1200 * f, () => {\n                icBurst(mx, my); introSound('chime');\n                [A, B].forEach((c) => { c.el.classList.remove('pick'); c.el.classList.add('done'); });\n            });\n            at(1500 * f, () => {\n                [A, B].forEach((c, k) => {\n                    const s = icSlot(k * 8 + p);\n                    c.el.classList.add('settled');\n                    icPlace(c, s.x, s.y, 0, ic.ss / ic.cs, 0.65);\n                });\n                introSound('collect');\n                ic.collected++;\n                $i('intro-count').textContent = `${ic.collected} / 8`;\n            });\n        }\n\n        function startIntro() {\n            if (introActive) return;\n            introActive = true;\n            const cfg = DIFFICULTY_SETTINGS[currentDifficulty];\n            const rules = `⏱ ${cfg.time}s  ·  🔥 COMBO = BONUS` + (cfg.hasBomb ? '  ·  💣 BOMB = -5s' : '');\n            const intro = $i('intro');\n            intro.classList.add('playing');\n            if (!warpRAF) startWarp();\n            warpTarget = 4; introSound('whoosh');\n            showScene(-1);\n\n            $i('intro-count').textContent = ''; $i('intro-rules').textContent = '';\n            icCap('SIGNAL LOST', 'The star-cards have been scattered across space…', '星のカードが宇宙に散らばってしまった…');\n            icBuild();                                              // 0.0s  cards scatter in a mess\n\n            at(2900, () => { icSeek(innerWidth / 2, innerHeight * 0.5, 0); $i('seeker').classList.add('show'); });\n            at(3000, () => {                                        // 3.0s  player starts searching\n                icCap('FIND THE PAIRS', 'Spot two identical cards.', '同じカードを見つけよう');\n                $i('intro-count').textContent = '0 / 8'; introSound('whoosh');\n            });\n            [3200, 4200, 5200].forEach((ms, k) => at(ms, () => icMatch(k, 1)));            // slow, readable matches\n            at(5900, () => icCap('COLLECT THEM ALL', 'Match every pair to bring order back.', 'ペアを揃えて全部集めよう'));\n            [3, 4, 5, 6, 7].forEach((p, k) => at(6000 + k * 420, () => icMatch(p, 0.5)));  // faster chain\n            at(8600, () => $i('seeker').classList.remove('show'));\n\n            at(9150, () => {                                        // 9.15s order restored\n                ic.cards.forEach((c) => c.el.classList.add('flipcard'));\n                $i('tray').classList.add('restored'); introSound('chime');\n                icCap('ORDER RESTORED', 'All star-cards recovered. Time to play!', '秩序が戻った — ゲーム開始！');\n                $i('intro-count').textContent = '8 / 8'; $i('intro-rules').textContent = rules;\n                warpTarget = 12;\n            });\n            const num = $i('count-num');\n            [['3', 9500], ['2', 10250], ['1', 11000], ['GO!', 11750]].forEach(([tx, ms]) => at(ms, () => {\n                num.style.animation = 'none'; void num.offsetWidth; num.style.animation = '';\n                num.textContent = tx; introSound(tx === 'GO!' ? 'go' : 'tick');\n                if (tx === 'GO!') warpTarget = 45;\n            }));\n            at(INTRO_MS, endIntro);\n        }\n\n        function skipIntro() { if (introActive) endIntro(); }\n\n        function endIntro() {\n            if (!introActive) return;\n            introActive = false;\n            introTimers.forEach(clearTimeout); introTimers = [];\n            const intro = document.getElementById('intro');\n            intro.classList.add('out');\n            resetGame();                                    // fresh shuffled board\n            const board = document.getElementById('game-board');\n            [...board.children].forEach((c, i) => c.style.setProperty('--i', i));\n            board.classList.add('dealing');\n            setTimeout(() => board.classList.remove('dealing'), 1800);\n            setTimeout(() => { intro.style.display = 'none'; stopWarp(); $i('cardfield').innerHTML = ''; }, 650);\n        }\n\n        document.addEventListener('keydown', (e) => {\n            if (e.key === 'Enter' && !introActive && document.getElementById('intro').style.display !== 'none' && !document.getElementById('intro').classList.contains('out')) startIntro();\n            if (e.key === 'Escape') skipIntro();\n        });\n\n        window.onload = function() {\n            createStars();\n            setDifficulty('easy');\n            startWarp();   // ambient starfield behind the launch screen\n            if (EMBEDDED) { document.documentElement.classList.add('embedded'); startIntro(); } // title page already had the PLAY click\n        };\n\n        // Inside title-mode.html: \"title\" links close the game frame instead of navigating\n        const EMBEDDED = window.self !== window.top;\n        document.addEventListener('click', (e) => {\n            const a = e.target.closest('a[href=\"title-mode.html\"]');\n            if (a && EMBEDDED) { e.preventDefault(); try { window.parent.exitGame(); } catch (err) { window.top.location.reload(); } }\n        });\n    <\/script>\n<\/body>\n<\/html>",
  'space-shooter': "<!DOCTYPE html>\n<html lang=\"ja\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Space Shooter<\/title>\n    <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n    <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n    <link href=\"https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap\" rel=\"stylesheet\">\n    <style>\n* { box-sizing: border-box; }\n\n:root {\n    --cyan: #5fd8ff;\n    --violet: #a88bff;\n    --pink: #ff5cc8;\n    --gold: #ffd27a;\n    --font-hud: \"Orbitron\", \"Sora\", \"Noto Sans JP\", sans-serif;\n}\n\nhtml, body { height: 100%; }\n\nbody {\n    margin: 0;\n    display: grid;\n    place-items: center;\n    padding: 58px 10px 10px;\n    overflow: hidden;\n    color: #eaf2ff;\n    font-family: \"Noto Sans JP\", \"Inter\", Arial, sans-serif;\n    background:\n        radial-gradient(ellipse at 50% 0%, #0d1740 0%, #04071a 50%, #010208 100%);\n}\n\n/* ---------- stage (keeps 4:3, fits any window) ---------- */\n.stage {\n    position: relative;\n    container-type: inline-size;\n    width: min(100%, calc((100vh - 70px) * 4 / 3));\n    aspect-ratio: 4 / 3;\n    overflow: hidden;\n    border-radius: 14px;\n    background: #02030a;\n    border: 1px solid rgba(110, 170, 255, .28);\n    box-shadow:\n        0 0 0 1px rgba(0, 0, 0, .6),\n        0 0 60px -10px rgba(70, 120, 255, .45),\n        0 30px 80px -30px rgba(0, 0, 0, .9),\n        inset 0 0 50px rgba(30, 60, 160, .25);\n}\n\n#gameCanvas {\n    position: absolute;\n    inset: 0;\n    display: block;\n    width: 100%;\n    height: 100%;\n    touch-action: none;\n}\n\n.fx { position: absolute; inset: 0; pointer-events: none; }\n.fx-vignette { background: radial-gradient(120% 95% at 50% 45%, transparent 55%, rgba(0, 0, 8, .75) 100%); }\n.fx-scan { opacity: .5; background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .025) 0 1px, transparent 1px 3px); mix-blend-mode: overlay; }\n\n/* ---------- HUD ---------- */\n.hud {\n    position: absolute;\n    top: 0; left: 0; right: 0;\n    display: flex;\n    justify-content: space-between;\n    padding: 2.2cqw 2.4cqw;\n    pointer-events: none;\n}\n.hud-block { display: flex; gap: 1.2cqw; }\n\n.stat {\n    min-width: 11cqw;\n    padding: .9cqw 1.5cqw 1cqw;\n    border-radius: 10px;\n    background: linear-gradient(160deg, rgba(14, 24, 58, .72), rgba(6, 10, 28, .6));\n    border: 1px solid rgba(120, 170, 255, .22);\n    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .07), 0 8px 24px -14px rgba(0, 0, 0, .9);\n    -webkit-backdrop-filter: blur(6px);\n    backdrop-filter: blur(6px);\n}\n.stat span {\n    display: block;\n    font: 500 clamp(8px, 1.25cqw, 11px)/1 var(--font-hud);\n    letter-spacing: .28em;\n    color: #7f93bd;\n}\n.stat strong {\n    display: block;\n    margin-top: .6cqw;\n    font: 700 clamp(14px, 2.6cqw, 24px)/1.1 var(--font-hud);\n    letter-spacing: .06em;\n    font-variant-numeric: tabular-nums;\n}\n#score { color: var(--gold); text-shadow: 0 0 14px rgba(255, 210, 122, .55); }\n#hp    { color: #ff6f94; text-shadow: 0 0 14px rgba(255, 90, 140, .6); letter-spacing: .12em; }\n#power { color: #79f7d4; text-shadow: 0 0 14px rgba(120, 255, 210, .5); }\n#bestScore { color: #c9d6f5; }\n\n/* ---------- boss bar ---------- */\n.boss-hud {\n    position: absolute;\n    left: 50%; bottom: 2.6cqw;\n    width: 58%;\n    display: flex; align-items: center; gap: 1.6cqw;\n    padding: .9cqw 1.6cqw;\n    border-radius: 999px;\n    background: rgba(18, 6, 28, .7);\n    border: 1px solid rgba(255, 92, 200, .4);\n    box-shadow: 0 0 30px -8px rgba(255, 60, 180, .6);\n    -webkit-backdrop-filter: blur(6px);\n    backdrop-filter: blur(6px);\n    transform: translate(-50%, 16px);\n    opacity: 0; pointer-events: none;\n    transition: opacity .4s, transform .5s cubic-bezier(.2, .7, .2, 1);\n}\n.boss-hud.show { opacity: 1; transform: translate(-50%, 0); }\n.boss-hud .bl { font: 700 clamp(9px, 1.5cqw, 13px)/1 var(--font-hud); letter-spacing: .3em; color: var(--pink); text-shadow: 0 0 12px var(--pink); }\n.boss-hud strong { min-width: 3.4em; text-align: right; font: 700 clamp(10px, 1.6cqw, 14px)/1 var(--font-hud); color: #ffc2e8; font-variant-numeric: tabular-nums; }\n.boss-bar-track { flex: 1; height: 1cqw; min-height: 6px; border-radius: 99px; background: rgba(255, 255, 255, .1); overflow: hidden; }\n#bossBarFill { width: 0; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #ff3f8e, #ff9be0); box-shadow: 0 0 14px #ff4fb0; transition: width .12s linear; }\n\n/* ---------- overlay (title / pause / result) ---------- */\n.overlay {\n    position: absolute;\n    inset: 0;\n    display: grid;\n    place-items: center;\n    padding: 4cqw;\n    background:\n        radial-gradient(ellipse at 50% 40%, rgba(10, 20, 60, .55), rgba(1, 3, 12, .9) 75%);\n    -webkit-backdrop-filter: blur(5px);\n    backdrop-filter: blur(5px);\n}\n.overlay.hidden { display: none; }\n\n.panel {\n    position: relative;\n    width: min(92%, 520px);\n    padding: 3.4cqw 4cqw 3cqw;\n    text-align: center;\n    border-radius: 20px;\n    background: linear-gradient(165deg, rgba(16, 26, 64, .8), rgba(5, 9, 26, .85));\n    border: 1px solid rgba(130, 180, 255, .28);\n    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .09), 0 30px 70px -30px #000, 0 0 70px -20px rgba(80, 130, 255, .5);\n    animation: panelIn .7s cubic-bezier(.2, .7, .2, 1) both;\n}\n@keyframes panelIn { from { opacity: 0; transform: translateY(18px) scale(.97); filter: blur(6px); } }\n\n.kicker { margin: 0 0 1.4cqw; font: 500 clamp(9px, 1.3cqw, 12px)/1 var(--font-hud); letter-spacing: .42em; color: #7f93bd; }\n\n.overlay h2 {\n    margin: 0;\n    font: 900 clamp(24px, 5.6cqw, 50px)/1.05 var(--font-hud);\n    letter-spacing: .08em;\n    background: linear-gradient(100deg, #7be4ff 0%, #b9a6ff 55%, #ff9be0 100%);\n    -webkit-background-clip: text; background-clip: text;\n    -webkit-text-fill-color: transparent; color: transparent;\n    filter: drop-shadow(0 0 18px rgba(110, 160, 255, .5));\n}\n\n.overlay p#overlayMessage {\n    margin: 2cqw 0 2.8cqw;\n    line-height: 1.9;\n    font-size: clamp(12px, 1.9cqw, 16px);\n    color: #c3d2ee;\n    white-space: pre-line;\n}\n\nbutton {\n    position: relative;\n    padding: 1.7cqw 5cqw;\n    border: 0;\n    border-radius: 999px;\n    font: 700 clamp(12px, 2cqw, 17px)/1 var(--font-hud);\n    letter-spacing: .22em;\n    color: #04101f;\n    cursor: pointer;\n    background: linear-gradient(120deg, #7be4ff, #7d8dff 60%, #c084ff);\n    box-shadow: 0 0 0 4px rgba(120, 160, 255, .14), 0 14px 34px -10px rgba(90, 140, 255, .8), inset 0 1px 0 rgba(255, 255, 255, .55);\n    transition: transform .3s cubic-bezier(.2, .7, .2, 1), box-shadow .3s, filter .3s;\n    animation: pulse 2.4s ease-in-out infinite;\n}\n@keyframes pulse { 50% { box-shadow: 0 0 0 9px rgba(120, 160, 255, .06), 0 14px 40px -8px rgba(110, 160, 255, 1), inset 0 1px 0 rgba(255, 255, 255, .55); } }\nbutton:hover { transform: translateY(-2px) scale(1.04); filter: brightness(1.12); }\nbutton:active { transform: scale(.97); }\nbutton:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }\n\n.keys {\n    list-style: none;\n    margin: 2.8cqw 0 0;\n    padding: 2cqw 0 0;\n    display: flex; justify-content: center; flex-wrap: wrap; gap: 1.4cqw 3cqw;\n    border-top: 1px solid rgba(255, 255, 255, .08);\n    font-size: clamp(10px, 1.45cqw, 13px);\n    color: #8fa3cb;\n}\n.keys li { display: flex; align-items: center; gap: .6cqw; }\nkbd {\n    padding: .35cqw .9cqw;\n    border-radius: 6px;\n    font: 500 clamp(9px, 1.3cqw, 12px)/1.2 var(--font-hud);\n    letter-spacing: .08em;\n    color: #d8e6ff;\n    background: rgba(255, 255, 255, .07);\n    border: 1px solid rgba(255, 255, 255, .18);\n    border-bottom-width: 2px;\n}\n\n@media (max-width: 560px) {\n    body { padding: 54px 4px 4px; }\n    .stat { min-width: 0; }\n}\n\n\n/* ---------- stage select / banner / boss pips ---------- */\n.stage-select { z-index: 5; }\n.ss-wrap { width: 100%; text-align: center; animation: panelIn .7s cubic-bezier(.2,.7,.2,1) both; }\n.stage-select h2 { margin: 0; font: 900 clamp(22px, 4.6cqw, 40px)/1.05 var(--font-hud); letter-spacing: .12em;\n  background: linear-gradient(100deg,#7be4ff,#b9a6ff 55%,#ff9be0); -webkit-background-clip: text; background-clip: text;\n  -webkit-text-fill-color: transparent; color: transparent; }\n.ss-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.3cqw; margin: 2cqw 0 1.4cqw; }\n.ss-card { position: relative; cursor: pointer; padding: .6cqw .5cqw 1.1cqw; border-radius: 14px; text-align: center;\n  background: linear-gradient(165deg, rgba(16,26,64,.7), rgba(5,9,26,.82)); border: 1px solid rgba(130,180,255,.22);\n  transition: transform .3s cubic-bezier(.2,.7,.2,1), border-color .3s, box-shadow .3s; }\n.ss-card:hover, .ss-card:focus-visible { transform: translateY(-4px) scale(1.03); border-color: rgba(130,220,255,.85);\n  box-shadow: 0 0 34px -6px rgba(90,170,255,.75); outline: none; }\n.ss-card canvas { width: 100%; display: block; aspect-ratio: 1; }\n.ss-card b { display: block; font: 700 clamp(7px,1.1cqw,11px)/1 var(--font-hud); letter-spacing: .3em; color: #7f93bd; }\n.ss-card strong { display: block; margin-top: .6cqw; font: 800 clamp(10px,1.7cqw,15px)/1 var(--font-hud); letter-spacing: .1em; color: #eaf2ff; }\n.ss-card em { display: block; margin-top: .6cqw; font: 500 clamp(6px,.95cqw,10px)/1 var(--font-hud); font-style: normal; letter-spacing: .18em; color: #ff7d93; }\n.ss-card.cleared { border-color: rgba(120,255,200,.55); }\n.ss-card.cleared em { color: #79f7d4; }\n.ss-foot { margin: 0; font-size: clamp(9px,1.4cqw,13px); letter-spacing: .12em; color: #8fa3cb; }\n.banner { position: absolute; left: 0; right: 0; top: 33%; text-align: center; pointer-events: none; opacity: 0; z-index: 4; }\n.banner.show { animation: bannerIn 2.6s cubic-bezier(.2,.7,.2,1) forwards; }\n@keyframes bannerIn { 0%{opacity:0;transform:scale(1.3);filter:blur(10px)} 12%{opacity:1;transform:none;filter:none} 78%{opacity:1} 100%{opacity:0;transform:scale(.98)} }\n.banner small { display: block; font: 500 clamp(9px,1.5cqw,13px)/1 var(--font-hud); letter-spacing: .5em; color: #9fb6e6; }\n.banner b { display: block; margin-top: 1cqw; font: 900 clamp(22px,6cqw,56px)/1 var(--font-hud); letter-spacing: .14em; color: #fff; text-shadow: 0 0 28px rgba(110,170,255,.85); }\n.banner.warn small { color: #ff8a96; }\n.banner.warn b { color: #ff3b52; text-shadow: 0 0 32px rgba(255,40,60,.95); }\n.stage-tag { position: absolute; top: 9.4cqw; left: 50%; transform: translateX(-50%); white-space: nowrap; pointer-events: none;\n  font: 600 clamp(8px,1.2cqw,11px)/1 var(--font-hud); letter-spacing: .3em; color: #9fb6e6; text-shadow: 0 0 10px #000; }\n.pips { display: flex; gap: .7cqw; align-items: center; }\n.pips i { width: 1.1cqw; height: 1.1cqw; min-width: 6px; min-height: 6px; transform: rotate(45deg); background: rgba(255,255,255,.15); transition: .3s; }\n.pips i.on { background: #ff3f5e; box-shadow: 0 0 10px #ff3f5e; }\n.boss-hud { border-color: rgba(255,70,90,.5) !important; box-shadow: 0 0 30px -8px rgba(255,40,70,.7) !important; }\n.boss-hud .bl { color: #ff4a5e !important; text-shadow: 0 0 12px #ff2a48 !important; }\n#bossBarFill { background: linear-gradient(90deg,#ff2b4a,#ff9a5c) !important; box-shadow: 0 0 14px #ff3050 !important; }\n#menuButton { margin-top: 1.4cqw; background: rgba(255,255,255,.07); color: #cfe0ff; box-shadow: none; animation: none; border: 1px solid rgba(255,255,255,.22); }\n#menuButton[hidden] { display: none; }\n<\/style>\n    <\/head>\n<body>\n    <main class=\"stage\" id=\"stage\">\n        <canvas id=\"gameCanvas\" width=\"800\" height=\"600\"\n                aria-label=\"スペースシューティングゲーム\"><\/canvas>\n\n        <div class=\"fx fx-vignette\"><\/div>\n        <div class=\"fx fx-scan\"><\/div>\n\n        <header class=\"hud\" aria-label=\"ゲームステータス\">\n            <div class=\"hud-block\">\n                <div class=\"stat score\"><span>SCORE<\/span><strong id=\"score\">0<\/strong><\/div>\n                <div class=\"stat hull\"><span>HULL<\/span><strong id=\"hp\">♥ ♥ ♥<\/strong><\/div>\n            <\/div>\n            <div class=\"hud-block\">\n                <div class=\"stat power\"><span>SHOT<\/span><strong id=\"power\">1<\/strong><\/div>\n                <div class=\"stat best\"><span>BEST<\/span><strong id=\"bestScore\">0<\/strong><\/div>\n            <\/div>\n        <\/header>\n\n        <div class=\"boss-hud\" id=\"bossHud\">\n            <span class=\"bl\">DEVOURER<\/span>\n            <div class=\"pips\" id=\"bossPips\"><i><\/i><i><\/i><i><\/i><i><\/i><i><\/i><\/div>\n            <div class=\"boss-bar-track\"><div id=\"bossBarFill\"><\/div><\/div>\n            <strong id=\"bossHp\">---<\/strong>\n        <\/div>\n\n        <div id=\"overlay\" class=\"overlay\">\n            <div class=\"panel\">\n                <p class=\"kicker\">TERA FES 2026<\/p>\n                <h2 id=\"overlayTitle\">SPACE SHOOTER<\/h2>\n                <p id=\"overlayMessage\">敵を倒して、ボスを撃破しよう！<\/p>\n                <button id=\"startButton\">GAME START<\/button>\n                <button id=\"menuButton\" hidden>STAGE SELECT<\/button>\n                <ul class=\"keys\">\n                    <li><kbd>W A S D<\/kbd><kbd>↑ ← ↓ →<\/kbd><span>移動<\/span><\/li>\n                    <li><kbd>SPACE<\/kbd><span>射撃<\/span><\/li>\n                    <li><kbd>ESC<\/kbd><span>一時停止<\/span><\/li>\n                <\/ul>\n            <\/div>\n        <\/div>\n        <div class=\"stage-tag\" id=\"stageTag\"><\/div>\n        <div class=\"banner\" id=\"banner\"><small><\/small><b><\/b><\/div>\n\n        <div id=\"stageSelect\" class=\"overlay stage-select hidden\">\n            <div class=\"ss-wrap\">\n                <h2>SELECT STAGE<\/h2>\n                <div class=\"ss-grid\" id=\"ssGrid\"><\/div>\n                <p class=\"ss-foot\">SURVIVE 30 SECONDS · DESTROY THE BOSS TO CLEAR THE STAGE<\/p>\n            <\/div>\n        <\/div>\n    <\/main>\n<script>\n\n\"use strict\";\n\n// ==============================\n// Space Shooter - Game Logic\n// ==============================\n\nconst canvas = document.getElementById(\"gameCanvas\");\nconst ctx = canvas.getContext(\"2d\");\n\nconst scoreElement = document.getElementById(\"score\");\nconst hpElement = document.getElementById(\"hp\");\nconst powerElement = document.getElementById(\"power\");\nconst bossHpElement = document.getElementById(\"bossHp\");\nconst bossBarFill = document.getElementById(\"bossBarFill\");\nconst bestScoreElement = document.getElementById(\"bestScore\");\n\nconst overlay = document.getElementById(\"overlay\");\nconst overlayTitle = document.getElementById(\"overlayTitle\");\nconst overlayMessage = document.getElementById(\"overlayMessage\");\nconst startButton = document.getElementById(\"startButton\");\n\nconst WIDTH = canvas.width;\nconst HEIGHT = canvas.height;\nconst BOSS_KILL_LIMIT = 24;   // 4 waves x 6 enemies, then the boss\nconst WAVE_LENGTH = 5.5;      // seconds per wave\nconst WAVE_NORMALS = 5;       // normal enemies per wave\nconst MAX_ON_SCREEN = 9;       // hard cap so the screen never floods\n\nconst keys = new Set();\n\nlet state = \"ready\";\nlet score = 0;\nlet bestScore = loadBestScore();\nlet defeatedEnemies = 0;\nlet waveTime = 0;\nlet waveSchedule = [];\nlet waveNumber = 0;\nlet gameTime = 0;\nlet lastTime = 0;\nlet animationId = 0;\nlet boss = null;\nlet bossSpawned = false;\nlet shake = 0;\n\nlet player;\nlet playerBullets = [];\nlet enemyBullets = [];\nlet enemies = [];\nlet items = [];\nlet particles = [];\nlet rings = [];\nlet hurtFlash = 0;\nlet bgScroll = 0;\nlet time = 0;\n\nconst bossHud = document.getElementById(\"bossHud\");\nconst bossPips = [...document.querySelectorAll(\"#bossPips i\")];\nconst stageTag = document.getElementById(\"stageTag\");\nconst banner = document.getElementById(\"banner\");\nconst stageSelect = document.getElementById(\"stageSelect\");\nconst menuButton = document.getElementById(\"menuButton\");\nconst ssGrid = document.getElementById(\"ssGrid\");\nconst BOSS_TIME = 30;      // boss arrives 30 s after the stage starts\nconst BOSS_LEVELS = 5;     // boss has 5 HP levels\nlet stageIdx = 0;\nlet bossWarned = false;\nlet bgPlanet = null;\nlet ssCards = [];\nlet bannerTimer = 0;\n\nconst stars = Array.from({ length: 140 }, () => {\n    const z = Math.random();\n    const roll = Math.random();\n\n    return {\n        x: Math.random() * WIDTH,\n        y: Math.random() * HEIGHT,\n        z,\n        size: 0.6 + z * 1.7,\n        speed: 14 + z * 80,\n        tw: Math.random() * Math.PI * 2,\n        color: roll < 0.2 ? \"#9fd8ff\" : roll < 0.33 ? \"#ffc6e8\" : \"#e6f1ff\"\n    };\n});\n\n\n// ---------- Procedural 3D planets ----------\nconst sst = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };\nconst mixc = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];\n\nfunction hash3(x, y, z) {\n    let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(z, 1274126177);\n    h = Math.imul(h ^ (h >>> 13), 1274126177);\n    return ((h ^ (h >>> 16)) >>> 0) / 4294967295;\n}\nfunction vnoise(x, y, z) {\n    const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);\n    const xf = x - xi, yf = y - yi, zf = z - zi;\n    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);\n    const n = (a, b, c) => hash3(xi + a, yi + b, zi + c);\n    const l = (a, b, t) => a + (b - a) * t;\n    return l(\n        l(l(n(0,0,0), n(1,0,0), u), l(n(0,1,0), n(1,1,0), u), v),\n        l(l(n(0,0,1), n(1,0,1), u), l(n(0,1,1), n(1,1,1), u), v), w);\n}\nfunction fbm(x, y, z, oct = 4) {\n    let s = 0, a = 0.5, f = 1, t = 0;\n    for (let i = 0; i < oct; i++) { s += a * vnoise(x * f, y * f, z * f); t += a; f *= 2; a *= 0.5; }\n    return s / t;\n}\nconst wrapA = (a) => Math.atan2(Math.sin(a), Math.cos(a));\n\nconst PLANETS = [\n    { name: \"MERCURY\", atmo: [175,175,190], atmoK: 0.25, tilt: 0.05, cardR: 26, bgR: 66, bgX: 650, bgY: 150, spin: 0.02,\n      fn: (x, y, z) => { const n = fbm(x*3, y*3, z*3, 4); let g = 90 + n*100;\n          g *= 1 - 0.55 * sst(.56, .7, fbm(x*8+5, y*8, z*8, 3));\n          g *= 0.8 + Math.abs(fbm(x*15, y*15, z*15, 2) - .5) * .9; return [g*1.02, g*.97, g*.9]; } },\n    { name: \"VENUS\", atmo: [255,190,90], atmoK: 0.9, tilt: 0.1, cardR: 34, bgR: 90, bgX: 650, bgY: 160, spin: 0.015,\n      fn: (x, y, z) => { const w = fbm(x*3 + fbm(x*5, y*5, z*5, 3)*1.5, y*2.2, z*3, 4);\n          return mixc([185,120,55], [248,220,150], sst(.3, .75, w)); } },\n    { name: \"EARTH\", atmo: [110,170,255], atmoK: 1.1, tilt: 0.41, cardR: 35, bgR: 94, bgX: 650, bgY: 165, spin: 0.025,\n      fn: (x, y, z) => { const h = fbm(x*2.2+1.3, y*2.2, z*2.2, 5); let c;\n          if (h < 0.5) c = mixc([10,35,105], [35,110,195], sst(.3, .5, h));\n          else { const veg = fbm(x*5, y*5, z*5, 3) + Math.abs(y)*.25;\n                 c = mixc([50,135,60], [165,140,85], sst(.45, .75, veg));\n                 if (h > 0.64) c = mixc(c, [235,235,240], sst(.64, .72, h)); }\n          if (Math.abs(y) > .86) c = mixc(c, [245,248,255], sst(.86, .92, Math.abs(y)));\n          return mixc(c, [255,255,255], sst(.52, .74, fbm(x*3.2+9, y*5, z*3.2, 5)) * .85); } },\n    { name: \"MARS\", atmo: [255,140,90], atmoK: 0.55, tilt: 0.44, cardR: 29, bgR: 78, bgX: 650, bgY: 155, spin: 0.025,\n      fn: (x, y, z) => { const n = fbm(x*3, y*3, z*3, 5); let c = mixc([150,62,38], [222,132,76], n);\n          c = mixc(c, [75,36,28], sst(.55, .72, fbm(x*2+4, y*2.4, z*2, 4)) * .65);\n          return mixc(c, [245,240,235], sst(.88, .94, Math.abs(y))); } },\n    { name: \"JUPITER\", atmo: [255,200,150], atmoK: 0.5, tilt: 0.05, cardR: 46, bgR: 135, bgX: 630, bgY: 190, spin: 0.05,\n      fn: (x, y, z, lon) => { const w = fbm(x*2, y*7, z*2, 4) * .9; const t = .5 + .5*Math.sin(y*17 + w*5);\n          let c = mixc([236,216,186], [188,118,74], t);\n          c = mixc(c, [138,86,62], sst(.72, .95, Math.sin(y*8 + 1)) * .55);\n          const d = Math.hypot(wrapA(lon - 0.9) * 1.1, (y + .3) * 2.3);\n          return mixc(c, [196,72,48], (1 - sst(.16, .32, d)) * .92); } },\n    { name: \"SATURN\", atmo: [255,225,160], atmoK: 0.5, tilt: 0.47, cardR: 33, bgR: 88, bgX: 620, bgY: 175, spin: 0.04, rings: true,\n      fn: (x, y, z) => { const w = fbm(x*2, y*8, z*2, 3) * .6; const t = .5 + .5*Math.sin(y*22 + w*4);\n          return mixc(mixc([208,176,118], [238,218,168], t), [170,160,120], sst(.8, 1, Math.abs(y)) * .5); } },\n    { name: \"URANUS\", atmo: [140,235,240], atmoK: 0.9, tilt: 1.4, cardR: 40, bgR: 100, bgX: 650, bgY: 165, spin: 0.03,\n      fn: (x, y, z) => { const t = .5 + .5*Math.sin(y*9 + fbm(x*2, y*2, z*2, 3)*2);\n          return mixc([112,196,212], [170,232,236], t*.8 + (Math.abs(y) > .8 ? .2 : 0)); } },\n    { name: \"NEPTUNE\", atmo: [90,140,255], atmoK: 1.0, tilt: 0.5, cardR: 39, bgR: 98, bgX: 650, bgY: 165, spin: 0.035,\n      fn: (x, y, z, lon) => { const w = fbm(x*2, y*7, z*2, 4);\n          let c = mixc([22,48,165], [58,104,238], .5 + .5*Math.sin(y*10 + w*3));\n          c = mixc(c, [225,240,255], sst(.64, .8, fbm(x*4+2, y*11, z*4, 4)) * .55);\n          const d = Math.hypot(wrapA(lon - 2.2) * 1.2, (y + .32) * 2.6);\n          return mixc(c, [10,22,90], (1 - sst(.15, .3, d)) * .85); } }\n];\n\nconst TEX_W = 256, TEX_H = 128;\nfor (const p of PLANETS) {\n    p.tex = new Uint8ClampedArray(TEX_W * TEX_H * 3);\n    for (let r = 0; r < TEX_H; r++) {\n        const lat = (0.5 - (r + 0.5) / TEX_H) * Math.PI, cl = Math.cos(lat), y = Math.sin(lat);\n        for (let c = 0; c < TEX_W; c++) {\n            const lon = ((c + 0.5) / TEX_W - 0.5) * Math.PI * 2;\n            const col = p.fn(cl * Math.sin(lon), y, cl * Math.cos(lon), lon);\n            const i = (r * TEX_W + c) * 3;\n            p.tex[i] = col[0]; p.tex[i + 1] = col[1]; p.tex[i + 2] = col[2];\n        }\n    }\n}\n\n// A lit, rotating sphere rendered from the texture (per-pixel, cached geometry)\nclass PlanetSprite {\n    constructor(p, R) {\n        this.p = p; this.R = R;\n        const S = R * 2;\n        this.c = document.createElement(\"canvas\");\n        this.c.width = this.c.height = S;\n        this.g = this.c.getContext(\"2d\");\n        this.img = this.g.createImageData(S, S);\n        const ca = Math.cos(p.tilt), sa = Math.sin(p.tilt);\n        let L = [-0.55, -0.4, 0.73]; const ln = Math.hypot(...L); L = L.map((v) => v / ln);\n        const idx = [], U = [], V = [], SH = [], RIM = [], AL = [];\n        for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {\n            const nx = (x + 0.5 - R) / R, ny = (y + 0.5 - R) / R, r2 = nx * nx + ny * ny;\n            if (r2 > 1) continue;\n            const nz = Math.sqrt(1 - r2), d = nx * L[0] + ny * L[1] + nz * L[2];\n            const xr = nx * ca - ny * sa, yr = nx * sa + ny * ca;\n            U.push(Math.atan2(xr, nz) / (Math.PI * 2) + 0.5);\n            V.push(Math.min(TEX_H - 1, Math.floor((0.5 + Math.asin(Math.max(-1, Math.min(1, yr))) / Math.PI) * TEX_H)));\n            SH.push(0.09 + 0.95 * sst(-0.15, 0.85, d));\n            RIM.push(Math.pow(1 - nz, 2.6) * (0.25 + 0.75 * Math.max(0, d + 0.3)) * p.atmoK);\n            AL.push(Math.max(0, Math.min(1, (1 - Math.sqrt(r2)) * R)) * 255);\n            idx.push((y * S + x) * 4);\n        }\n        this.idx = Int32Array.from(idx); this.U = Float32Array.from(U); this.V = Int32Array.from(V);\n        this.SH = Float32Array.from(SH); this.RIM = Float32Array.from(RIM); this.AL = Float32Array.from(AL);\n    }\n    update(rot) {\n        const d = this.img.data, tex = this.p.tex, W = TEX_W, n = this.idx.length, off = rot * W;\n        const [ar, ag, ab] = this.p.atmo;\n        for (let k = 0; k < n; k++) {\n            let col = ((thi
