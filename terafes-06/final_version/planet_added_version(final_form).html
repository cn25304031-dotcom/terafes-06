------\n\nfunction resetGame() {\n    score = 0;\n    defeatedEnemies = 0;\n    waveTime = 0;\n    waveSchedule = [];\n    waveNumber = 0;\n    startWave();\n    gameTime = 0;\n    boss = null;\n    bossSpawned = false;\n    bossWarned = false;\n    bgPlanet = new PlanetSprite(PLANETS[stageIdx], PLANETS[stageIdx].bgR);\n    shake = 0;\n\n    playerBullets = [];\n    enemyBullets = [];\n    enemies = [];\n    items = [];\n    particles = [];\n    rings = [];\n    hurtFlash = 0;\n\n    player = {\n        x: WIDTH / 2,\n        y: HEIGHT - 75,\n        width: 30,\n        height: 36,\n        speed: 300,\n        hp: 3,\n        power: 1,\n        double: 0,\n        shootTimer: 0,\n        invincible: 0,\n        shield: 0\n    };\n\n    updateUI();\n}\n\nfunction startGame() {\n    resetGame();\n    state = \"playing\";\n    overlay.classList.add(\"hidden\");\n    stageSelect.classList.add(\"hidden\");\n    lastTime = performance.now();\n    showBanner(\"\", PLANETS[stageIdx].name, false);\n}\n\nstartButton.addEventListener(\"click\", () => {\n    if (state === \"paused\") {\n        state = \"playing\";\n        overlay.classList.add(\"hidden\");\n        lastTime = performance.now();\n    } else if (state === \"clear\") {\n        if (stageIdx < PLANETS.length - 1) { stageIdx++; startGame(); }\n        else openStageSelect();\n    } else if (state === \"over\" || state === \"ready\") {\n        startGame();\n    }\n});\nmenuButton.addEventListener(\"click\", openStageSelect);\n\n// ---------- Keyboard ----------\n\nwindow.addEventListener(\"keydown\", (event) => {\n    const key = event.key.toLowerCase();\n\n    if (\n        key === \" \" ||\n        key.startsWith(\"arrow\") ||\n        [\"w\", \"a\", \"s\", \"d\", \"escape\"].includes(key)\n    ) {\n        event.preventDefault();\n    }\n\n    if (key === \"escape\") {\n        if (state === \"playing\") {\n            state = \"paused\";\n            showOverlay(\"PAUSED\", \"Escキーで再開できます。\", \"RESUME\", true);\n        } else if (state === \"paused\") {\n            state = \"playing\";\n            overlay.classList.add(\"hidden\");\n            lastTime = performance.now();\n        }\n        return;\n    }\n\n    keys.add(key);\n});\n\nwindow.addEventListener(\"keyup\", (event) => {\n    keys.delete(event.key.toLowerCase());\n});\n\nwindow.addEventListener(\"blur\", () => {\n    keys.clear();\n\n    if (state === \"playing\") {\n        state = \"paused\";\n        showOverlay(\"PAUSED\", \"Escキーまたはボタンで再開できます。\", \"RESUME\", true);\n    }\n});\n\n// ---------- UI and overlay ----------\n\nfunction updateUI() {\n    scoreElement.textContent = score;\n    hpElement.textContent =\n        \"♥ \".repeat(Math.max(0, player.hp)).trim() || \"0\";\n\n    powerElement.textContent = player.double > 0 ? `x2 ${Math.ceil(player.double)}s` : \"x1\";\n\n    bossHud.classList.toggle(\"show\", !!boss);\n\n    if (boss) {\n        bossHpElement.textContent = `LV ${boss.level}`;\n        bossBarFill.style.width =\n            `${Math.max(0, boss.levelHp / boss.levelMax * 100)}%`;\n        bossPips.forEach((pip, i) => pip.classList.toggle(\"on\", i < boss.level));\n    } else {\n        bossHpElement.textContent = \"---\";\n        bossBarFill.style.width = \"0%\";\n    }\n\n    bestScoreElement.textContent = bestScore;\n}\n\nfunction showOverlay(title, message, buttonText, withMenu = false) {\n    overlayTitle.textContent = title;\n    overlayMessage.textContent = message;\n    startButton.textContent = buttonText;\n    menuButton.hidden = !withMenu;\n    overlay.classList.remove(\"hidden\");\n}\n\nfunction gameOver() {\n    if (state !== \"playing\") return;\n\n    state = \"over\";\n    saveBestScore();\n\n    showOverlay(\n        \"GAME OVER\",\n        `${PLANETS[stageIdx].name}\\nSCORE: ${score}\\nBEST SCORE: ${bestScore}`,\n        \"RETRY\",\n        true\n    );\n}\n\nfunction stageClear() {\n    if (state !== \"playing\") return;\n\n    state = \"clear\";\n    score += 1000;\n    saveBestScore();\n    if (!cleared.includes(stageIdx)) { cleared.push(stageIdx); saveCleared(); }\n    updateUI();\n\n    const p = PLANETS[stageIdx];\n    const last = stageIdx === PLANETS.length - 1;\n    if (last || PLANETS.every((_, i) => cleared.includes(i))) {\n        showOverlay(\n            \"ALL CLEAR\",\n            `All 8 planets defended!\\nSCORE: ${score}  (Bonus +1000)`,\n            \"STAGE SELECT\"\n        );\n    } else {\n        showOverlay(\n            \"STAGE CLEAR\",\n            `${p.name} · BOSS DESTROYED\\nSCORE: ${score}  (Bonus +1000)`,\n            `NEXT STAGE · ${PLANETS[stageIdx + 1].name}`,\n            true\n        );\n    }\n}\n\n// ---------- Utility ----------\n\nfunction random(min, max) {\n    return Math.random() * (max - min) + min;\n}\n\nfunction distanceSquared(a, b) {\n    const dx = a.x - b.x;\n    const dy = a.y - b.y;\n    return dx * dx + dy * dy;\n}\n\nfunction hit(a, b, radiusA, radiusB) {\n    const radius = radiusA + radiusB;\n    return distanceSquared(a, b) < radius * radius;\n}\n\nfunction createParticles(x, y, color, amount = 12) {\n    for (let i = 0; i < amount; i++) {\n        const angle = Math.random() * Math.PI * 2;\n        const speed = random(40, 190);\n\n        particles.push({\n            x,\n            y,\n            vx: Math.cos(angle) * speed,\n            vy: Math.sin(angle) * speed,\n            life: random(0.25, 0.7),\n            maxLife: 0.7,\n            size: random(2, 5),\n            color\n        });\n    }\n}\n\nfunction createRing(x, y, color, max = 70, speed = 260) {\n    rings.push({ x, y, r: 6, max, speed, color });\n}\n\nfunction addScore(points) {\n    score += points;\n    saveBestScore();\n}\n\n// ---------- Enemies ----------\n\n// One wave = 5 normal enemies + 1 mid-level enemy that drops a bonus.\nfunction startWave() {\n    waveNumber++;\n    waveTime = 0;\n    waveSchedule = [];\n\n    for (let i = 0; i < WAVE_NORMALS; i++) {\n        waveSchedule.push({ t: 0.3 + i * 0.85 + random(-0.12, 0.12), strong: false });\n    }\n\n    waveSchedule.push({ t: 2.3, strong: true });\n    waveSchedule.sort((a, b) => a.t - b.t);\n}\n\nfunction spawnEnemy(strong) {\n    enemies.push({\n        x: strong ? random(WIDTH * 0.3, WIDTH * 0.7) : random(35, WIDTH - 35),\n        y: -40,\n        width: strong ? 46 : 28,\n        height: strong ? 40 : 27,\n        hp: strong ? 8 : 1,\n        maxHp: strong ? 8 : 1,\n        speed: (strong ? random(55, 70) : random(95, 135)) * (1 + stageIdx * 0.05),\n        strong,\n        shootTimer: random(0.9, 1.5),\n        phase: random(0, Math.PI * 2)\n    });\n}\n\nfunction dropBonus(x, y) {\n    // The mid-level enemy always drops one benefit.\n    const pool = [\"shield\", \"double\"];\n    if (player.hp < 3) pool.push(\"heal\", \"heal\");\n\n    items.push({\n        x,\n        y,\n        type: pool[Math.floor(Math.random() * pool.length)],\n        radius: 14,\n        speed: 80\n    });\n}\n\nfunction defeatEnemy(enemy, index) {\n    createParticles(\n        enemy.x,\n        enemy.y,\n        enemy.strong ? \"#ff9c55\" : \"#ff587e\",\n        enemy.strong ? 22 : 12\n    );\n\n    createRing(enemy.x, enemy.y, enemy.strong ? \"255,156,85\" : \"255,88,126\", enemy.strong ? 100 : 60);\n    addScore(enemy.strong ? 250 : 50);\n    defeatedEnemies++;\n\n    if (enemy.strong) dropBonus(enemy.x, enemy.y);\n\n    enemies.splice(index, 1);\n\n}\n\n// ---------- Boss: THE DEVOURER ----------\n\nfunction spawnBoss() {\n    bossSpawned = true;\n    enemies = [];\n    enemyBullets = [];\n\n    const lv = 16 + stageIdx * 3;   // HP per level (5 levels)\n    boss = {\n        x: WIDTH / 2, y: -240, width: 381, height: 263,\n        level: BOSS_LEVELS, levelMax: lv, levelHp: lv,\n        hp: lv * BOSS_LEVELS, maxHp: lv * BOSS_LEVELS,\n        direction: 1, attackTimer: 1.4, pattern: 0, flash: 0,\n        enter: 2.4, invuln: 0, roar: 0, tilt: 0,\n        mode: \"patrol\", modeT: 0, lungeCd: 7, lockY: 300,\n        dead: false, deathT: 0, drool: 0\n    };\n\n    shake = 12;\n    hurtFlash = 0.5;\n    roarSfx();\n    showBanner(\"BOSS\", \"THE DEVOURER\", true);\n}\n\nfunction bossShoot() {\n    const b = boss;\n    if (!b) return;\n\n    const phase = BOSS_LEVELS + 1 - b.level;      // 1..5, higher = nastier\n    const k = 1 + stageIdx * 0.035;\n    const ox = b.x, oy = b.y + 45;           // the mouth\n    const down = Math.PI / 2;\n    const ACID = \"#a6ff2e\", BLOOD = \"#ff3b3b\", AMBER = \"#ffb84d\";\n\n    const fire = (ang, spd, r, color, x = ox, y = oy) => enemyBullets.push({\n        x, y, vx: Math.cos(ang) * spd * k, vy: Math.sin(ang) * spd * k, radius: r, color\n    });\n    const aim = () => Math.max(down - 0.5, Math.min(down + 0.5, Math.atan2(player.y - oy, player.x - ox)));\n    const fan = (n, total, spd, color) => {\n        for (let i = 0; i < n; i++) fire(down + (i / (n - 1) - 0.5) * total, spd, 6, color);\n    };\n    const wave = (n, spd, color) => {\n        for (let i = 0; i < n; i++) fire(down + (i - (n - 1) / 2) * 0.02, spd, 5, color, b.x + (i - (n - 1) / 2) * 28, b.y + 62);\n    };\n\n    const p = ++b.pattern;\n\n    if (phase === 1) {\n        fan(5, 0.7, 210, ACID);\n    } else if (phase === 2) {\n        if (p % 2) fan(7, 1.0, 215, ACID);\n        else for (const o of [-0.12, 0, 0.12]) fire(aim() + o, 250, 6, AMBER);\n    } else if (phase === 3) {\n        const m = p % 3;\n        if (m === 0) wave(9, 195, \"#cf83ff\");\n        else if (m === 1) for (const o of [-0.14, 0, 0.14]) fire(aim() + o, 260, 6, AMBER);\n        else fan(7, 1.1, 225, ACID);\n    } else if (phase === 4) {\n        for (let i = 0; i < 10; i++) {\n            fire(0.35 + (i / 9) * (Math.PI - 0.7) + Math.sin(time * 2) * 0.12, 190 + (i % 2) * 45, 5.5, i % 2 ? BLOOD : ACID);\n        }\n        if (p % 2) for (const o of [-0.1, 0.1]) fire(aim() + o, 280, 6, AMBER);\n    } else {\n        const m = p % 3;\n        if (m === 0) for (let i = 0; i < 13; i++) fire(0.25 + (i / 12) * (Math.PI - 0.5), 220, 6, BLOOD);\n        else if (m === 1) for (let i = -2; i <= 2; i++) fire(aim() + i * 0.1, 300, 6, AMBER);\n        else { wave(11, 205, \"#cf83ff\"); fan(5, 0.9, 250, ACID); }\n    }\n}\n\nfunction damageBoss(damage) {\n    const b = boss;\n    if (!b || b.dead || b.enter > 0) return;\n\n    if (b.invuln > 0) { createParticles(b.x, b.y + 30, \"#ffffff\", 2); return; }\n\n    b.levelHp -= damage;\n    b.hp -= damage;\n    b.flash = 0.07;\n\n    if (b.levelHp > 0) return;\n\n    if (b.level > 1) {\n        // one HP level down -> it gets angrier\n        b.level--;\n        b.levelHp = b.levelMax;\n        b.invuln = 1.4;\n        b.roar = 1.2;\n        b.mode = \"patrol\";\n        enemyBullets = [];\n        shake = 14;\n        hurtFlash = 0.6;\n        createParticles(b.x, b.y, \"#ff3b3b\", 40);\n        createParticles(b.x, b.y, \"#a6ff2e\", 20);\n        createRing(b.x, b.y, \"255,60,60\", 200, 420);\n        createRing(b.x, b.y, \"166,255,46\", 140, 320);\n        addScore(300);\n        roarSfx();\n        showBanner(`LEVEL ${b.level} / ${BOSS_LEVELS}`, b.level === 1 ? \"FINAL RAGE\" : \"ENRAGED\", true);\n    } else {\n        // last level gone: death throes, then stage / chapter clear\n        b.hp = 0; b.levelHp = 0;\n        b.dead = true; b.deathT = 2.2;\n        b.mode = \"patrol\";\n        enemyBullets = [];\n        shake = 16;\n        roarSfx();\n    }\n}\n\nfunction updateBoss(dt) {\n    const b = boss;\n    if (!b) return;\n\n    b.flash = Math.max(0, b.flash - dt);\n    b.invuln = Math.max(0, b.invuln - dt);\n    b.roar = Math.max(0, b.roar - dt);\n\n    const phase = BOSS_LEVELS + 1 - b.level;\n\n    if (b.dead) {\n        b.deathT -= dt;\n        b.y += 22 * dt;\n        b.tilt += dt * 0.15;\n        createParticles(b.x + random(-110, 110), b.y + random(-70, 70), Math.random() < 0.5 ? \"#a6ff2e\" : \"#ff4a3a\", 4);\n        if (Math.random() < 0.15) createRing(b.x + random(-90, 90), b.y + random(-60, 60), \"255,90,60\", 70, 220);\n        shake = Math.max(shake, 6);\n        if (b.deathT <= 0) {\n            createParticles(b.x, b.y, \"#ff3b3b\", 60);\n            createParticles(b.x, b.y, \"#a6ff2e\", 40);\n            createRing(b.x, b.y, \"255,80,60\", 240, 420);\n            createRing(b.x, b.y, \"166,255,46\", 170, 320);\n            shake = 16;\n            boss = null;\n            enemyBullets = [];\n            stageClear();\n        }\n        return;\n    }\n\n    if (b.enter > 0) {\n        b.enter -= dt;\n        const t = 1 - Math.max(0, b.enter) / 2.4;\n        b.y = -240 + (140 + 240) * (1 - Math.pow(1 - t, 3));\n        shake = Math.max(shake, 2.5 * (1 - t));\n        return;\n    }\n\n    b.tilt += (b.direction * 0.035 - b.tilt) * Math.min(1, dt * 4);\n\n    if (b.mode === \"patrol\") {\n        b.x += (95 + phase * 20) * b.direction * dt;\n        if (b.x < 190) { b.x = 190; b.direction = 1; }\n        if (b.x > WIDTH - 190) { b.x = WIDTH - 190; b.direction = -1; }\n        b.y = 140 + Math.sin(gameTime * 1.4) * 14;\n\n        b.attackTimer -= dt;\n        if (b.attackTimer <= 0 && b.roar <= 0) {\n            bossShoot();\n            b.attackTimer = [1.15, 0.98, 0.86, 0.72, 0.55][phase - 1];\n        }\n\n        if (phase >= 3) {\n            b.lungeCd -= dt;\n            if (b.lungeCd <= 0 && b.roar <= 0) {\n                b.mode = \"windup\"; b.modeT = 0.8;\n                b.lungeCd = random(5, 7) - phase * 0.3;\n                showBanner(\"DODGE\", \"IT'S LUNGING!\", true);\n            }\n        }\n    } else if (b.mode === \"windup\") {\n        b.modeT -= dt;\n        b.x += (player.x - b.x) * Math.min(1, dt * 3);\n        b.y += (105 - b.y) * Math.min(1, dt * 5);\n        shake = Math.max(shake, 3);\n        if (b.modeT <= 0) {\n            b.mode = \"lunge\"; b.modeT = 0.5;\n            b.lockY = Math.max(280, Math.min(440, player.y - 80));\n        }\n    } else if (b.mode === \"lunge\") {\n        b.modeT -= dt;\n        b.y += (b.lockY - b.y) * Math.min(1, dt * 9);\n        if (b.modeT <= 0) {\n            b.mode = \"return\"; b.modeT = 0.9;\n            shake = 8;\n            createRing(b.x, b.y + 40, \"255,70,60\", 140, 420);\n        }\n    } else {\n        b.modeT -= dt;\n        b.y += (140 - b.y) * Math.min(1, dt * 3.5);\n        if (b.modeT <= 0) b.mode = \"patrol\";\n    }\n\n    // claws / body contact\n    if (hit(player, { x: b.x, y: b.y + 8 }, 13, 92)) damagePlayer();\n\n    // acid drool\n    b.drool -= dt;\n    if (b.drool <= 0) {\n        b.drool = 0.09;\n        particles.push({ x: b.x + random(-6, 6), y: b.y + 50, vx: random(-8, 8), vy: random(40, 90),\n                         life: 0.6, maxLife: 0.6, size: random(2, 3.5), color: \"#a6ff2e\" });\n    }\n}\n\n// ---------- Items ----------\n\nfunction collectItem(item) {\n    if (item.type === \"double\") {\n        player.double = 12;                          // double shot for 12 s\n        createParticles(item.x, item.y, \"#ffd27a\", 14);\n        createRing(player.x, player.y, \"255,210,122\", 60);\n    } else if (item.type === \"heal\") {\n        player.hp = Math.min(3, player.hp + 1);\n        createParticles(item.x, item.y, \"#ff718c\", 14);\n        createRing(player.x, player.y, \"255,113,140\", 60);\n    } else if (item.type === \"shield\") {\n        player.shield = 6;\n        player.invincible = Math.max(player.invincible, 6);\n        createParticles(item.x, item.y, \"#70caff\", 14);\n        createRing(player.x, player.y, \"112,202,255\", 60);\n    }\n}\n\n// ---------- Player ----------\n\nfunction playerShoot() {\n    // Bullets always fly straight up, from the nose of the ship.\n    const offsets = player.double > 0 ? [-9, 9] : [0];\n\n    for (const offset of offsets) {\n        playerBullets.push({\n            x: player.x + offset,\n            y: player.y - 24,\n            vx: 0,\n            vy: -540,\n            radius: 4,\n            damage: 1\n        });\n    }\n}\n\nfunction damagePlayer() {\n    if (player.invincible > 0) return;\n\n    player.hp--;\n    player.invincible = 1.2;\n    shake = 7;\n\n    createParticles(player.x, player.y, \"#ff647d\", 18);\n    createRing(player.x, player.y, \"255,100,125\", 70);\n    hurtFlash = 0.55;\n\n    if (player.hp <= 0) {\n        player.hp = 0;\n        gameOver();\n    }\n\n    updateUI();\n}\n\n// ---------- Update game ----------\n\nfunction update(dt) {\n    gameTime += dt;\n\n    // Starfield\n    for (const star of stars) {\n        star.y += star.speed * dt;\n\n        if (star.y > HEIGHT) {\n            star.y = 0;\n            star.x = Math.random() * WIDTH;\n        }\n    }\n\n    // Particles\n    for (let i = particles.length - 1; i >= 0; i--) {\n        const p = particles[i];\n\n        p.x += p.vx * dt;\n        p.y += p.vy * dt;\n        p.life -= dt;\n        p.vx *= 0.98;\n        p.vy *= 0.98;\n\n        if (p.life <= 0) particles.splice(i, 1);\n    }\n\n    for (let i = rings.length - 1; i >= 0; i--) {\n        const ring = rings[i];\n        ring.r += ring.speed * dt;\n        if (ring.r >= ring.max) rings.splice(i, 1);\n    }\n\n    hurtFlash = Math.max(0, hurtFlash - dt * 1.6);\n\n    if (shake > 0) shake = Math.max(0, shake - 25 * dt);\n\n    // Player movement\n    let dx = 0;\n    let dy = 0;\n\n    if (keys.has(\"a\") || keys.has(\"arrowleft\")) dx--;\n    if (keys.has(\"d\") || keys.has(\"arrowright\")) dx++;\n    if (keys.has(\"w\") || keys.has(\"arrowup\")) dy--;\n    if (keys.has(\"s\") || keys.has(\"arrowdown\")) dy++;\n\n    const length = Math.hypot(dx, dy) || 1;\n\n    player.x += (dx / length) * player.speed * dt;\n    player.y += (dy / length) * player.speed * dt;\n\n    player.x = Math.max(20, Math.min(WIDTH - 20, player.x));\n    player.y = Math.max(25, Math.min(HEIGHT - 25, player.y));\n\n    player.invincible = Math.max(0, player.invincible - dt);\n    player.shield = Math.max(0, player.shield - dt);\n    player.double = Math.max(0, player.double - dt);\n\n    // Continuous shooting\n    player.shootTimer -= dt;\n\n    if (keys.has(\" \") && player.shootTimer <= 0) {\n        playerShoot();\n        player.shootTimer = 0.17;\n    }\n\n    // Waves: 5 normal enemies + 1 mid-level enemy every few seconds\n    if (!bossSpawned) {\n        waveTime += dt;\n\n        while (waveSchedule.length && waveSchedule[0].t <= waveTime) {\n            const next = waveSchedule.shift();\n            if (enemies.length < MAX_ON_SCREEN) spawnEnemy(next.strong);\n        }\n\n        if (waveTime >= WAVE_LENGTH && waveSchedule.length === 0) startWave();\n    }\n\n    // Enemy movement and shooting\n    for (let i = enemies.length - 1; i >= 0; i--) {\n        const enemy = enemies[i];\n\n        enemy.y += enemy.speed * dt;\n        enemy.x += Math.sin(gameTime * 2 + enemy.phase) * 45 * dt;\n        enemy.x = Math.max(20, Math.min(WIDTH - 20, enemy.x));\n\n        if (enemy.strong) {\n            enemy.shootTimer -= dt;\n\n            if (enemy.shootTimer <= 0) {\n                // Mid-level enemy fires straight down (very slight homing), never from the side\n                const aim = Math.max(-30, Math.min(30, (player.x - enemy.x) * 0.15));\n\n                enemyBullets.push({\n                    x: enemy.x,\n                    y: enemy.y + 16,\n                    vx: aim,\n                    vy: 210,\n                    radius: 5,\n                    color: \"#ffae58\"\n                });\n\n                enemy.shootTimer = random(1.6, 2.4);\n            }\n        }\n\n        if (hit(player, enemy, 15, enemy.width * 0.38)) {\n            damagePlayer();\n            defeatEnemy(enemy, i);\n            continue;\n        }\n\n        if (enemy.y > HEIGHT + 40) {\n            enemies.splice(i, 1);\n        }\n    }\n\n    // The DEVOURER arrives 30 seconds after the stage starts\n    if (!bossSpawned && !bossWarned && gameTime >= BOSS_TIME - 3.5) {\n        bossWarned = true;\n        hurtFlash = 0.35;\n        showBanner(\"WARNING\", \"SOMETHING IS COMING\", true);\n    }\n    if (!bossSpawned && gameTime >= BOSS_TIME) spawnBoss();\n\n    updateBoss(dt);\n\n    stageTag.textContent = boss\n        ? `${PLANETS[stageIdx].name} · BOSS FIGHT`\n        : `${PLANETS[stageIdx].name} · BOSS IN ${Math.max(0, Math.ceil(BOSS_TIME - gameTime))}s`;\n\n    // Player bullets\n    for (let i = playerBullets.length - 1; i >= 0; i--) {\n        const bullet = playerBullets[i];\n\n        bullet.x += bullet.vx * dt;\n        bullet.y += bullet.vy * dt;\n\n        let removed = false;\n\n        if (boss && !boss.dead && boss.enter <= 0 && hit(bullet, { x: boss.x, y: boss.y + 8 }, bullet.radius, 100)) {\n            damageBoss(bullet.damage);\n            playerBullets.splice(i, 1);\n            removed = true;\n        }\n\n        if (removed) continue;\n\n        for (let j = enemies.length - 1; j >= 0; j--) {\n            const enemy = enemies[j];\n\n            if (hit(bullet, enemy, bullet.radius, enemy.width * 0.38)) {\n                enemy.hp -= bullet.damage;\n                createParticles(bullet.x, bullet.y, \"#78f3ff\", 3);\n                playerBullets.splice(i, 1);\n                removed = true;\n\n                if (enemy.hp <= 0) {\n                    defeatEnemy(enemy, j);\n                }\n\n                break;\n            }\n        }\n\n        if (!removed && bullet.y < -20) {\n            playerBullets.splice(i, 1);\n        }\n    }\n\n    // Enemy bullets\n    for (let i = enemyBullets.length - 1; i >= 0; i--) {\n        const bullet = enemyBullets[i];\n\n        bullet.x += bullet.vx * dt;\n        bullet.y += bullet.vy * dt;\n\n        if (hit(player, bullet, 12, bullet.radius)) {\n            damagePlayer();\n            enemyBullets.splice(i, 1);\n            continue;\n        }\n\n        if (\n            bullet.y > HEIGHT + 30 ||\n            bullet.y < -30 ||\n            bullet.x < -30 ||\n            bullet.x > WIDTH + 30\n        ) {\n            enemyBullets.splice(i, 1);\n        }\n    }\n\n    // Pickups\n    for (let i = items.length - 1; i >= 0; i--) {\n        const item = items[i];\n\n        item.y += item.speed * dt;\n\n        if (hit(player, item, 15, item.radius)) {\n            collectItem(item);\n            items.splice(i, 1);\n            continue;\n        }\n\n        if (item.y > HEIGHT + 20) {\n            items.splice(i, 1);\n        }\n    }\n\n    updateUI();\n}\n\n// ---------- Drawing (premium dark look) ----------\n\n// Pre-rendered deep-space nebula, tiled vertically for a seamless scroll.\nconst nebula = (() => {\n    const c = document.createElement(\"canvas\");\n    c.width = WIDTH;\n    c.height = HEIGHT * 2;\n    const g = c.getContext(\"2d\");\n\n    g.fillStyle = \"#02030a\";\n    g.fillRect(0, 0, c.width, c.height);\n\n    const blobs = [\n        [150, 200, 280, \"92,44,210\", 0.34],\n        [650, 520, 320, \"24,120,230\", 0.26],\n        [420, 900, 340, \"180,34,160\", 0.24],\n        [90, 1060, 260, \"30,150,210\", 0.22],\n        [700, 1150, 300, \"104,54,230\", 0.26],\n        [330, 560, 220, \"60,24,150\", 0.22]\n    ];\n\n    for (const [x, y, r, color, alpha] of blobs) {\n        for (const offset of [-c.height, 0, c.height]) {\n            const gradient = g.createRadialGradient(x, y + offset, 0, x, y + offset, r);\n            gradient.addColorStop(0, `rgba(${color},${alpha})`);\n            gradient.addColorStop(1, `rgba(${color},0)`);\n            g.fillStyle = gradient;\n            g.fillRect(0, 0, c.width, c.height);\n        }\n    }\n\n    return c;\n})();\n\nfunction drawBackground() {\n    ctx.fillStyle = \"#02030a\";\n    ctx.fillRect(0, 0, WIDTH, HEIGHT);\n\n    const offset = bgScroll % (HEIGHT * 2);\n    ctx.drawImage(nebula, 0, offset - HEIGHT * 2);\n    ctx.drawImage(nebula, 0, offset);\n\n    // Stage planet (3D, rotating)\n    drawStagePlanet();\n\n    // Stars (three depth layers, twinkling)\n    for (const star of stars) {\n        const twinkle = 0.55 + 0.45 * Math.sin(time * 2.2 + star.tw);\n        ctx.globalAlpha = (0.3 + star.z * 0.7) * twinkle;\n        ctx.fillStyle = star.color;\n        ctx.fillRect(star.x, star.y, star.size, star.size * (1 + star.z * 2.6));\n    }\n\n    ctx.globalAlpha = 1;\n}\n\nfunction glowCircle(x, y, radius, color, alpha) {\n    const g = ctx.createRadialGradient(x, y, 0, x, y, radius);\n    g.addColorStop(0, `rgba(${color},${alpha})`);\n    g.addColorStop(1, `rgba(${color},0)`);\n    ctx.fillStyle = g;\n    ctx.beginPath();\n    ctx.arc(x, y, radius, 0, Math.PI * 2);\n    ctx.fill();\n}\n\nfunction drawPlayer() {\n    if (\n        player.invincible > 0 &&\n        player.shield <= 0 &&\n        Math.floor(gameTime * 15) % 2 === 0\n    ) {\n        return;\n    }\n\n    ctx.save();\n    ctx.translate(player.x, player.y);\n\n    // Engine glow + flame (additive)\n    const flame = 24 + Math.random() * 9;\n    ctx.globalCompositeOperation = \"lighter\";\n    glowCircle(0, 16, 34, \"80,170,255\", 0.38);\n\n    for (const fx of [-9, 9]) {\n        const fg = ctx.createLinearGradient(0, 12, 0, 12 + flame * 0.75);\n        fg.addColorStop(0, \"rgba(160,240,255,0.95)\");\n        fg.addColorStop(0.5, \"rgba(70,140,255,0.55)\");\n        fg.addColorStop(1, \"rgba(70,70,255,0)\");\n        ctx.fillStyle = fg;\n        ctx.beginPath();\n        ctx.moveTo(fx - 4, 12);\n        ctx.lineTo(fx, 12 + flame * 0.75);\n        ctx.lineTo(fx + 4, 12);\n        ctx.closePath();\n        ctx.fill();\n    }\n\n    const cg = ctx.createLinearGradient(0, 10, 0, 10 + flame);\n    cg.addColorStop(0, \"rgba(255,255,255,0.95)\");\n    cg.addColorStop(0.35, \"rgba(110,225,255,0.75)\");\n    cg.addColorStop(1, \"rgba(60,90,255,0)\");\n    ctx.fillStyle = cg;\n    ctx.beginPath();\n    ctx.moveTo(-5, 10);\n    ctx.lineTo(0, 10 + flame);\n    ctx.lineTo(5, 10);\n    ctx.closePath();\n    ctx.fill();\n    ctx.globalCompositeOperation = \"source-over\";\n\n    // Wings\n    const wing = ctx.createLinearGradient(-30, 0, 30, 0);\n    wing.addColorStop(0, \"#12204a\");\n    wing.addColorStop(0.5, \"#5c8dff\");\n    wing.addColorStop(1, \"#12204a\");\n    ctx.fillStyle = wing;\n    ctx.strokeStyle = \"rgba(127,233,255,0.85)\";\n    ctx.lineWidth = 1;\n    ctx.beginPath();\n    ctx.moveTo(0, -20);\n    ctx.lineTo(8, -4);\n    ctx.lineTo(26, 12);\n    ctx.lineTo(31, 23);\n    ctx.lineTo(11, 15);\n    ctx.lineTo(0, 19);\n    ctx.lineTo(-11, 15);\n    ctx.lineTo(-31, 23);\n    ctx.lineTo(-26, 12);\n    ctx.lineTo(-8, -4);\n    ctx.closePath();\n    ctx.fill();\n    ctx.stroke();\n\n    // Fuselage\n    const body = ctx.createLinearGradient(0, -28, 0, 20);\n    body.addColorStop(0, \"#f2fbff\");\n    body.addColorStop(0.55, \"#8cc4ff\");\n    body.addColorStop(1, \"#3a63c8\");\n    ctx.fillStyle = body;\n    ctx.beginPath();\n    ctx.moveTo(0, -28);\n    ctx.lineTo(6, -6);\n    ctx.lineTo(5, 16);\n    ctx.lineTo(0, 21);\n    ctx.lineTo(-5, 16);\n    ctx.lineTo(-6, -6);\n    ctx.closePath();\n    ctx.fill();\n\n    // Cockpit\n    ctx.shadowBlur = 10;\n    ctx.shadowColor = \"#5fe8ff\";\n    const cockpit = ctx.createLinearGradient(0, -14, 0, 0);\n    cockpit.addColorStop(0, \"#c8fbff\");\n    cockpit.addColorStop(1, \"#1a8dff\");\n    ctx.fillStyle = cockpit;\n    ctx.beginPath();\n    ctx.ellipse(0, -7, 2.8, 7, 0, 0, Math.PI * 2);\n    ctx.fill();\n    ctx.shadowBlur = 0;\n\n    // Wing-tip lights\n    const blink = 0.5 + 0.5 * Math.sin(time * 6);\n    ctx.fillStyle = `rgba(255,90,140,${0.5 + blink * 0.5})`;\n    ctx.beginPath();\n    ctx.arc(-28, 21, 1.8, 0, Math.PI * 2);\n    ctx.fill();\n    ctx.fillStyle = `rgba(110,255,200,${0.5 + (1 - blink) * 0.5})`;\n    ctx.beginPath();\n    ctx.arc(28, 21, 1.8, 0, Math.PI * 2);\n    ctx.fill();\n\n    // Shield\n    if (player.shield > 0 && (player.shield > 1.2 || Math.floor(gameTime * 10) % 2 === 0)) {\n        ctx.globalCompositeOperation = \"lighter\";\n        glowCircle(0, 0, 34, \"90,200,255\", 0.22);\n        ctx.strokeStyle = \"rgba(130,225,255,0.9)\";\n        ctx.lineWidth = 2;\n        ctx.setLineDash([12, 7]);\n        ctx.lineDashOffset = -time * 40;\n        ctx.beginPath();\n        ctx.arc(0, 0, 30, 0, Math.PI * 2);\n        ctx.stroke();\n        ctx.setLineDash([]);\n        ctx.globalCompositeOperation = \"source-over\";\n    }\n\n    ctx.restore();\n}\n\nfunction drawEnemy(enemy) {\n    const rgb = enemy.strong ? \"255,156,85\" : \"255,88,126\";\n    const hex = enemy.strong ? \"#ff9c55\" : \"#ff587e\";\n    const pulse = 0.5 + 0.5 * Math.sin(time * 6 + enemy.phase);\n\n    ctx.save();\n    ctx.translate(enemy.x, enemy.y);\n\n    ctx.globalCompositeOperation = \"lighter\";\n    glowCircle(0, 2, enemy.width * 0.95, rgb, 0.2 + pulse * 0.08);\n    ctx.globalCompositeOperation = \"source-over\";\n\n    const body = ctx.createLinearGradient(0, -16, 0, 20);\n    body.addColorStop(0, enemy.strong ? \"#6a3418\" : \"#6e1630\");\n    body.addColorStop(1, \"#150814\");\n    ctx.fillStyle = body;\n    ctx.strokeStyle = hex;\n    ctx.lineWidth = 1.6;\n    ctx.shadowBlur = 12;\n    ctx.shadowColor = hex;\n\n    ctx.beginPath();\n    ctx.moveTo(0, 18);\n    ctx.lineTo(-enemy.width / 2, -8);\n    ctx.lineTo(-7, -3);\n    ctx.lineTo(0, -15);\n    ctx.lineTo(7, -3);\n    ctx.lineTo(enemy.width / 2, -8);\n    ctx.closePath();\n    ctx.fill();\n    ctx.stroke();\n    ctx.shadowBlur = 0;\n\n    if (enemy.strong) {\n        ctx.strokeStyle = \"rgba(255,200,150,0.55)\";\n        ctx.lineWidth = 1;\n        ctx.beginPath();\n        ctx.moveTo(-enemy.width / 2 + 5, -4);\n        ctx.lineTo(0, 12);\n        ctx.lineTo(enemy.width / 2 - 5, -4);\n        ctx.stroke();\n    }\n\n    // Glowing core\n    ctx.globalCompositeOperation = \"lighter\";\n    glowCircle(0, 1, 9, rgb, 0.7 + pulse * 0.3);\n    ctx.globalCompositeOperation = \"source-over\";\n    ctx.fillStyle = \"#fff\";\n    ctx.beginPath();\n    ctx.arc(0, 1, 2.2, 0, Math.PI * 2);\n    ctx.fill();\n\n    if (enemy.strong) {\n        // gold ring = \"defeat me for a bonus\"\n        ctx.strokeStyle = `rgba(255,210,122,${0.45 + pulse * 0.4})`;\n        ctx.lineWidth = 1.5;\n        ctx.setLineDash([7, 5]);\n        ctx.lineDashOffset = -time * 20;\n        ctx.beginPath();\n        ctx.arc(0, 1, enemy.width * 0.62, 0, Math.PI * 2);\n        ctx.stroke();\n        ctx.setLineDash([]);\n    }\n\n    if (enemy.strong) {\n        ctx.fillStyle = \"rgba(20,8,24,0.85)\";\n        ctx.fillRect(-20, -32, 40, 4);\n        ctx.fillStyle = hex;\n        ctx.shadowBlur = 6;\n        ctx.shadowColor = hex;\n        ctx.fillRect(-20, -32, 40 * enemy.hp / enemy.maxHp, 4);\n        ctx.shadowBlur = 0;\n    }\n\n    ctx.restore();\n}\n\nfunction drawBoss() {\n    const b = boss;\n    if (!b) return;\n\n    const phase = BOSS_LEVELS + 1 - b.level;\n    const pulse = 0.5 + 0.5 * Math.sin(time * (3 + phase * 1.6));\n    const rage = phase >= 4 || b.mode === \"windup\";\n    const edge = rage ? \"#ff3b4e\" : \"#ff5cc8\";\n    const K = 2.3;\n\n    ctx.save();\n    ctx.translate(b.x, b.y);\n\n    ctx.globalCompositeOperation = \"lighter\";\n    glowCircle(0, 0, 230, rage ? \"255,30,50\" : \"255,62,174\", 0.16 + pulse * 0.1 + phase * 0.015);\n    ctx.globalCompositeOperation = \"source-over\";\n\n    const breathe = 1 + Math.sin(time * (2 + phase * 0.7)) * 0.015\n        + (b.mode === \"windup\" ? 0.04 : 0) + (b.mode === \"lunge\" ? 0.08 : 0)\n        + (b.roar > 0 ? 0.05 * Math.sin(time * 40) : 0);\n    const jit = (phase >= 4 || b.mode === \"windup\" || b.roar > 0) ? 2.2 : (b.enter > 0 ? 1.2 : 0);\n    ctx.translate(random(-jit, jit), random(-jit, jit));\n    ctx.rotate(b.tilt * 0.6);\n    ctx.scale(breathe, breathe);\n    if (b.dead) ctx.globalAlpha = Math.max(0.15, b.deathT / 2.2);\n\n    // engine flames (rear = top)\n    ctx.globalCompositeOperation = \"lighter\";\n    for (const tx of [-66, -24, 24, 66]) {\n        const len = 30 + Math.random() * 18;\n        const tg = ctx.createLinearGradient(0, -66, 0, -66 - len);\n        tg.addColorStop(0, rage ? \"rgba(255,90,70,0.95)\" : \"rgba(255,120,220,0.9)\");\n        tg.addColorStop(1, \"rgba(180,60,255,0)\");\n        ctx.fillStyle = tg;\n        ctx.beginPath(); ctx.moveTo(tx - 9, -66); ctx.lineTo(tx, -66 - len); ctx.lineTo(tx + 9, -66); ctx.closePath(); ctx.fill();\n    }\n    ctx.globalCompositeOperation = \"source-over\";\n\n    // hull\n    const hull = ctx.createLinearGradient(0, -40 * K, 0, 34 * K);\n    hull.addColorStop(0, b.flash > 0 ? \"#ffffff\" : (rage ? \"#5a1220\" : \"#4a1a66\"));\n    hull.addColorStop(1, b.flash > 0 ? \"#ffd6f2\" : \"#12050f\");\n    ctx.fillStyle = hull; ctx.strokeStyle = edge; ctx.lineWidth = 3;\n    ctx.shadowBlur = 24 + pulse * 10; ctx.shadowColor = edge;\n    const pts = [[0,-40],[35,-27],[56,-4],[48,23],[20,34],[0,25],[-20,34],[-48,23],[-56,-4],[-35,-27]];\n    ctx.beginPath();\n    pts.forEach(([x, y], i) => i ? ctx.lineTo(x * K, y * K) : ctx.moveTo(x * K, y * K));\n    ctx.closePath(); ctx.fill(); ctx.stroke();\n    ctx.shadowBlur = 0;\n\n    // armour plating\n    ctx.strokeStyle = \"rgba(255,150,200,0.35)\"; ctx.lineWidth = 1.5;\n    ctx.beginPath();\n    ctx.moveTo(-30*K, -20*K); ctx.lineTo(-44*K, -2*K); ctx.lineTo(-38*K, 16*K);\n    ctx.moveTo(30*K, -20*K); ctx.lineTo(44*K, -2*K); ctx.lineTo(38*K, 16*K);\n    ctx.moveTo(-16*K, 24*K); ctx.lineTo(0, 14*K); ctx.lineTo(16*K, 24*K);\n    ctx.stroke();\n\n    // wing cannons\n    for (const cx of [-34 * K, 34 * K]) {\n        ctx.fillStyle = \"#2a0d3d\"; ctx.fillRect(cx - 16, -10, 32, 34);\n        ctx.globalCompositeOperation = \"lighter\";\n        glowCircle(cx, 24, 24, rage ? \"255,70,60\" : \"255,110,210\", 0.5 + pulse * 0.4);\n        ctx.globalCompositeOperation = \"source-over\";\n        ctx.fillStyle = rage ? \"#ff9a8a\" : \"#ff8ad8\"; ctx.fillRect(cx - 6, 18, 12, 8);\n    }\n\n    // the alien head mounted on the ship\n    if (bossSprites.ready) {\n        const S = 0.45, w = bossSprites.w * S, h = bossSprites.h * S;\n        const sh = ctx.createRadialGradient(0, 0, 10, 0, 0, 120);\n        sh.addColorStop(0, \"rgba(0,0,0,0.65)\"); sh.addColorStop(1, \"rgba(0,0,0,0)\");\n        ctx.fillStyle = sh; ctx.beginPath(); ctx.arc(0, 0, 120, 0, Math.PI * 2); ctx.fill();\n\n        ctx.save();\n        ctx.translate(0, 15);\n        ctx.rotate(Math.sin(time * 1.3) * 0.03);\n        ctx.shadowColor = \"rgba(255,40,60,0.9)\"; ctx.shadowBlur = 16 + pulse * 10;\n        const src = b.flash > 0 ? bossSprites.flash : rage ? bossSprites.rage : bossSprites.base;\n        ctx.drawImage(src, -w / 2, -h / 2, w, h);\n        ctx.shadowBlur = 0;\n        ctx.restore();\n\n        // glowing, dripping maw\n        ctx.globalCompositeOperation = \"lighter\";\n        glowCircle(0, 45, 28 + pulse * 9, \"255,40,30\", 0.42 + pulse * 0.35);\n        glowCircle(0, 45, 11, \"190,255,70\", 0.45 + pulse * 0.4);\n        if (phase >= 3) glowCircle(0, -10, 50, \"255,30,40\", 0.1 + pulse * 0.12);\n        ctx.globalCompositeOperation = \"source-over\";\n    }\n\n    ctx.restore();\n}\n\nfunction drawBullet(bullet, friendly) {\n    ctx.save();\n    ctx.globalCompositeOperation = \"lighter\";\n\n    if (friendly) {\n        const length = 30;\n        const trail = ctx.createLinearGradient(bullet.x, bullet.y, bullet.x - bullet.vx * 0.06, bullet.y + length);\n        trail.addColorStop(0, \"rgba(140,250,255,0.95)\");\n        trail.addColorStop(1, \"rgba(60,120,255,0)\");\n\n        ctx.strokeStyle = trail;\n        ctx.lineWidth = bullet.radius * 1.7;\n        ctx.lineCap = \"round\";\n        ctx.beginPath();\n        ctx.moveTo(bullet.x, bullet.y);\n        ctx.lineTo(bullet.x - bullet.vx * 0.06, bullet.y + length);\n        ctx.stroke();\n\n        glowCircle(bullet.x, bullet.y, bullet.radius * 3.6, \"110,240,255\", 0.5);\n        ctx.fillStyle = \"#fff\";\n        ctx.beginPath();\n        ctx.arc(bullet.x, bullet.y, bullet.radius * 0.7, 0, Math.PI * 2);\n        ctx.fill();\n    } else {\n        const rgb = hexToRgb(bullet.color);\n        glowCircle(bullet.x, bullet.y, bullet.radius * 3.2, rgb, 0.6);\n        ctx.strokeStyle = `rgba(${rgb},0.9)`;\n        ctx.lineWidth = 1.5;\n        ctx.beginPath();\n        ctx.arc(bullet.x, bullet.y, bullet.radius * 0.95, 0, Math.PI * 2);\n        ctx.stroke();\n        ctx.fillStyle = \"#fff\";\n        ctx.beginPath();\n        ctx.arc(bullet.x, bullet.y, bullet.radius * 0.45, 0, Math.PI * 2);\n        ctx.fill();\n    }\n\n    ctx.restore();\n}\n\nfunction hexToRgb(hex) {\n    const n = parseInt(hex.slice(1), 16);\n    return `${(n >> 16) & 255},${(n >> 8) & 255},${n & 255}`;\n}\n\nfunction drawItem(item) {\n    const styles = {\n        double: { rgb: \"255,210,122\", label: \"x2\" },\n        heal: { rgb: \"255,120,155\", label: \"+\" },\n        shield: { rgb: \"112,186,255\", label: \"S\" }\n    };\n\n    const style = styles[item.type];\n\n    ctx.save();\n    ctx.translate(item.x, item.y);\n\n    ctx.globalCompositeOperation = \"lighter\";\n    glowCircle(0, 0, item.radius * 2.6, style.rgb, 0.4);\n    ctx.globalCompositeOperation = \"source-over\";\n\n    ctx.fillStyle = \"rgba(6,12,30,0.92)\";\n    ctx.beginPath();\n    ctx.arc(0, 0, item.radius, 0, Math.PI * 2);\n    ctx.fill();\n\n    ctx.strokeStyle = `rgba(${style.rgb},0.95)`;\n    ctx.lineWidth = 2;\n    ctx.setLineDash([9, 5]);\n    ctx.lineDashOffset = -time * 30;\n    ctx.beginPath();\n    ctx.arc(0, 0, item.radius, 0, Math.PI * 2);\n    ctx.stroke();\n    ctx.setLineDash([]);\n\n    ctx.fillStyle = `rgb(${style.rgb})`;\n    ctx.font = \"bold 14px Orbitron, Arial\";\n    ctx.textAlign = \"center\";\n    ctx.textBaseline = \"middle\";\n    ctx.fillText(style.label, 0, 1);\n\n    ctx.restore();\n}\n\nfunction drawParticles() {\n    ctx.save();\n    ctx.globalCompositeOperation = \"lighter\";\n\n    for (const p of particles) {\n        const life = Math.max(0, p.life / p.maxLife);\n        ctx.globalAlpha = life;\n        ctx.fillStyle = p.color;\n        const size = p.size * (0.5 + life * 0.8);\n        ctx.fillRect(p.x - size / 2, p.y - size / 2, size, size);\n    }\n\n    ctx.restore();\n}\n\nfunction drawRings() {\n    ctx.save();\n    ctx.globalCompositeOperation = \"lighter\";\n\n    for (const ring of rings) {\n        const life = 1 - ring.r / ring.max;\n        ctx.strokeStyle = `rgba(${ring.color},${life * 0.9})`;\n        ctx.lineWidth = 1 + life * 4;\n        ctx.beginPath();\n        ctx.arc(ring.x, ring.y, ring.r, 0, Math.PI * 2);\n        ctx.stroke();\n    }\n\n    ctx.restore();\n}\n\nfunction draw() {\n    ctx.save();\n\n    if (shake > 0) {\n        ctx.translate(\n            random(-shake, shake),\n            random(-shake, shake)\n        );\n    }\n\n    drawBackground();\n\n    for (const item of items) drawItem(item);\n    for (const enemy of enemies) drawEnemy(enemy);\n    for (const bullet of playerBullets) drawBullet(bullet, true);\n    for (const bullet of enemyBullets) drawBullet(bullet, false);\n\n    drawBoss();\n\n    if (player) drawPlayer();\n\n    drawParticles();\n    drawRings();\n\n    ctx.restore();\n\n    // Damage flash (red screen edge)\n    if (hurtFlash > 0) {\n        const g = ctx.createRadialGradient(\n            WIDTH / 2, HEIGHT / 2, HEIGHT * 0.3,\n            WIDTH / 2, HEIGHT / 2, HEIGHT * 0.85\n        );\n        g.addColorStop(0, \"rgba(255,40,80,0)\");\n        g.addColorStop(1, `rgba(255,40,80,${hurtFlash})`);\n        ctx.fillStyle = g;\n        ctx.fillRect(0, 0, WIDTH, HEIGHT);\n    }\n}\n\n// ---------- Main loop ----------\n\nfunction loop(timestamp) {\n    const dt = Math.min((timestamp - lastTime) / 1000 || 0, 0.033);\n    lastTime = timestamp;\n    time += dt;\n    bgScroll += dt * (state === \"playing\" ? 34 : 12);\n\n    if (state === \"playing\") {\n        update(dt);\n    } else {\n        // Stars continue moving while paused or at the title screen.\n        for (const star of stars) {\n            star.y += star.speed * dt * 0.35;\n\n            if (star.y > HEIGHT) {\n                star.y = 0;\n                star.x = Math.random() * WIDTH;\n            }\n        }\n    }\n\n    draw();\n    if (!stageSelect.classList.contains(\"hidden\")) drawStageSelect();\n    animationId = requestAnimationFrame(loop);\n}\n\n// ---------- Initial screen ----------\n\nplayer = {\n    x: WIDTH / 2,\n    y: HEIGHT - 75,\n    width: 30,\n    height: 36,\n    speed: 300,\n    hp: 3,\n    power: 1,\n    double: 0,\n    shootTimer: 0,\n    invincible: 0,\n    shield: 0\n};\n\nbestScoreElement.textContent = bestScore;\nupdateUI();\n\noverlay.classList.add(\"hidden\");\nopenStageSelect();\n\nlastTime = performance.now();\nanimationId = requestAnimationFrame(loop);\n\n<\/script>\n<\/body>\n<\/html>\n"
};

const $ = (id) => document.getElementById(id);

/* ---------- screen transitions (fade-out, then staggered fade-in) ---------- */
let switching = false;
function show(nextId) {
  const current = document.querySelector('.screen.is-active');
  if (switching || !current || current.id === nextId) return;
  switching = true;
  current.classList.add('is-leaving');
  setTimeout(() => {
    current.classList.remove('is-active', 'is-leaving');
    const next = $(nextId);
    next.classList.add('is-active');   // CSS animations restart on display change
    window.scrollTo(0, 0);
    switching = false;
  }, 380);
}

/* ---------- game cards ---------- */
function renderGames() {
  $('game-list').innerHTML = GAMES.map((g, i) => `
    <button class="game" data-id="${g.id}" style="--i:${i}">
      <span class="ico">${g.icon}</span>
      <span>
        <span class="tag"><b>0${i + 1}</b><i></i>${g.tag}</span>
        <strong>${g.name}</strong>
        <small data-i18n="${g.descKey}">${t(g.descKey)}</small>
      </span>
      <span class="go">${ICONS.arrow}</span>
    </button>`).join('');
}


/* ---------- 12-second story intro, then the game ---------- */
const Intro = (() => {
  const root = $('intro'), cv = $('ic'), cap = $('cap'), cx = cv.getContext('2d');
  const scenes = [...root.querySelectorAll('.sc')];
  const TIMES = [0, 4000, 8000], TOTAL = 12000;
  let timers = [], raf = 0, speed = 0.4, stars = [], done = null, running = false;
  function size() { cv.width = innerWidth; cv.height = innerHeight; stars = Array.from({ length: 140 }, () => ({ x: Math.random() * cv.width, y: Math.random() * cv.height, z: Math.random() * .9 + .1 })); }
  function frame() {
    cx.clearRect(0, 0, cv.width, cv.height);
    for (const s of stars) {
      s.y += s.z * speed * 6; if (s.y > cv.height) { s.y = -20; s.x = Math.random() * cv.width; }
      const len = 1 + speed * s.z * 10;
      cx.fillStyle = 'rgba(214,237,255,' + (.35 + s.z * .6) + ')';
      cx.fillRect(s.x, s.y, 1.4 * s.z + .6, len);
    }
    raf = requestAnimationFrame(frame);
  }
  function scene(i) {
    scenes.forEach((el, k) => el.classList.toggle('on', k === i));
    cap.className = 'cap'; void cap.offsetWidth; cap.className = 'cap in';
    cap.textContent = t('st' + (i + 1));
    try { i === 2 ? Chip.sfx.launch() : Chip.sfx.select(); } catch (e) {}
  }
  function end(skipped) {
    if (!running) return; running = false;
    timers.forEach(clearTimeout); timers = []; cancelAnimationFrame(raf);
    const f = root.querySelector('.iflash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
    setTimeout(() => { root.hidden = true; root.classList.remove('run'); scenes.forEach((el) => el.classList.remove('on')); }, 120);
    const cb = done; done = null; if (cb) cb();
  }
  function play(cb) {
    done = cb; running = true; size(); speed = .4;
    root.hidden = false; root.classList.remove('run'); void root.offsetWidth; root.classList.add('run');
    scene(0);
    timers.push(setTimeout(() => { scene(1); speed = .9; }, TIMES[1]));
    timers.push(setTimeout(() => { scene(2); speed = 6; }, TIMES[2]));
    timers.push(setTimeout(() => end(false), TOTAL));
    raf = requestAnimationFrame(frame);
  }
  $('skip').addEventListener('click', () => end(true));
  addEventListener('resize', () => { if (running) size(); });
  return { play, isRunning: () => running, applyText: () => { if (running) { const k = scenes.findIndex((e) => e.classList.contains('on')); if (k >= 0) cap.textContent = t('st' + (k + 1)); } } };
})();

let musicWas = null;
function startGame(id) {
  const game = GAMES.find((g) => g.id === id);
  if (game && GAME_SRC[id]) {                    // story intro (12 s) -> game built into this page
    if (Intro.isRunning()) return;
    const launch = () => {
      $('gf').srcdoc = GAME_SRC[id];
      $('game-frame').hidden = false;
      musicWas = Chip.isMuted(); Chip.setMuted(true);   // menu music off while playing
      setTimeout(() => { try { $('gf').focus(); } catch (e) {} }, 150);
    };
    if (game.intro === false) launch(); else Intro.play(launch);
  } else if (game && game.href) {
    location.href = game.href;
  } else {
    alert(t('soon').replace('{name}', game.name));
  }
}
function exitGame() {
  $('game-frame').hidden = true;
  $('gf').srcdoc = '';
  if (musicWas === false) Chip.setMuted(false);
  musicWas = null;
}
$('game-exit').addEventListener('click', exitGame);

/* ---------- how-to sheet ---------- */
function openHowto() { const m = $('howto'); m.classList.remove('is-closing'); m.hidden = false; }
function closeHowto() {
  const m = $('howto');
  if (m.hidden) return;
  m.classList.add('is-closing');
  setTimeout(() => { m.hidden = true; m.classList.remove('is-closing'); }, 300);
}

/* ---------- starfield (canvas, sparse, twinkling, mouse parallax) ---------- */
(function stars() {
  const cv = $('stars'), ctx = cv.getContext('2d');
  let w, h, dpr, list = [], mx = 0, my = 0, tx = 0, ty = 0;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = cv.width = innerWidth * dpr; h = cv.height = innerHeight * dpr;
    const n = Math.round((innerWidth * innerHeight) / 11000);
    list = Array.from({ length: n }, () => ({
      x: Math.random() * w, y: Math.random() * h,
      r: (Math.random() * 1.1 + .35) * dpr,
      z: Math.random() * .9 + .1,               // depth: parallax + drift speed
      p: Math.random() * Math.PI * 2,           // twinkle phase
      s: Math.random() * .8 + .4,               // twinkle speed
    }));
  }
  addEventListener('resize', resize);
  addEventListener('pointermove', (e) => { tx = (e.clientX / innerWidth - .5); ty = (e.clientY / innerHeight - .5); });
  function frame(t) {
    mx += (tx - mx) * .05; my += (ty - my) * .05;
    ctx.clearRect(0, 0, w, h);
    for (const s of list) {
      s.y -= s.z * .12 * dpr;                  // slow upward drift
      if (s.y < -2) { s.y = h + 2; s.x = Math.random() * w; }
      const px = s.x + mx * s.z * 40 * dpr, py = s.y + my * s.z * 40 * dpr;
      const a = .25 + .55 * (.5 + .5 * Math.sin(t / 1000 * s.s + s.p));
      ctx.globalAlpha = a * (.4 + s.z * .6);
      ctx.fillStyle = '#dbe8ff';
      ctx.beginPath(); ctx.arc(px, py, s.r, 0, 6.2832); ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  resize(); requestAnimationFrame(frame);
})();

/* ---------- magnetic primary button ---------- */
document.querySelectorAll('.btn-primary, .btn-start').forEach((b) => {
  b.addEventListener('pointermove', (e) => {
    const r = b.getBoundingClientRect();
    const x = (e.clientX - r.left - r.width / 2) / r.width, y = (e.clientY - r.top - r.height / 2) / r.height;
    b.style.transform = `translate(${x * 10}px, ${y * 8}px)`;
  });
  b.addEventListener('pointerleave', () => { b.style.transform = ''; });
});

/* ---------- wire up ---------- */
renderGames();
$('btn-start').addEventListener('click', () => show('screen-mode'));
$('btn-back').addEventListener('click', () => show('screen-title'));
$('btn-howto').addEventListener('click', openHowto);
$('btn-close').addEventListener('click', closeHowto);
$('howto').addEventListener('click', (e) => { if (e.target === $('howto')) closeHowto(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeHowto(); });

$('game-list').addEventListener('click', (e) => {
  const card = e.target.closest('.game');
  if (card) startGame(card.dataset.id);
});
$('game-list').addEventListener('pointermove', (e) => {
  const card = e.target.closest('.game');
  if (!card) return;
  const r = card.getBoundingClientRect();
  card.style.setProperty('--mx', (e.clientX - r.left) + 'px');
  card.style.setProperty('--my', (e.clientY - r.top) + 'px');
});


/* ---------- title letters: split for per-letter hover colour ---------- */
(function letters() {
  const wm = document.querySelector('.wordmark');
  wm.querySelectorAll('.line > span').forEach((el, li) => {
    const text = el.textContent, frag = document.createDocumentFragment();
    const hue = li === 0 ? [44, 20] : [268, 305];            // champagne→rose gold | lavender→orchid
    [...text].forEach((c, i) => {
      if (c === ' ') { frag.appendChild(document.createTextNode(' ')); return; }
      const s = document.createElement('span');
      s.className = 'ch'; s.textContent = c;
      const t = i / Math.max(text.length - 1, 1);
      s.style.setProperty('--hv', `hsl(${hue[0] + (hue[1] - hue[0]) * t} 85% 76%)`);
      frag.appendChild(s);
    });
    el.textContent = ''; el.appendChild(frag);
  });
  setTimeout(() => wm.classList.add('settled'), 1900);
})();

/* ============================================================
   CHIPTUNE AUDIO — original 8-bit theme synthesised live with
   the Web Audio API (no audio files, nothing copyrighted).
   Browsers block sound until the first tap/click, so music
   starts on the first interaction or via the SOUND button.
   ============================================================ */
const Chip = (() => {
  const BPM = 132, S = 60 / BPM / 4;          // one 16th-note step in seconds
  const VOL = 0.2;
  let ctx, master, noiseBuf, started = false, muted = false, step = 0, next = 0, timer = null;
  try { muted = localStorage.getItem('arcadeMuted') === '1'; } catch (e) {}

  const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
  const NOTE = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  const parse = (str) => {
    const out = [];
    for (const t of str.trim().split(/\s+/)) {
      if (t === '-') { out[out.length - 1].len++; out.push(null); continue; }
      if (t === 'x') { out.push(null); continue; }
      const m = t.match(/^([A-G])(#?)(\d)$/);
      out.push({ m: 12 * (+m[3] + 1) + NOTE[m[1]] + (m[2] ? 1 : 0), len: 1 });
    }
    return out;
  };
  // 4 bars (Am | F | C | G), 16 steps each — bright, bouncy arcade hook
  const LEAD = parse(`
    A4 x C5 x E5 x C5 x A5 - G5 - E5 - C5 x
    F4 x A4 x C5 x A4 x F5 - E5 - C5 - A4 x
    G4 x C5 x E5 x C5 x G5 - E5 - C5 - E5 x
    D5 x G5 x B5 x G5 x D6 - B5 - G5 - D5 x`);
  const CHORDS = [[57, 60, 64], [53, 57, 60], [60, 64, 67], [55, 59, 62]];
  const ROOTS = [45, 41, 48, 43];

  function tone(type, f, t, dur, vol, o = {}) {
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(f, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.005);
    g.gain.exponentialRampToValueAtTime(Math.max(vol * (o.sus ?? .55), 0.0002), t + dur * .6);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(master);
    osc.start(t); osc.stop(t + dur + 0.03);
  }
  function noise(t, dur, vol, hp) {
    const src = ctx.createBufferSource(), g = ctx.createGain(), f = ctx.createBiquadFilter();
    src.buffer = noiseBuf; f.type = 'highpass'; f.frequency.value = hp;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t, Math.random() * 0.8); src.stop(t + dur + 0.02);
  }

  function schedule(s, t) {
    const bar = Math.floor(s / 16) % 4, n = LEAD[s];
    if (n) tone('square', hz(n.m), t, n.len * S * .94, .5);                         // lead
    tone('square', hz(CHORDS[bar][[0, 1, 2, 1][s % 4]]), t, S * .8, .15);           // arpeggio
    if (s % 4 === 0) tone('triangle', hz(ROOTS[bar]), t, S * 3.6, .95);              // bass
    if (s % 4 === 2) tone('triangle', hz(ROOTS[bar] + 12), t, S * 1.6, .6);
    if (s % 8 === 0) tone('sine', 150, t, .16, .9, { to: 42, sus: .3 });            // kick
    if (s % 8 === 4) { noise(t, .13, .5, 1800); tone('triangle', 220, t, .08, .3, { to: 120 }); } // snare
    if (s % 2 === 0) noise(t, .035, s % 4 === 2 ? .2 : .11, 7500);                  // hat
  }
  function tick() {
    while (next < ctx.currentTime + 0.15) { schedule(step % 64, next); next += S; step++; }
  }

  let jingled = false;
  function hint(show) { const el = document.getElementById('sound-hint'); if (el) el.classList.toggle('show', show && !muted); }
  function onState() {                                   // fires whenever the browser lets the audio run / pauses it
    if (ctx.state !== 'running') { hint(true); return; }
    hint(false);
    next = Math.max(next, ctx.currentTime + 0.05);
    master.gain.setTargetAtTime(muted ? 0 : VOL, ctx.currentTime, .4);   // gentle fade-in
    if (!jingled && !muted) { jingled = true; [72, 76, 79, 84].forEach((m, i) => tone('square', hz(m), ctx.currentTime + .02 + i * .07, .12, .35)); }
  }
  function start() {
    if (started) { if (ctx.state === 'suspended') ctx.resume().catch(() => {}); return; }
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const comp = ctx.createDynamicsCompressor();
    master = ctx.createGain(); master.gain.value = 0;
    master.connect(comp); comp.connect(ctx.destination);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    started = true; next = ctx.currentTime + 0.08;
    timer = setInterval(tick, 25);
    ctx.onstatechange = onState;
    ctx.resume().catch(() => {});                        // plays at once if the browser allows autoplay
    onState(); ui();
  }
  function setMuted(v) {
    muted = v; try { localStorage.setItem('arcadeMuted', v ? '1' : '0'); } catch (e) {}
    if (started) { master.gain.setTargetAtTime(v ? 0 : VOL, ctx.currentTime, .05); hint(ctx.state !== 'running'); }
    ui();
  }
  function ui() {
    const b = document.getElementById('btn-sound');
    const on = started && !muted;
    b.classList.toggle('on', on); b.classList.toggle('idle', false);
    b.setAttribute('aria-pressed', String(on));
    const label = window.tr ? window.tr(!started ? 'sound' : on ? 'soundOn' : 'soundOff') : 'Sound';
    b.setAttribute('aria-label', label); b.title = label;
  }

  // tiny UI effects
  const sfx = {
    attract() {   // "coin + fanfare": draws passers-by to the machine
      if (!(started && !muted && ctx.state === 'running')) return;
      const t = ctx.currentTime;
      tone('square', hz(83), t, .07, .3); tone('square', hz(88), t + .07, .4, .3, { sus: .3 });
      [72, 76, 79, 84, 88].forEach((m, i) => tone('square', hz(m), t + .55 + i * .09, .16, .26));
      tone('triangle', hz(60), t + .55, .6, .55);
    },
    blip()   { if (started && !muted && ctx.state === 'running') tone('square', 1175, ctx.currentTime, .045, .22); },
    select() { if (started && !muted && ctx.state === 'running') { const t = ctx.currentTime; tone('square', 660, t, .07, .3); tone('square', 990, t + .07, .12, .3); } },
    launch() { if (started && !muted && ctx.state === 'running') { const t = ctx.currentTime; for (let i = 0; i < 10; i++) tone('sawtooth', 110 + i * 70, t + i * .07, .12, .16); } },
    back()   { if (started && !muted && ctx.state === 'running') { const t = ctx.currentTime; tone('square', 880, t, .07, .28); tone('square', 520, t + .07, .12, .28); } },
  };

  document.addEventListener('visibilitychange', () => {
    if (!started) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });
  return { start, setMuted, ui, sfx, isStarted: () => started, isMuted: () => muted, isRunning: () => started && ctx.state === 'running' };
})();

(function wireAudio() {
  const btn = document.getElementById('btn-sound');
  Chip.start();                                           // theme is ON by default; the player can switch it off
  // browsers may hold audio until the first tap/key press — resume on any gesture, then stop listening
  const evs = ['pointerdown', 'keydown', 'touchend', 'click'];
  const unlock = () => { Chip.start(); if (Chip.isRunning()) evs.forEach((e) => document.removeEventListener(e, unlock, true)); };
  evs.forEach((e) => document.addEventListener(e, unlock, true));
  btn.addEventListener('click', () => Chip.setMuted(!Chip.isMuted()));
  const hot = '.btn, .game, .back';
  document.addEventListener('mouseover', (e) => {
    const el = e.target.closest(hot);
    if (el && !el.contains(e.relatedTarget)) Chip.sfx.blip();
  });
  document.addEventListener('click', (e) => {
    const el = e.target.closest(hot);
    if (!el) return;
    el.classList.contains('back') ? Chip.sfx.back() : Chip.sfx.select();
  });
})();

(function wireLang() {
  const btn = document.getElementById('lang-btn'), menu = document.getElementById('lang-menu');
  menu.innerHTML = LANG_CODES.map((c) =>
    `<button role="option" data-lang="${c}"><span>${langName(c)}</span><span class="lc">${c.toUpperCase()}</span></button>`).join('');
  const setOpen = (o) => { menu.hidden = !o; btn.setAttribute('aria-expanded', String(o)); };
  btn.addEventListener('click', (e) => { e.stopPropagation(); setOpen(menu.hidden); });
  menu.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-lang]'); if (!b) return;
    applyLang(b.dataset.lang); setOpen(false);
  });
  document.addEventListener('click', (e) => { if (!e.target.closest('#lang')) setOpen(false); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setOpen(false); });
  applyLang(pickInitialLang());
})();

/* ---------- arcade attract mode: if nobody touches the machine, call people over ---------- */
(function attract() {
  const btn = document.getElementById('btn-start'), flash = document.getElementById('flash');
  const title = document.getElementById('screen-title'), sheet = document.getElementById('howto');
  const IDLE = 7000, EVERY = 9000;                       // ms of quiet before the first call, then between calls
  let last = Date.now(), lastBurst = 0;
  const bump = () => { last = Date.now(); };
  ['pointerdown', 'pointermove', 'keydown', 'touchstart'].forEach((e) => addEventListener(e, bump, { passive: true }));
  function burst() {
    btn.classList.remove('attract'); flash.classList.remove('go'); void btn.offsetWidth;   // restart the animations
    btn.classList.add('attract'); flash.classList.add('go');
    Chip.sfx.attract();
  }
  setInterval(() => {
    if (document.hidden || !title.classList.contains('is-active') || !sheet.hidden) return;
    const now = Date.now();
    if (now - last >= IDLE && now - lastBurst >= EVERY) { lastBurst = now; burst(); }
  }, 500);
})();

</script>
