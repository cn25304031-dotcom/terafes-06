    <header class="top" aria-hidden="true"></header>

    <section class="hero hero-sm">
      <h2 class="heading reveal" style="--d:.15s" data-i18n="heading">ゲームを選んでください</h2>
      <p class="sub reveal" style="--d:.25s" data-i18n="sub">遊びたいゲームをタップ</p>
    </section>

    <div class="game-list" id="game-list"><!-- rendered from GAMES in js/main.js --></div>

    <div class="back-row reveal" style="--d:.7s">
      <button class="back" id="btn-back" aria-label="戻る">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
        <span data-i18n="back">戻る</span>
      </button>
    </div>
  </section>

  <!-- ===== HOW TO PLAY ===== -->
  <div class="intro" id="intro" hidden aria-live="polite">
    <canvas id="ic"></canvas>
    <div class="sc sc1">
      <svg class="astro" viewBox="0 0 200 260" aria-hidden="true">
        <defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2f6ff"/><stop offset="1" stop-color="#9fb0d6"/></linearGradient>
        <linearGradient id="vg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fd4ff"/><stop offset="1" stop-color="#2a3d9a"/></linearGradient>
        <clipPath id="vc"><ellipse cx="100" cy="78" rx="38" ry="30"/></clipPath></defs>
        <rect x="52" y="120" width="96" height="104" rx="30" fill="url(#sg)"/>
        <rect x="30" y="128" width="30" height="84" rx="15" fill="url(#sg)" class="arm l"/>
        <rect x="140" y="128" width="30" height="84" rx="15" fill="url(#sg)" class="arm r"/>
        <rect x="74" y="148" width="52" height="34" rx="8" fill="#1a2447"/>
        <circle cx="86" cy="165" r="4" fill="#5fd4ff" class="led"/><circle cx="100" cy="165" r="4" fill="#ff5c8a" class="led d2"/><circle cx="114" cy="165" r="4" fill="#7dffb2" class="led d3"/>
        <rect x="66" y="222" width="30" height="30" rx="10" fill="#c9d3ee"/><rect x="104" y="222" width="30" height="30" rx="10" fill="#c9d3ee"/>
        <circle cx="100" cy="76" r="52" fill="url(#sg)"/>
        <ellipse cx="100" cy="78" rx="38" ry="30" fill="#0b1230"/>
        <g clip-path="url(#vc)"><rect class="visor" x="60" y="46" width="80" height="64" fill="url(#vg)"/></g>
        <ellipse cx="88" cy="68" rx="10" ry="5" fill="#fff" opacity=".5" class="glint"/>
      </svg>
      <div class="syncbar"><span data-i18n="suit">SUIT SYNC</span><div class="track"><i></i></div></div>
    </div>
    <div class="sc sc2">
      <div class="door l"></div><div class="door r"></div>
      <svg class="ship" viewBox="-40 -40 80 100" aria-hidden="true">
        <path class="flame" d="M-9 14 L0 44 L9 14z"/>
        <path d="M0 -34 L28 24 L0 13 L-28 24z" fill="#bcecff"/>
        <path d="M0 -22 L10 13 L0 8 L-10 13z" fill="#378cff"/>
        <rect x="-3" y="-8" width="6" height="15" fill="#fff"/>
      </svg>
      <ul class="checks">
        <li><span data-i18n="chEngine">ENGINE</span><b>OK</b></li>
        <li><span data-i18n="chWeapon">WEAPONS</span><b>OK</b></li>
        <li><span data-i18n="chShield">SHIELD</span><b>OK</b></li>
      </ul>
    </div>
    <div class="sc sc3">
      <svg class="ship" viewBox="-40 -40 80 100" aria-hidden="true">
        <path class="flame" d="M-9 14 L0 54 L9 14z"/>
        <path d="M0 -34 L28 24 L0 13 L-28 24z" fill="#bcecff"/>
        <path d="M0 -22 L10 13 L0 8 L-10 13z" fill="#378cff"/>
        <rect x="-3" y="-8" width="6" height="15" fill="#fff"/>
      </svg>
      <svg class="foe f1" viewBox="-20 -22 40 44" aria-hidden="true"><path d="M0 18L-19 -8L-7 -3L0 -15L7 -3L19 -8z" fill="#ff587e"/></svg>
      <svg class="foe f2" viewBox="-20 -22 40 44" aria-hidden="true"><path d="M0 18L-19 -8L-7 -3L0 -15L7 -3L19 -8z" fill="#ff9b55"/></svg>
      <svg class="foe f3" viewBox="-20 -22 40 44" aria-hidden="true"><path d="M0 18L-19 -8L-7 -3L0 -15L7 -3L19 -8z" fill="#ff587e"/></svg>
      <div class="battle" data-i18n="battle">BATTLE START</div>
    </div>
    <div class="cap" id="cap"></div>
    <div class="prog"><i></i></div>
    <button class="skip" id="skip"><span data-i18n="skip">SKIP</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l7 7-7 7M13 5l7 7-7 7"/></svg></button>
    <div class="iflash"></div>
  </div>

  <div class="game-frame" id="game-frame" hidden>
    <button class="game-exit" id="game-exit" aria-label="戻る">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      <span data-i18n="back">戻る</span>
    </button>
    <iframe id="gf" title="Game"></iframe>
  </div>

  <div class="modal" id="howto" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="howto-title">
      <span class="grab" aria-hidden="true"></span>
      <h2 id="howto-title" data-i18n="howto">遊び方</h2>
      <dl>
        <dt>Space Shooter</dt>
        <dd data-i18n="how1">ロケットを動かして弾を撃ち、敵を倒してスコアを稼ぐ。シールドが0になると終了。</dd>
        <dt>Card Matching</dt>
        <dd data-i18n="how2">カードを2枚ずつめくり、同じ絵柄のペアを探す。少ない手数と短い時間でクリアを目指そう。</dd>
      </dl>
      <button class="btn btn-primary" id="btn-close"><span class="label" data-i18n="close">閉じる</span></button>
    </div>
  </div>

  <script>
const GAME_HTML = {
  'space-shooter': "<!DOCTYPE html>\n<html lang=\"ja\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Space Shooter<\/title>\n    <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n    <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n    <link href=\"https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap\" rel=\"stylesheet\">\n    <style>\n* { box-sizing: border-box; }\n\n:root {\n    --cyan: #5fd8ff;\n    --violet: #a88bff;\n    --pink: #ff5cc8;\n    --gold: #ffd27a;\n    --font-hud: \"Orbitron\", \"Sora\", \"Noto Sans JP\", sans-serif;\n}\n\nhtml, body { height: 100%; }\n\nbody {\n    margin: 0;\n    display: grid;\n    place-items: center;\n    padding: 58px 10px 10px;\n    overflow: hidden;\n    color: #eaf2ff;\n    font-family: \"Noto Sans JP\", \"Inter\", Arial, sans-serif;\n    background:\n        radial-gradient(ellipse at 50% 0%, #0d1740 0%, #04071a 50%, #010208 100%);\n}\n\n/* ---------- stage (keeps 4:3, fits any window) ---------- */\n.stage {\n    position: relative;\n    container-type: inline-size;\n    width: min(100%, calc((100vh - 70px) * 4 / 3));\n    aspect-ratio: 4 / 3;\n    overflow: hidden;\n    border-radius: 14px;\n    background: #02030a;\n    border: 1px solid rgba(110, 170, 255, .28);\n    box-shadow:\n        0 0 0 1px rgba(0, 0, 0, .6),\n        0 0 60px -10px rgba(70, 120, 255, .45),\n        0 30px 80px -30px rgba(0, 0, 0, .9),\n        inset 0 0 50px rgba(30, 60, 160, .25);\n}\n\n#gameCanvas {\n    position: absolute;\n    inset: 0;\n    display: block;\n    width: 100%;\n    height: 100%;\n    touch-action: none;\n}\n\n.fx { position: absolute; inset: 0; pointer-events: none; }\n.fx-vignette { background: radial-gradient(120% 95% at 50% 45%, transparent 55%, rgba(0, 0, 8, .75) 100%); }\n.fx-scan { opacity: .5; background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .025) 0 1px, transparent 1px 3px); mix-blend-mode: overlay; }\n\n<\/style>\n    <style>\n/* ---------- HUD ---------- */\n.hud {\n    position: absolute;\n    top: 0; left: 0; right: 0;\n    display: flex;\n    justify-content: space-between;\n    padding: 2.2cqw 2.4cqw;\n    pointer-events: none;\n}\n.hud-block { display: flex; gap: 1.2cqw; }\n\n.stat {\n    min-width: 11cqw;\n    padding: .9cqw 1.5cqw 1cqw;\n    border-radius: 10px;\n    background: linear-gradient(160deg, rgba(14, 24, 58, .72), rgba(6, 10, 28, .6));\n    border: 1px solid rgba(120, 170, 255, .22);\n    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .07), 0 8px 24px -14px rgba(0, 0, 0, .9);\n    -webkit-backdrop-filter: blur(6px);\n    backdrop-filter: blur(6px);\n}\n.stat span {\n    display: block;\n    font: 500 clamp(8px, 1.25cqw, 11px)/1 var(--font-hud);\n    letter-spacing: .28em;\n    color: #7f93bd;\n}\n.stat strong {\n    display: block;\n    margin-top: .6cqw;\n    font: 700 clamp(14px, 2.6cqw, 24px)/1.1 var(--font-hud);\n    letter-spacing: .06em;\n    font-variant-numeric: tabular-nums;\n}\n#score { color: var(--gold); text-shadow: 0 0 14px rgba(255, 210, 122, .55); }\n#hp    { color: #5fd8ff; text-shadow: 0 0 14px rgba(95, 216, 255, .6); display: flex; gap: .25em; align-items: center; }\n#hp .sh { display: block; width: 1.7em; height: 1.7em; transition: opacity .3s, filter .3s; }\n#hp .sh svg { display: block; width: 100%; height: 100%; fill: currentColor; stroke: rgba(210,245,255,.9); stroke-width: .8; filter: drop-shadow(0 0 4px rgba(95,216,255,.8)); stroke-linejoin: round; }\n#hp .sh.off { opacity: .18; filter: grayscale(1); }\n#power { color: #79f7d4; text-shadow: 0 0 14px rgba(120, 255, 210, .5); }\n#bestScore { color: #c9d6f5; }\n\n/* ---------- boss bar ---------- */\n.boss-hud {\n    position: absolute;\n    left: 50%; bottom: 2.6cqw;\n    width: 58%;\n    display: flex; align-items: center; gap: 1.6cqw;\n    padding: .9cqw 1.6cqw;\n    border-radius: 999px;\n    background: rgba(18, 6, 28, .7);\n    border: 1px solid rgba(255, 92, 200, .4);\n    box-shadow: 0 0 30px -8px rgba(255, 60, 180, .6);\n    -webkit-backdrop-filter: blur(6px);\n    backdrop-filter: blur(6px);\n    transform: translate(-50%, 16px);\n    opacity: 0; pointer-events: none;\n    transition: opacity .4s, transform .5s cubic-bezier(.2, .7, .2, 1);\n}\n.boss-hud.show { opacity: 1; transform: translate(-50%, 0); }\n.boss-hud .bl { font: 700 clamp(9px, 1.5cqw, 13px)/1 var(--font-hud); letter-spacing: .3em; color: var(--pink); text-shadow: 0 0 12px var(--pink); }\n.boss-hud strong { min-width: 3.4em; text-align: right; font: 700 clamp(10px, 1.6cqw, 14px)/1 var(--font-hud); color: #ffc2e8; font-variant-numeric: tabular-nums; }\n.boss-bar-track { flex: 1; height: 1cqw; min-height: 6px; border-radius: 99px; background: rgba(255, 255, 255, .1); overflow: hidden; }\n#bossBarFill { width: 0; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #ff3f8e, #ff9be0); box-shadow: 0 0 14px #ff4fb0; transition: width .12s linear; }\n\n<\/style>\n    <style>\n/* ---------- overlay (title / pause / result) ---------- */\n.overlay {\n    position: absolute;\n    inset: 0;\n    display: grid;\n    place-items: center;\n    padding: 4cqw;\n    background:\n        radial-gradient(ellipse at 50% 40%, rgba(10, 20, 60, .55), rgba(1, 3, 12, .9) 75%);\n    -webkit-backdrop-filter: blur(5px);\n    backdrop-filter: blur(5px);\n}\n.overlay.hidden { display: none; }\n\n.panel {\n    position: relative;\n    width: min(92%, 520px);\n    padding: 3.4cqw 4cqw 3cqw;\n    text-align: center;\n    border-radius: 20px;\n    background: linear-gradient(165deg, rgba(16, 26, 64, .8), rgba(5, 9, 26, .85));\n    border: 1px solid rgba(130, 180, 255, .28);\n    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .09), 0 30px 70px -30px #000, 0 0 70px -20px rgba(80, 130, 255, .5);\n    animation: panelIn .7s cubic-bezier(.2, .7, .2, 1) both;\n}\n@keyframes panelIn { from { opacity: 0; transform: translateY(18px) scale(.97); filter: blur(6px); } }\n\n.kicker { margin: 0 0 1.4cqw; font: 500 clamp(9px, 1.3cqw, 12px)/1 var(--font-hud); letter-spacing: .42em; color: #7f93bd; }\n\n.overlay h2 {\n    margin: 0;\n    font: 900 clamp(24px, 5.6cqw, 50px)/1.05 var(--font-hud);\n    letter-spacing: .08em;\n    background: linear-gradient(100deg, #7be4ff 0%, #b9a6ff 55%, #ff9be0 100%);\n    -webkit-background-clip: text; background-clip: text;\n    -webkit-text-fill-color: transparent; color: transparent;\n    filter: drop-shadow(0 0 18px rgba(110, 160, 255, .5));\n}\n\n.overlay p#overlayMessage {\n    margin: 2cqw 0 2.8cqw;\n    line-height: 1.9;\n    font-size: clamp(12px, 1.9cqw, 16px);\n    color: #c3d2ee;\n    white-space: pre-line;\n}\n\nbutton {\n    position: relative;\n    padding: 1.7cqw 5cqw;\n    border: 0;\n    border-radius: 999px;\n    font: 700 clamp(12px, 2cqw, 17px)/1 var(--font-hud);\n    letter-spacing: .22em;\n    color: #04101f;\n    cursor: pointer;\n    background: linear-gradient(120deg, #7be4ff, #7d8dff 60%, #c084ff);\n    box-shadow: 0 0 0 4px rgba(120, 160, 255, .14), 0 14px 34px -10px rgba(90, 140, 255, .8), inset 0 1px 0 rgba(255, 255, 255, .55);\n    transition: transform .3s cubic-bezier(.2, .7, .2, 1), box-shadow .3s, filter .3s;\n    animation: pulse 2.4s ease-in-out infinite;\n}\n@keyframes pulse { 50% { box-shadow: 0 0 0 9px rgba(120, 160, 255, .06), 0 14px 40px -8px rgba(110, 160, 255, 1), inset 0 1px 0 rgba(255, 255, 255, .55); } }\nbutton:hover { transform: translateY(-2px) scale(1.04); filter: brightness(1.12); }\nbutton:active { transform: scale(.97); }\nbutton:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }\n\n.keys {\n    list-style: none;\n    margin: 2.8cqw 0 0;\n    padding: 2cqw 0 0;\n    display: flex; justify-content: center; flex-wrap: wrap; gap: 1.4cqw 3cqw;\n    border-top: 1px solid rgba(255, 255, 255, .08);\n    font-size: clamp(10px, 1.45cqw, 13px);\n    color: #8fa3cb;\n}\n.keys li { display: flex; align-items: center; gap: .6cqw; }\nkbd {\n    padding: .35cqw .9cqw;\n    border-radius: 6px;\n    font: 500 clamp(9px, 1.3cqw, 12px)/1.2 var(--font-hud);\n    letter-spacing: .08em;\n    color: #d8e6ff;\n    background: rgba(255, 255, 255, .07);\n    border: 1px solid rgba(255, 255, 255, .18);\n    border-bottom-width: 2px;\n}\n\n@media (max-width: 560px) {\n    body { padding: 54px 4px 4px; }\n    .stat { min-width: 0; }\n}\n\n<\/style>\n    <style>\n/* ---------- stage select / banner / boss pips ---------- */\n.stage-select { z-index: 5; }\n.ss-wrap { width: 100%; text-align: center; animation: panelIn .7s cubic-bezier(.2,.7,.2,1) both; }\n.stage-select h2 { margin: 0; font: 900 clamp(22px, 4.6cqw, 40px)/1.05 var(--font-hud); letter-spacing: .12em;\n  background: linear-gradient(100deg,#7be4ff,#b9a6ff 55%,#ff9be0); -webkit-background-clip: text; background-clip: text;\n  -webkit-text-fill-color: transparent; color: transparent; }\n.ss-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.3cqw; margin: 2cqw 0 1.4cqw; }\n.ss-card { position: relative; cursor: pointer; padding: .6cqw .5cqw 1.1cqw; border-radius: 14px; text-align: center;\n  background: linear-gradient(165deg, rgba(16,26,64,.7), rgba(5,9,26,.82)); border: 1px solid rgba(130,180,255,.22);\n  transition: transform .3s cubic-bezier(.2,.7,.2,1), border-color .3s, box-shadow .3s; }\n.ss-card:hover, .ss-card:focus-visible { transform: translateY(-4px) scale(1.03); border-color: rgba(130,220,255,.85);\n  box-shadow: 0 0 34px -6px rgba(90,170,255,.75); outline: none; }\n.ss-card canvas { width: 100%; display: block; aspect-ratio: 1; }\n.ss-card b { display: block; font: 700 clamp(7px,1.1cqw,11px)/1 var(--font-hud); letter-spacing: .3em; color: #7f93bd; }\n.ss-card strong { display: block; margin-top: .6cqw; font: 800 clamp(10px,1.7cqw,15px)/1 var(--font-hud); letter-spacing: .1em; color: #eaf2ff; }\n.ss-card em { display: block; margin-top: .6cqw; font: 500 clamp(6px,.95cqw,10px)/1 var(--font-hud); font-style: normal; letter-spacing: .18em; color: #ff7d93; }\n.ss-card.cleared { border-color: rgba(120,255,200,.55); }\n.ss-card.cleared em { color: #79f7d4; }\n.ss-foot { margin: 0; font-size: clamp(9px,1.4cqw,13px); letter-spacing: .12em; color: #8fa3cb; }\n.banner { position: absolute; left: 0; right: 0; top: 33%; text-align: center; pointer-events: none; opacity: 0; z-index: 4; }\n.banner.show { animation: bannerIn 2.6s cubic-bezier(.2,.7,.2,1) forwards; }\n@keyframes bannerIn { 0%{opacity:0;transform:scale(1.3);filter:blur(10px)} 12%{opacity:1;transform:none;filter:none} 78%{opacity:1} 100%{opacity:0;transform:scale(.98)} }\n.banner small { display: block; font: 500 clamp(9px,1.5cqw,13px)/1 var(--font-hud); letter-spacing: .5em; color: #9fb6e6; }\n.banner b { display: block; margin-top: 1cqw; font: 900 clamp(22px,6cqw,56px)/1 var(--font-hud); letter-spacing: .14em; color: #fff; text-shadow: 0 0 28px rgba(110,170,255,.85); }\n.banner.warn small { color: #ff8a96; }\n.banner.warn b { color: #ff3b52; text-shadow: 0 0 32px rgba(255,40,60,.95); }\n.stage-tag { position: absolute; top: 9.4cqw; left: 50%; transform: translateX(-50%); white-space: nowrap; pointer-events: none;\n  font: 600 clamp(8px,1.2cqw,11px)/1 var(--font-hud); letter-spacing: .3em; color: #9fb6e6; text-shadow: 0 0 10px #000; }\n.pips { display: flex; gap: .7cqw; align-items: center; }\n.pips i { width: 1.1cqw; height: 1.1cqw; min-width: 6px; min-height: 6px; transform: rotate(45deg); background: rgba(255,255,255,.15); transition: .3s; }\n.pips i.on { background: #ff3f5e; box-shadow: 0 0 10px #ff3f5e; }\n.boss-hud { border-color: rgba(255,70,90,.5) !important; box-shadow: 0 0 30px -8px rgba(255,40,70,.7) !important; }\n.boss-hud .bl { color: #ff4a5e !important; text-shadow: 0 0 12px #ff2a48 !important; }\n#bossBarFill { background: linear-gradient(90deg,#ff2b4a,#ff9a5c) !important; box-shadow: 0 0 14px #ff3050 !important; }\n#menuButton { margin-top: 1.4cqw; background: rgba(255,255,255,.07); color: #cfe0ff; box-shadow: none; animation: none; border: 1px solid rgba(255,255,255,.22); }\n#menuButton[hidden] { display: none; }\n\n<\/style>\n    <\/head>\n<body>\n    <main class=\"stage\" id=\"stage\">\n        <canvas id=\"gameCanvas\" width=\"800\" height=\"600\"\n                aria-label=\"スペースシューティングゲーム\"><\/canvas>\n\n        <div class=\"fx fx-vignette\"><\/div>\n        <div class=\"fx fx-scan\"><\/div>\n\n        <header class=\"hud\" aria-label=\"ゲームステータス\">\n            <div class=\"hud-block\">\n                <div class=\"stat score\"><span>SCORE<\/span><strong id=\"score\">0<\/strong><\/div>\n                <div class=\"stat hull\"><span>HULL<\/span><strong id=\"hp\"><\/strong><\/div>\n            <\/div>\n            <div class=\"hud-block\">\n                <div class=\"stat power\"><span>SHOT<\/span><strong id=\"power\">1<\/strong><\/div>\n                <div class=\"stat best\"><span>BEST<\/span><strong id=\"bestScore\">0<\/strong><\/div>\n            <\/div>\n        <\/header>\n\n        <div class=\"boss-hud\" id=\"bossHud\">\n            <span class=\"bl\">DEVOURER<\/span>\n            <div class=\"pips\" id=\"bossPips\"><i><\/i><i><\/i><i><\/i><i><\/i><i><\/i><\/div>\n            <div class=\"boss-bar-track\"><div id=\"bossBarFill\"><\/div><\/div>\n            <strong id=\"bossHp\">---<\/strong>\n        <\/div>\n\n        <div id=\"overlay\" class=\"overlay\">\n            <div class=\"panel\">\n                <p class=\"kicker\">TERA FES 2026<\/p>\n                <h2 id=\"overlayTitle\">SPACE SHOOTER<\/h2>\n                <p id=\"overlayMessage\">敵を倒して、ボスを撃破しよう！<\/p>\n                <button id=\"startButton\">GAME START<\/button>\n                <button id=\"menuButton\" hidden>STAGE SELECT<\/button>\n                <ul class=\"keys\">\n                    <li><kbd>W A S D<\/kbd><kbd>↑ ← ↓ →<\/kbd><span>移動<\/span><\/li>\n                    <li><kbd>SPACE<\/kbd><span>射撃<\/span><\/li>\n                    <li><kbd>ESC<\/kbd><span>一時停止<\/span><\/li>\n                    <li><kbd>M<\/kbd><span>効果音 ON/OFF<\/span><\/li>\n                <\/ul>\n            <\/div>\n        <\/div>\n        <div class=\"stage-tag\" id=\"stageTag\"><\/div>\n        <div class=\"banner\" id=\"banner\"><small><\/small><b><\/b><\/div>\n\n        <div id=\"stageSelect\" class=\"overlay stage-select hidden\">\n            <div class=\"ss-wrap\">\n                <h2>SELECT STAGE<\/h2>\n                <div class=\"ss-grid\" id=\"ssGrid\"><\/div>\n                <p class=\"ss-foot\">SURVIVE 30 SECONDS · DESTROY THE BOSS TO CLEAR THE STAGE<\/p>\n            <\/div>\n        <\/div>\n    <\/main>\n\n<script>\n\"use strict\";\n\n// ---------- Local storage ----------\n\nfunction loadBestScore() {\n    try {\n        return Number(localStorage.getItem(\"spaceShooterBest\")) || 0;\n    } catch {\n        return 0;\n    }\n}\n\nfunction saveBestScore() {\n    if (score > bestScore) {\n        bestScore = score;\n\n        try {\n            localStorage.setItem(\"spaceShooterBest\", String(bestScore));\n        } catch {\n            // The game still works if storage is unavailable.\n        }\n    }\n\n    bestScoreElement.textContent = bestScore;\n}\n\n<\/script>\n<script>\n\"use strict\";\n\n// ==============================\n// Space Shooter - Game Logic\n// ==============================\n\nconst canvas = document.getElementById(\"gameCanvas\");\nconst ctx = canvas.getContext(\"2d\");\n\nconst scoreElement = document.getElementById(\"score\");\nconst hpElement = document.getElementById(\"hp\");\nconst powerElement = document.getElementById(\"power\");\nconst bossHpElement = document.getElementById(\"bossHp\");\nconst bossBarFill = document.getElementById(\"bossBarFill\");\nconst bestScoreElement = document.getElementById(\"bestScore\");\n\nconst overlay = document.getElementById(\"overlay\");\nconst overlayTitle = document.getElementById(\"overlayTitle\");\nconst overlayMessage = document.getElementById(\"overlayMessage\");\nconst startButton = document.getElementById(\"startButton\");\n\nconst WIDTH = canvas.width;\nconst HEIGHT = canvas.height;\nconst BOSS_KILL_LIMIT = 24;   // 4 waves x 6 enemies, then the boss\nconst WAVE_LENGTH = 5.5;      // seconds per wave\nconst WAVE_NORMALS = 5;       // normal enemies per wave\nconst MAX_ON_SCREEN = 9;       // hard cap so the screen never floods\n\nconst keys = new Set();\n\nlet state = \"ready\";\nlet score = 0;\nlet bestScore = loadBestScore();\nlet defeatedEnemies = 0;\nlet waveTime = 0;\nlet waveSchedule = [];\nlet waveNumber = 0;\nlet gameTime = 0;\nlet lastTime = 0;\nlet animationId = 0;\nlet boss = null;\nlet bossSpawned = false;\nlet shake = 0;\n\nlet player;\nlet playerBullets = [];\nlet enemyBullets = [];\nlet enemies = [];\nlet items = [];\nlet particles = [];\nlet rings = [];\nlet hurtFlash = 0;\nlet bgScroll = 0;\nlet time = 0;\n\nconst bossHud = document.getElementById(\"bossHud\");\nconst bossPips = [...document.querySelectorAll(\"#bossPips i\")];\nconst stageTag = document.getElementById(\"stageTag\");\nconst banner = document.getElementById(\"banner\");\nconst stageSelect = document.getElementById(\"stageSelect\");\nconst menuButton = document.getElementById(\"menuButton\");\nconst ssGrid = document.getElementById(\"ssGrid\");\nconst BOSS_TIME = 30;      // boss arrives 30 s after the stage starts\nconst BOSS_LEVELS = 5;     // boss has 5 HP levels\nlet stageIdx = 0;\nlet bossWarned = false;\nlet bgPlanet = null;\nlet ssCards = [];\nlet bannerTimer = 0;\n\nconst stars = Array.from({ length: 140 }, () => {\n    const z = Math.random();\n    const roll = Math.random();\n\n    return {\n        x: Math.random() * WIDTH,\n        y: Math.random() * HEIGHT,\n        z,\n        size: 0.6 + z * 1.7,\n        speed: 14 + z * 80,\n        tw: Math.random() * Math.PI * 2,\n        color: roll < 0.2 ? \"#9fd8ff\" : roll < 0.33 ? \"#ffc6e8\" : \"#e6f1ff\"\n    };\n});\n\n<\/script>\n<script>\n\"use strict\";\n\n// ==============================\n// Sound effects (Web Audio API — everything is synthesised, no audio files)\n//   laserSfx()   player fires\n//   hitSfx()     laser hits an enemy (still alive)\n//   boomSfx()    enemy destroyed\n//   bossHitSfx() laser hits the boss\n//   roarSfx()    boss roar\n//   M key        mute / unmute all effects\n// ==============================\n\nlet actx = null;\nlet sfxMuted = false;\nconst sfxLast = {};\nlet noiseBuf = null;\n\nfunction ac() {\n    actx = actx || new (window.AudioContext || window.webkitAudioContext)();\n    if (actx.state === \"suspended\") actx.resume();\n    return actx;\n}\n\n// Browsers only allow audio after a user gesture: create / resume on the first one.\nfor (const evt of [\"keydown\", \"pointerdown\", \"touchstart\"]) {\n    window.addEventListener(evt, () => { try { ac(); } catch { /* audio unavailable */ } }, { passive: true });\n}\n\n// Rate limiter so rapid fire never turns into a wall of noise.\nfunction sfxReady(name, gapMs) {\n    const now = performance.now();\n    if (sfxMuted || now - (sfxLast[name] || 0) < gapMs) return false;\n    sfxLast[name] = now;\n    return true;\n}\n\nfunction noiseSource(a) {\n    if (!noiseBuf) {\n        noiseBuf = a.createBuffer(1, a.sampleRate, a.sampleRate);\n        const d = noiseBuf.getChannelData(0);\n        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;\n    }\n    const s = a.createBufferSource();\n    s.buffer = noiseBuf;\n    return s;\n}\n\nfunction toggleSfx() {\n    sfxMuted = !sfxMuted;\n    showBanner(\"SOUND\", sfxMuted ? \"OFF\" : \"ON\", false);\n}\n\n// \"pew\": a bright saw + square sweeping down, with a tiny random pitch so it never sounds machine-gunned.\nfunction laserSfx() {\n    if (!sfxReady(\"laser\", 60)) return;\n    try {\n        const a = ac(), t = a.currentTime, p = 0.94 + Math.random() * 0.12;\n        const out = a.createGain();\n        out.gain.setValueAtTime(0.0001, t);\n        out.gain.exponentialRampToValueAtTime(0.085, t + 0.008);\n        out.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);\n        const lp = a.createBiquadFilter(); lp.type = \"lowpass\"; lp.frequency.value = 5200;\n        out.connect(lp); lp.connect(a.destination);\n\n        const saw = a.createOscillator(); saw.type = \"sawtooth\";\n        saw.frequency.setValueAtTime(1500 * p, t);\n        saw.frequency.exponentialRampToValueAtTime(260 * p, t + 0.15);\n        saw.connect(out); saw.start(t); saw.stop(t + 0.17);\n\n        const sq = a.createOscillator(); sq.type = \"square\";\n        sq.frequency.setValueAtTime(760 * p, t);\n        sq.frequency.exponentialRampToValueAtTime(130 * p, t + 0.15);\n        const sqGain = a.createGain(); sqGain.gain.value = 0.45;\n        sq.connect(sqGain); sqGain.connect(out); sq.start(t); sq.stop(t + 0.17);\n    } catch { /* audio unavailable */ }\n}\n\n// Short zap + spark when a laser connects with an enemy.\nfunction hitSfx() {\n    if (!sfxReady(\"hit\", 35)) return;\n    try {\n        const a = ac(), t = a.currentTime;\n        const out = a.createGain();\n        out.gain.setValueAtTime(0.14, t);\n        out.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);\n        out.connect(a.destination);\n\n        const n = noiseSource(a);\n        const hp = a.createBiquadFilter(); hp.type = \"highpass\"; hp.frequency.value = 2600;\n        n.connect(hp); hp.connect(out); n.start(t); n.stop(t + 0.07);\n\n        const o = a.createOscillator(); o.type = \"triangle\";\n        o.frequency.setValueAtTime(980, t);\n        o.frequency.exponentialRampToValueAtTime(420, t + 0.07);\n        const og = a.createGain(); og.gain.value = 0.55;\n        o.connect(og); og.connect(out); o.start(t); o.stop(t + 0.07);\n    } catch { /* audio unavailable */ }\n}\n\n// Explosion: filtered noise sweeping down + a low thump. Strong enemies sound bigger.\nfunction boomSfx(strong) {\n    if (!sfxReady(\"boom\", 40)) return;\n    try {\n        const a = ac(), t = a.currentTime, dur = strong ? 0.6 : 0.38;\n        const out = a.createGain();\n        out.gain.setValueAtTime(strong ? 0.34 : 0.26, t);\n        out.gain.exponentialRampToValueAtTime(0.0001, t + dur);\n        out.connect(a.destination);\n\n        const lp = a.createBiquadFilter(); lp.type = \"lowpass\";\n        lp.frequency.setValueAtTime(strong ? 2200 : 1800, t);\n        lp.frequency.exponentialRampToValueAtTime(110, t + dur);\n        const n = noiseSource(a);\n        n.connect(lp); lp.connect(out); n.start(t); n.stop(t + dur);\n\n        const o = a.createOscillator(); o.type = \"sine\";\n        o.frequency.setValueAtTime(strong ? 150 : 130, t);\n        o.frequency.exponentialRampToValueAtTime(36, t + dur);\n        const og = a.createGain(); og.gain.value = 0.9;\n        o.connect(og); og.connect(out); o.start(t); o.stop(t + dur);\n    } catch { /* audio unavailable */ }\n}\n\n// Metallic clank for shots landing on the boss's armour.\nfunction bossHitSfx() {\n    if (!sfxReady(\"bossHit\", 70)) return;\n    try {\n        const a = ac(), t = a.currentTime;\n        const out = a.createGain();\n        out.gain.setValueAtTime(0.11, t);\n        out.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);\n        out.connect(a.destination);\n        for (const f of [330, 497, 1180]) {\n            const o = a.createOscillator(); o.type = \"square\";\n            o.frequency.setValueAtTime(f, t);\n            o.frequency.exponentialRampToValueAtTime(f * 0.7, t + 0.12);\n            const g = a.createGain(); g.gain.value = f > 1000 ? 0.18 : 0.4;\n            o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.14);\n        }\n    } catch { /* audio unavailable */ }\n}\n\n// Boss roar (used when the boss enters and when it gets angrier)\nfunction roarSfx() {\n    try {\n        const a = ac();\n        const t = a.currentTime, dur = 1.5;\n        const out = a.createGain(); out.gain.setValueAtTime(0, t);\n        out.gain.linearRampToValueAtTime(0.28, t + 0.12); out.gain.exponentialRampToValueAtTime(0.001, t + dur);\n        const lp = a.createBiquadFilter(); lp.type = \"lowpass\";\n        lp.frequency.setValueAtTime(1400, t); lp.frequency.exponentialRampToValueAtTime(220, t + dur);\n        out.connect(lp); lp.connect(a.destination);\n        for (const [type, f0, f1] of [[\"sawtooth\", 110, 38], [\"sawtooth\", 117, 41], [\"square\", 55, 30]]) {\n            const o = a.createOscillator(); o.type = type;\n            o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);\n            o.connect(out); o.start(t); o.stop(t + dur);\n        }\n        const nb = a.createBuffer(1, a.sampleRate * dur, a.sampleRate), nd = nb.getChannelData(0);\n        for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;\n        const ns = a.createBufferSource(); ns.buffer = nb;\n        const ng = a.createGain(); ng.gain.value = 0.35; ns.connect(ng); ng.connect(out); ns.start(t);\n    } catch { /* audio unavailable */ }\n}\n\n\n<\/script>\n<script>\n\"use strict\";\n\n// ---------- Procedural 3D planets ----------\nconst sst = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };\nconst mixc = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];\n\nfunction hash3(x, y, z) {\n    let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(z, 1274126177);\n    h = Math.imul(h ^ (h >>> 13), 1274126177);\n    return ((h ^ (h >>> 16)) >>> 0) / 4294967295;\n}\nfunction vnoise(x, y, z) {\n    const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);\n    const xf = x - xi, yf = y - yi, zf = z - zi;\n    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);\n    const n = (a, b, c) => hash3(xi + a, yi + b, zi + c);\n    const l = (a, b, t) => a + (b - a) * t;\n    return l(\n        l(l(n(0,0,0), n(1,0,0), u), l(n(0,1,0), n(1,1,0), u), v),\n        l(l(n(0,0,1), n(1,0,1), u), l(n(0,1,1), n(1,1,1), u), v), w);\n}\nfunction fbm(x, y, z, oct = 4) {\n    let s = 0, a = 0.5, f = 1, t = 0;\n    for (let i = 0; i < oct; i++) { s += a * vnoise(x * f, y * f, z * f); t += a; f *= 2; a *= 0.5; }\n    return s / t;\n}\nconst wrapA = (a) => Math.atan2(Math.sin(a), Math.cos(a));\n\nconst PLANETS = [\n    { name: \"MERCURY\", atmo: [175,175,190], atmoK: 0.25, tilt: 0.05, cardR: 26, bgR: 66, bgX: 650, bgY: 150, spin: 0.02,\n      fn: (x, y, z) => { const n = fbm(x*3, y*3, z*3, 4); let g = 90 + n*100;\n          g *= 1 - 0.55 * sst(.56, .7, fbm(x*8+5, y*8, z*8, 3));\n          g *= 0.8 + Math.abs(fbm(x*15, y*15, z*15, 2) - .5) * .9; return [g*1.02, g*.97, g*.9]; } },\n    { name: \"VENUS\", atmo: [255,190,90], atmoK: 0.9, tilt: 0.1, cardR: 34, bgR: 90, bgX: 650, bgY: 160, spin: 0.015,\n      fn: (x, y, z) => { const w = fbm(x*3 + fbm(x*5, y*5, z*5, 3)*1.5, y*2.2, z*3, 4);\n          return mixc([185,120,55], [248,220,150], sst(.3, .75, w)); } },\n    { name: \"EARTH\", atmo: [110,170,255], atmoK: 1.1, tilt: 0.41, cardR: 35, bgR: 94, bgX: 650, bgY: 165, spin: 0.025,\n      fn: (x, y, z) => { const h = fbm(x*2.2+1.3, y*2.2, z*2.2, 5); let c;\n          if (h < 0.5) c = mixc([10,35,105], [35,110,195], sst(.3, .5, h));\n          else { const veg = fbm(x*5, y*5, z*5, 3) + Math.abs(y)*.25;\n                 c = mixc([50,135,60], [165,140,85], sst(.45, .75, veg));\n                 if (h > 0.64) c = mixc(c, [235,235,240], sst(.64, .72, h)); }\n          if (Math.abs(y) > .86) c = mixc(c, [245,248,255], sst(.86, .92, Math.abs(y)));\n          return mixc(c, [255,255,255], sst(.52, .74, fbm(x*3.2+9, y*5, z*3.2, 5)) * .85); } },\n    { name: \"MARS\", atmo: [255,140,90], atmoK: 0.55, tilt: 0.44, cardR: 29, bgR: 78, bgX: 650, bgY: 155, spin: 0.025,\n      fn: (x, y, z) => { const n = fbm(x*3, y*3, z*3, 5); let c = mixc([150,62,38], [222,132,76], n);\n          c = mixc(c, [75,36,28], sst(.55, .72, fbm(x*2+4, y*2.4, z*2, 4)) * .65);\n          return mixc(c, [245,240,235], sst(.88, .94, Math.abs(y))); } },\n    { name: \"JUPITER\", atmo: [255,200,150], atmoK: 0.5, tilt: 0.05, cardR: 46, bgR: 135, bgX: 630, bgY: 190, spin: 0.05,\n      fn: (x, y, z, lon) => { const w = fbm(x*2, y*7, z*2, 4) * .9; const t = .5 + .5*Math.sin(y*17 + w*5);\n          let c = mixc([236,216,186], [188,118,74], t);\n          c = mixc(c, [138,86,62], sst(.72, .95, Math.sin(y*8 + 1)) * .55);\n          const d = Math.hypot(wrapA(lon - 0.9) * 1.1, (y + .3) * 2.3);\n          return mixc(c, [196,72,48], (1 - sst(.16, .32, d)) * .92); } },\n    { name: \"SATURN\", atmo: [255,225,160], atmoK: 0.5, tilt: 0.47, cardR: 33, bgR: 88, bgX: 620, bgY: 175, spin: 0.04, rings: true,\n      fn: (x, y, z) => { const w = fbm(x*2, y*8, z*2, 3) * .6; const t = .5 + .5*Math.sin(y*22 + w*4);\n          return mixc(mixc([208,176,118], [238,218,168], t), [170,160,120], sst(.8, 1, Math.abs(y)) * .5); } },\n    { name: \"URANUS\", atmo: [140,235,240], atmoK: 0.9, tilt: 1.4, cardR: 40, bgR: 100, bgX: 650, bgY: 165, spin: 0.03,\n      fn: (x, y, z) => { const t = .5 + .5*Math.sin(y*9 + fbm(x*2, y*2, z*2, 3)*2);\n          return mixc([112,196,212], [170,232,236], t*.8 + (Math.abs(y) > .8 ? .2 : 0)); } },\n    { name: \"NEPTUNE\", atmo: [90,140,255], atmoK: 1.0, tilt: 0.5, cardR: 39, bgR: 98, bgX: 650, bgY: 165, spin: 0.035,\n      fn: (x, y, z, lon) => { const w = fbm(x*2, y*7, z*2, 4);\n          let c = mixc([22,48,165], [58,104,238], .5 + .5*Math.sin(y*10 + w*3));\n          c = mixc(c, [225,240,255], sst(.64, .8, fbm(x*4+2, y*11, z*4, 4)) * .55);\n          const d = Math.hypot(wrapA(lon - 2.2) * 1.2, (y + .32) * 2.6);\n          return mixc(c, [10,22,90], (1 - sst(.15, .3, d)) * .85); } }\n];\n\nconst TEX_W = 256, TEX_H = 128;\nfor (const p of PLANETS) {\n    p.tex = new Uint8ClampedArray(TEX_W * TEX_H * 3);\n    for (let r = 0; r < TEX_H; r++) {\n        const lat = (0.5 - (r + 0.5) / TEX_H) * Math.PI, cl = Math.cos(lat), y = Math.sin(lat);\n        for (let c = 0; c < TEX_W; c++) {\n            const lon = ((c + 0.5) / TEX_W - 0.5) * Math.PI * 2;\n            const col = p.fn(cl * Math.sin(lon), y, cl * Math.cos(lon), lon);\n            const i = (r * TEX_W + c) * 3;\n            p.tex[i] = col[0]; p.tex[i + 1] = col[1]; p.tex[i + 2] = col[2];\n        }\n    }\n}\n\n// A lit, rotating sphere rendered from the texture (per-pixel, cached geometry)\nclass PlanetSprite {\n    constructor(p, R) {\n        this.p = p; this.R = R;\n        const S = R * 2;\n        this.c = document.createElement(\"canvas\");\n        this.c.width = this.c.height = S;\n        this.g = this.c.getContext(\"2d\");\n        this.img = this.g.createImageData(S, S);\n        const ca = Math.cos(p.tilt), sa = Math.sin(p.tilt);\n        let L = [-0.55, -0.4, 0.73]; const ln = Math.hypot(...L); L = L.map((v) => v / ln);\n        const idx = [], U = [], V = [], SH = [], RIM = [], AL = [];\n        for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {\n            const nx = (x + 0.5 - R) / R, ny = (y + 0.5 - R) / R, r2 = nx * nx + ny * ny;\n            if (r2 > 1) continue;\n            const nz = Math.sqrt(1 - r2), d = nx * L[0] + ny * L[1] + nz * L[2];\n            const xr = nx * ca - ny * sa, yr = nx * sa + ny * ca;\n            U.push(Math.atan2(xr, nz) / (Math.PI * 2) + 0.5);\n            V.push(Math.min(TEX_H - 1, Math.floor((0.5 + Math.asin(Math.max(-1, Math.min(1, yr))) / Math.PI) * TEX_H)));\n            SH.push(0.09 + 0.95 * sst(-0.15, 0.85, d));\n            RIM.push(Math.pow(1 - nz, 2.6) * (0.25 + 0.75 * Math.max(0, d + 0.3)) * p.atmoK);\n            AL.push(Math.max(0, Math.min(1, (1 - Math.sqrt(r2)) * R)) * 255);\n            idx.push((y * S + x) * 4);\n        }\n        this.idx = Int32Array.from(idx); this.U = Float32Array.from(U); this.V = Int32Array.from(V);\n        this.SH = Float32Array.from(SH); this.RIM = Float32Array.from(RIM); this.AL = Float32Array.from(AL);\n    }\n    update(rot) {\n        const d = this.img.data, tex = this.p.tex, W = TEX_W, n = this.idx.length, off = rot * W;\n        const [ar, ag, ab] = this.p.atmo;\n        for (let k = 0; k < n; k++) {\n            let col = ((this.U[k] * W + off) | 0) % W; if (col < 0) col += W;\n            const ti = (this.V[k] * W + col) * 3, sh = this.SH[k], rm = this.RIM[k], o = this.idx[k];\n            d[o] = tex[ti] * sh + ar * rm;\n            d[o + 1] = tex[ti + 1] * sh + ag * rm;\n            d[o + 2] = tex[ti + 2] * sh + ab * rm;\n            d[o + 3] = this.AL[k];\n        }\n        this.g.putImageData(this.img, 0, 0);\n    }\n}\n\nfunction drawPlanetRings(g, x, y, R, front) {\n    g.save();\n    g.translate(x, y); g.rotate(-0.38); g.scale(1, 0.3);\n    const bands = [[1.3,1.5,\"rgba(205,180,135,.55)\"], [1.52,1.76,\"rgba(238,218,172,.75)\"],\n                   [1.78,1.83,\"rgba(25,16,8,.55)\"], [1.85,2.12,\"rgba(200,175,130,.5)\"]];\n    for (const [a, b, c] of bands) {\n        g.strokeStyle = c; g.lineWidth = (b - a) * R;\n        g.beginPath(); g.arc(0, 0, (a + b) / 2 * R, front ? 0 : Math.PI, front ? Math.PI : Math.PI * 2); g.stroke();\n    }\n    g.restore();\n}\n\n<\/script>\n<script>\n\"use strict\";\n\n// ---------- Stage select ----------\nlet cleared = loadCleared();\nfunction loadCleared() { try { return JSON.parse(localStorage.getItem(\"spaceShooterCleared\") || \"[]\"); } catch { return []; } }\nfunction saveCleared() { try { localStorage.setItem(\"spaceShooterCleared\", JSON.stringify(cleared)); } catch { /* ignore */ } }\n\nfunction buildStageSelect() {\n    ssGrid.innerHTML = PLANETS.map((p, i) => {\n        const done = cleared.includes(i);\n        return `<div class=\"ss-card${done ? \" cleared\" : \"\"}\" data-i=\"${i}\" tabindex=\"0\" role=\"button\" aria-label=\"Stage ${i + 1} ${p.name}\">\n            <canvas width=\"168\" height=\"168\"><\/canvas><strong>${p.name}<\/strong>\n            <em>${done ? \"✔ CLEARED\" : \"&nbsp;\"}<\/em><\/div>`;\n    }).join(\"\");\n    ssCards = [...ssGrid.children].map((el, i) => ({\n        el, g: el.querySelector(\"canvas\").getContext(\"2d\"), sprite: new PlanetSprite(PLANETS[i], PLANETS[i].cardR)\n    }));\n    ssCards.forEach((c, i) => {\n        const go = () => { stageIdx = i; startGame(); };\n        c.el.addEventListener(\"click\", go);\n        c.el.addEventListener(\"keydown\", (e) => { if (e.key === \"Enter\" || e.key === \" \") { e.preventDefault(); e.stopPropagation(); go(); } });\n    });\n}\nfunction openStageSelect() {\n    state = \"ready\";\n    overlay.classList.add(\"hidden\");\n    bossHud.classList.remove(\"show\");\n    stageTag.textContent = \"\";\n    buildStageSelect();\n    stageSelect.classList.remove(\"hidden\");\n}\nfunction drawStageSelect() {\n    for (let i = 0; i < ssCards.length; i++) {\n        const c = ssCards[i], p = PLANETS[i];\n        c.g.clearRect(0, 0, 168, 168);\n        if (p.rings) drawPlanetRings(c.g, 84, 84, p.cardR, false);\n        c.sprite.update(time * p.spin * 2 + i * 0.13);\n        c.g.drawImage(c.sprite.c, 84 - p.cardR, 84 - p.cardR);\n        if (p.rings) drawPlanetRings(c.g, 84, 84, p.cardR, true);\n    }\n}\nfunction drawStagePlanet() {\n    if (!bgPlanet) return;\n    const p = PLANETS[stageIdx], R = p.bgR;\n    bgPlanet.update(time * p.spin);\n    glowCircle(p.bgX, p.bgY, R * 1.55, p.atmo.join(\",\"), 0.26);\n    if (p.rings) drawPlanetRings(ctx, p.bgX, p.bgY, R, false);\n    ctx.drawImage(bgPlanet.c, p.bgX - R, p.bgY - R);\n    if (p.rings) drawPlanetRings(ctx, p.bgX, p.bgY, R, true);\n}\n\n<\/script>\n<script>\n\"use strict\";\n\n// ---------- Banner ----------\nfunction showBanner(sub, title, warn) {\n    banner.querySelector(\"small\").textContent = sub;\n    banner.querySelector(\"b\").textContent = title;\n    banner.classList.toggle(\"warn\", !!warn);\n    banner.classList.remove(\"show\"); void banner.offsetWidth; banner.classList.add(\"show\");\n}\n\n<\/script>\n<script>\n\"use strict\";\n\n// ---------- Reset and start ----------\n\nfunction resetGame() {\n    score = 0;\n    defeatedEnemies = 0;\n    waveTime = 0;\n    waveSchedule = [];\n    waveNumber = 0;\n    startWave();\n    gameTime = 0;\n    boss = null;\n    bossSpawned = false;\n    bossWarned = false;\n    bgPlanet = new PlanetSprite(PLANETS[stageIdx], PLANETS[stageIdx].bgR);\n    shake = 0;\n\n    playerBullets = [];\n    enemyBullets = [];\n    enemies = [];\n    items = [];\n    particles = [];\n    rings = [];\n    hurtFlash = 0;\n\n    player = {\n        x: WIDTH / 2,\n        y: HEIGHT - 75,\n        width: 30,\n        height: 36,\n        speed: 300,\n        hp: 3,\n        power: 1,\n        double: 0,\n        shootTimer: 0,\n        invincible: 0,\n        shield: 0\n    };\n\n    updateUI();\n}\n\nfunction startGame() {\n    resetGame();\n    state = \"playing\";\n    overlay.classList.add(\"hidden\");\n    stageSelect.classList.add(\"hidden\");\n    lastTime = performance.now();\n    showBanner(\"\", PLANETS[stageIdx].name, false);\n}\n\nstartButton.addEventListener(\"click\", () => {\n    if (state === \"paused\") {\n        state = \"playing\";\n        overlay.classList.add(\"hidden\");\n        lastTime = performance.now();\n    } else if (state === \"clear\") {\n        if (stageIdx < PLANETS.length - 1) { stageIdx++; startGame(); }\n        else openStageSelect();\n    } else if (state === \"over\" || state === \"ready\") {\n        startGame();\n    }\n});\nmenuButton.addEventListener(\"click\", openStageSelect);\n\n// ---------- Keyboard ----------\n\nwindow.addEventListener(\"keydown\", (event) => {\n    const key = event.key.toLowerCase();\n\n    if (\n        key === \" \" ||\n        key.startsWith(\"arrow\") ||\n        [\"w\", \"a\", \"s\", \"d\", \"escape\"].includes(key)\n    ) {\n        event.preventDefault();\n    }\n\n    if (key === \"m\") { toggleSfx(); return; }\n\n    if (key === \"escape\") {\n        if (state === \"playing\") {\n            state = \"paused\";\n            showOverlay(\"PAUSED\", \"Escキーで再開できます。\", \"RESUME\", true);\n        } else if (state === \"paused\") {\n            state = \"playing\";\n            overlay.classList.add(\"hidden\");\n            lastTime = performance.now();\n        }\n        return;\n    }\n\n    keys.add(key);\n});\n\nwindow.addEventListener(\"keyup\", (event) => {\n    keys.delete(event.key.toLowerCase());\n});\n\nwindow.addEventListener(\"blur\", () => {\n    keys.clear();\n\n    if (state === \"playing\") {\n        state = \"paused\";\n        showOverlay(\"PAUSED\", \"Escキーまたはボタンで再開できます。\", \"RESUME\", true);\n    }\n});\n\n<\/script>\n<script>\n\"use strict\";\n\n// ---------- UI and overlay ----------\n\nfunction updateUI() {\n    scoreElement.textContent = score;\n    if (hpElement.dataset.v !== String(player.hp)) {\n        hpElement.dataset.v = String(player.hp);\n        hpElement.innerHTML = [0, 1, 2].map((i) =>\n            '<span class=\"sh' + (i < player.hp ? '' : ' off') + '\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 2L4 5.2v6.2c0 5 3.3 8.9 8 10.6 4.7-1.7 8-5.6 8-10.6V5.2z\"/><path d=\"M12 6.2v12.2c-2.8-1.4-4.6-4-4.6-7V7.6z\" fill=\"rgba(4,10,30,.35)\" stroke=\"none\"/><\/svg><\/span>').join(\"\");\n    }\n\n    powerElement.textContent = player.double > 0 ? `x2 ${Math.ceil(player.double)}s` : \"x1\";\n\n    bossHud.classList.toggle(\"show\", !!boss);\n\n    if (boss) {\n        const pct = boss.dead ? 0 : Math.max(1, Math.ceil(boss.hp / boss.maxHp * 100));\n        bossHpElement.textContent = pct;\n        bossBarFill.style.width = `${Math.max(0, boss.hp / boss.maxHp * 100)}%`;\n        bossPips.forEach((pip, i) => pip.classList.toggle(\"on\", i < boss.level));\n    } else {\n        bossHpElement.textContent = \"---\";\n        bossBarFill.style.width = \"0%\";\n    }\n\n    bestScoreElement.textContent = bestScore;\n}\n\nfunction showOverlay(title, message, buttonText, withMenu = false) {\n    overlayTitle.textContent = title;\n    overlayMessage.textContent = message;\n    startButton.textContent = buttonText;\n    menuButton.hidden = !withMenu;\n    overlay.classList.remove(\"hidden\");\n}\n\nfunction gameOver() {\n    if (state !== \"playing\") return;\n\n    state = \"over\";\n    saveBestScore();\n\n    showOverlay(\n        \"GAME OVER\",\n        `${PLANETS[stageIdx].name}\\nSCORE: ${score}\\nBEST SCORE: ${bestScore}`,\n        \"RETRY\",\n        true\n    );\n}\n\nfunction stageClear() {\n    if (state !== \"playing\") return;\n\n    state = \"clear\";\n    score += 1000;\n    saveBestScore();\n    if (!cleared.includes(stageIdx)) { cleared.push(stageIdx); saveCleared(); }\n    updateUI();\n\n    const p = PLANETS[stageIdx];\n    const last = stageIdx === PLANETS.length - 1;\n    if (last || PLANETS.every((_, i) => cleared.includes(i))) {\n        showOverlay(\n            \"ALL CLEAR\",\n            `All 8 planets defended!\\nSCORE: ${score}  (Bonus +1000)`,\n            \"STAGE SELECT\"\n        );\n    } else {\n        showOverlay(\n            \"STAGE CLEAR\",\n            `${p.name} · BOSS DESTROYED\\nSCORE: ${score}  (Bonus +1000)`,\n            `NEXT STAGE · ${PLANETS[stageIdx + 1].name}`,\n            true\n        );\n    }\n}\n\n<\/script>\n<script>\n\"use strict\";\n\n// ---------- Utility ----------\n\nfunction random(min, max) {\n    return Math.random() * (max - min) + min;\n}\n\nfunction distanceSquared(a, b) {\n    const dx = a.x - b.x;\n    const dy = a.y - b.y;\n    return dx * dx + dy * dy;\n}\n\nfunction hit(a, b, radiusA, radiusB) {\n    const radius = radiusA + radiusB;\n    return distanceSquared(a, b) < radius * radius;\n}\n\nfunction createParticles(x, y, color, amount = 12) {\n    for (let i = 0; i < amount; i++) {\n        const angle = Math.random() * Math.PI * 2;\n        const speed = random(40, 190);\n\n        particles.push({\n            x,\n            y,\n            vx: Math.cos(angle) * speed,\n            vy: Math.sin(angle) * speed,\n            life: random(0.25, 0.7),\n            maxLife: 0.7,\n            size: random(2, 5),\n            color\n        });\n    }\n}\n\nfunction createRing(x, y, color, max = 70, speed = 260) {\n    rings.push({ x, y, r: 6, max, speed, color });\n}\n\nfunction addScore(points) {\n    score += points;\n    saveBestScore();\n}\n\n<\/script>\n<script>\n\"use strict\";\n\n// ---------- Enemies ----------\n\n// One wave = 5 normal enemies + 1 mid-level enemy that drops a bonus.\nfunction startWave() {\n    waveNumber++;\n    waveTime = 0;\n    waveSchedule = [];\n\n    for (let i = 0; i < WAVE_NORMALS; i++) {\n        waveSchedule.push({ t: 0.3 + i * 0.85 + random(-0.12, 0.12), strong: false });\n    }\n\n    waveSchedule.push({ t: 2.3, strong: true });\n    waveSchedule.sort((a, b) => a.t - b.t);\n}\n\nfunction spawnEnemy(strong) {\n    enemies.push({\n        x: strong ? random(WIDTH * 0.3, WIDTH * 0.7) : random(35, WIDTH - 35),\n        y: -40,\n        width: strong ? 46 : 28,\n        height: strong ? 40 : 27,\n        hp: strong ? 8 : 1,\n        maxHp: strong ? 8 : 1,\n        speed: (strong ? random(55, 70) : random(95, 135)) * (1 + stageIdx * 0.05),\n        strong,\n        shootTimer: random(0.9, 1.5),\n        phase: random(0, Math.PI * 2)\n    });\n}\n\nfunction dropBonus(x, y) {\n    // The mid-level enemy always drops one benefit.\n    const pool = [\"shield\", \"double\"];\n    if (player.hp < 3) pool.push(\"heal\", \"heal\");\n\n    items.push({\n        x,\n        y,\n        type: pool[Math.floor(Math.random() * pool.length)],\n        radius: 14,\n        speed: 80\n    });\n}\n\nfunction defeatEnemy(enemy, index) {\n    boomSfx(enemy.strong);\n    createParticles(\n        enemy.x,\n        enemy.y,\n        enemy.strong ? \"#ff9c55\" : \"#ff587e\",\n        enemy.strong ? 22 : 12\n    );\n\n    createRing(enemy.x, enemy.y, enemy.strong ? \"255,156,85\" : \"255,88,126\", enemy.strong ? 100 : 60);\n    addScore(enemy.strong ? 250 : 50);\n    defeatedEnemies++;\n\n    if (enemy.strong) dropBonus(enemy.x, enemy.y);\n\n    enemies.splice(index, 1);\n\n}\n\n<\/script>\n<script>\n\"use strict\";\n\n// ---------- Boss: THE DEVOURER ----------\n\nfunction spawnBoss() {\n    bossSpawned = true;\n    enemies = [];\n    enemyBullets = [];\n\n    const lv = 16 + stageIdx * 3;   // HP per level (5 levels)\n    boss = {\n        x: WIDTH / 2, y: -240, width: 381, height: 263,\n        level: BOSS_LEVELS, levelMax: lv, levelHp: lv,\n        hp: lv * BOSS_LEVELS, maxHp: lv * BOSS_LEVELS,\n        direction: 1, attackTimer: 1.4, pattern: 0, flash: 0,\n        enter: 2.4, invuln: 0, roar: 0, tilt: 0,\n        mode: \"patrol\", modeT: 0, lungeCd: 7, lockY: 300,\n        dead: false, deathT: 0, drool: 0\n    };\n\n    shake = 12;\n    hurtFlash = 0.5;\n    roarSfx();\n    showBanner(\"BOSS\", \"THE DEVOURER\", true);\n}\n\nfunction bossShoot() {\n    const b = boss;\n    if (!b) return;\n\n    const phase = BOSS_LEVELS + 1 - b.level;\n    const k = 1 + stageIdx * 0.035;\n    const down = Math.PI / 2;\n    const BOLT = \"#ff6a3d\", PLASMA = \"#ff2e4d\", EMBER = \"#ffb84d\";\n    b.fireFlash = b.fireFlash || {};\n\n    // every shot leaves from a real weapon mount on the ship\n    const mount = (name) => ({ name, x: b.x + BOSS_MUZ[name][0], y: b.y + BOSS_MUZ[name][1] });\n    const fire = (m, ang, spd, r, color, bolt) => {\n        enemyBullets.push({\n            x: m.x, y: m.y, vx: Math.cos(ang) * spd * k, vy: Math.sin(ang) * spd * k,\n            radius: r, color, bolt: !!bolt\n        });\n        b.fireFlash[m.name] = 1;\n        createParticles(m.x, m.y, color, 2);\n    };\n    const aim = (m, spread = 0.9) =>\n        Math.max(down - spread, Math.min(down + spread, Math.atan2(player.y - m.y, player.x - m.x)));\n    const fan = (m, n, total, spd, r, color) => {\n        for (let i = 0; i < n; i++) fire(m, down + (i / (n - 1) - 0.5) * total, spd, r, color);\n    };\n\n    const CL = mount(\"cl\"), CR = mount(\"cr\"), CORE = mount(\"core\"), DL = mount(\"dl\"), DR = mount(\"dr\");\n    const heavy = (m, off = 0) => fire(m, aim(m) + off, 290, 5, BOLT, true);   // cannon bolts\n    const spit = (m, off = 0) => fire(m, aim(m, 1.1) + off, 235, 3.6, EMBER, false); // dome turrets\n\n    const p = ++b.pattern;\n\n    if (phase === 1) {\n        heavy(p % 2 ? CL : CR);\n    } else if (phase === 2) {\n        heavy(CL); heavy(CR);\n        if (p % 2) fan(CORE, 3, 0.5, 200, 5.5, PLASMA);\n    } else if (phase === 3) {\n        const m = p % 3;\n        if (m === 0) { heavy(CL); heavy(CR); spit(DL); spit(DR); }\n        else if (m === 1) fan(CORE, 7, 1.1, 215, 5.5, PLASMA);\n        else { heavy(CL, -0.08); heavy(CR, 0.08); }\n    } else if (phase === 4) {\n        heavy(CL, -0.06); heavy(CL, 0.06); heavy(CR, -0.06); heavy(CR, 0.06);\n        spit(DL); spit(DR);\n        if (p % 2) fan(CORE, 9, 1.5, 195, 5.5, PLASMA);\n    } else {\n        const m = p % 3;\n        if (m === 0) {\n            for (let i = 0; i < 13; i++) fire(CORE, 0.25 + (i / 12) * (Math.PI - 0.5), 220, 5.5, PLASMA);\n        } else if (m === 1) {\n            for (const o of [-0.1, 0, 0.1]) { heavy(CL, o); heavy(CR, o); }\n            spit(DL); spit(DR);\n        } else {\n            fan(CORE, 11, 1.4, 205, 5.5, PLASMA);\n            heavy(CL); heavy(CR);\n        }\n    }\n}\n\nfunction damageBoss(damage) {\n    const b = boss;\n    if (!b || b.dead || b.enter > 0) return;\n\n    if (b.invuln > 0) { createParticles(b.x, b.y + 30, \"#ffffff\", 2); return; }\n\n    b.levelHp -= damage;\n    b.hp -= damage;\n    b.flash = 0.07;\n    bossHitSfx();\n\n    if (b.levelHp > 0) return;\n\n    if (b.level > 1) {\n        // one HP level down -> it gets angrier\n        b.level--;\n        b.levelHp = b.levelMax;\n        b.invuln = 1.4;\n        b.roar = 1.2;\n        b.mode = \"patrol\";\n        enemyBullets = [];\n        shake = 14;\n        hurtFlash = 0.6;\n        createParticles(b.x, b.y, \"#ff3b3b\", 40);\n        createParticles(b.x, b.y, \"#a6ff2e\", 20);\n        createRing(b.x, b.y, \"255,60,60\", 200, 420);\n        createRing(b.x, b.y, \"166,255,46\", 140, 320);\n        addScore(300);\n        roarSfx();\n        showBanner(`PHASE ${BOSS_LEVELS + 1 - b.level} / ${BOSS_LEVELS}`, b.level === 1 ? \"FINAL RAGE\" : \"ENRAGED\", true);\n    } else {\n        // last level gone: death throes, then stage / chapter clear\n        b.hp = 0; b.levelHp = 0;\n        b.dead = true; b.deathT = 2.2;\n        b.mode = \"patrol\";\n        enemyBullets = [];\n        shake = 16;\n        roarSfx();\n    }\n}\n\nfunction updateBoss(dt) {\n    const b = boss;\n    if (!b) return;\n\n    b.flash = Math.max(0, b.flash - dt);\n    b.invuln = Math.max(0, b.invuln - dt);\n    b.roar = Math.max(0, b.roar - dt);\n    if (b.fireFlash) for (const key in b.fireFlash) b.fireFlash[key] = Math.max(0, b.fireFlash[key] - dt * 4);\n\n    const phase = BOSS_LEVELS + 1 - b.level;\n\n    if (b.dead) {\n        b.deathT -= dt;\n        b.y += 22 * dt;\n        b.tilt += dt * 0.15;\n        createParticles(b.x + random(-110, 110), b.y + random(-70, 70), Math.random() < 0.5 ? \"#a6ff2e\" : \"#ff4a3a\", 4);\n        if (Math.random() < 0.15) createRing(b.x + random(-90, 90), b.y + random(-60, 60), \"255,90,60\", 70, 220);\n        shake = Math.max(shake, 6);\n        if (b.deathT <= 0) {\n            createParticles(b.x, b.y, \"#ff3b3b\", 60);\n            createParticles(b.x, b.y, \"#a6ff2e\", 40);\n            createRing(b.x, b.y, \"255,80,60\", 240, 420);\n            createRing(b.x, b.y, \"166,255,46\", 170, 320);\n            shake = 16;\n            boss = null;\n            enemyBullets = [];\n            stageClear();\n        }\n        return;\n    }\n\n    if (b.enter > 0) {\n        b.enter -= dt;\n        const t = 1 - Math.max(0, b.enter) / 2.4;\n        b.y = -240 + (110 + 240) * (1 - Math.pow(1 - t, 3));\n        shake = Math.max(shake, 2.5 * (1 - t));\n        return;\n    }\n\n    b.tilt += (Math.max(-0.28, Math.min(0.28, (b.vx || 0) * 0.0016)) - b.tilt) * Math.min(1, dt * 5);\n\n    if (b.mode === \"patrol\") {\n        b.moveT = (b.moveT || 0) - dt;\n        if (b.moveT <= 0) {\n            b.moveT = random(0.9, 2.1);\n            b.tx = Math.random() < 0.55 ? player.x + random(-90, 90) : random(110, WIDTH - 110);\n            b.tx = Math.max(110, Math.min(WIDTH - 110, b.tx));\n        }\n        const maxV = 150 + phase * 30;\n        const want = Math.max(-maxV, Math.min(maxV, (b.tx - b.x) * 2.2));\n        b.vx = (b.vx || 0) + (want - (b.vx || 0)) * Math.min(1, dt * 3);\n        b.x = Math.max(100, Math.min(WIDTH - 100, b.x + b.vx * dt));\n        b.direction = b.vx >= 0 ? 1 : -1;\n        b.y = 110 + Math.sin(gameTime * 1.6) * 10 + Math.sin(gameTime * 0.7) * 8;\n\n        b.attackTimer -= dt;\n        if (b.attackTimer <= 0 && b.roar <= 0) {\n            bossShoot();\n            b.attackTimer = [1.15, 0.98, 0.86, 0.72, 0.55][phase - 1];\n        }\n\n        if (phase >= 3) {\n            b.lungeCd -= dt;\n            if (b.lungeCd <= 0 && b.roar <= 0) {\n                b.mode = \"windup\"; b.modeT = 0.8;\n                b.lungeCd = random(5, 7) - phase * 0.3;\n                showBanner(\"DODGE\", \"IT'S LUNGING!\", true);\n            }\n        }\n    } else if (b.mode === \"windup\") {\n        b.modeT -= dt;\n        b.x += (player.x - b.x) * Math.min(1, dt * 3);\n        b.y += (105 - b.y) * Math.min(1, dt * 5);\n        shake = Math.max(shake, 3);\n        if (b.modeT <= 0) {\n            b.mode = \"lunge\"; b.modeT = 0.5;\n            b.lockY = Math.max(280, Math.min(440, player.y - 80));\n        }\n    } else if (b.mode === \"lunge\") {\n        b.modeT -= dt;\n        b.y += (b.lockY - b.y) * Math.min(1, dt * 9);\n        if (b.modeT <= 0) {\n            b.mode = \"return\"; b.modeT = 0.9;\n            shake = 8;\n            createRing(b.x, b.y + 40, \"255,70,60\", 140, 420);\n        }\n    } else {\n        b.modeT -= dt;\n        b.y += (110 - b.y) * Math.min(1, dt * 3.5);\n        if (b.modeT <= 0) b.mode = \"patrol\";\n    }\n\n    // claws / body contact\n    if (hit(player, { x: b.x, y: b.y + 8 }, 13, 66)) damagePlayer();\n\n    // acid drool\n    b.drool -= dt;\n    if (b.drool <= 0) {\n        b.drool = 0.09;\n        particles.push({ x: b.x + random(-30, 30), y: b.y - 50, vx: random(-20, 20), vy: random(-70, -30), life: 0.5, maxLife: 0.5, size: random(1.5, 3), color: \"#ff5a3a\" });\n    }\n}\n\n<\/script>\n<script>\n\"use strict\";\n\n// ---------- Items ----------\n\nfunction collectItem(item) {\n    if (item.type === \"double\") {\n        player.double = 12;                          // double shot for 12 s\n        createParticles(item.x, item.y, \"#ffd27a\", 14);\n        createRing(player.x, player.y, \"255,210,122\", 60);\n    } else if (item.type === \"heal\") {\n        player.hp = Math.min(3, player.hp + 1);\n        createParticles(item.x, item.y, \"#ff718c\", 14);\n        createRing(player.x, player.y, \"255,113,140\", 60);\n    } else if (item.type === \"shield\") {\n        player.shield = 6;\n        player.invincible = Math.max(player.invincible, 6);\n        createParticles(item.x, item.y, \"#70caff\", 14);\n        createRing(player.x, player.y, \"112,202,255\", 60);\n    }\n}\n\n// ---------- Player ----------\n\nfunction playerShoot() {\n    laserSfx();\n    // Bullets always fly straight up, from the nose of the ship.\n    const offsets = player.double > 0 ? [-9, 9] : [0];\n\n    for (const offset of offsets) {\n        playerBullets.push({\n            x: player.x + offset,\n            y: player.y - 24,\n            vx: 0,\n            vy: -540,\n            radius: 4,\n            damage: 1\n        });\n    }\n}\n\nfunction damagePlayer() {\n    if (player.invincible > 0) return;\n\n    player.hp--;\n    player.invincible = 1.2;\n    shake = 7;\n\n    createParticles(player.x, player.y, \"#ff647d\", 18);\n    createRing(player.x, player.y, \"255,100,125\", 70);\n    hurtFlash = 0.55;\n\n    if (player.hp <= 0) {\n        player.hp = 0;\n        gameOver();\n    }\n\n    updateUI();\n}\n\n<\/script>\n<script>\n\"use strict\";\n\n// ---------- Update game ----------\n\nfunction update(dt) {\n    gameTime += dt;\n\n    // Starfield\n    for (const star of stars) {\n        star.y += star.speed * dt;\n\n        if (star.y > HEIGHT) {\n            star.y = 0;\n            star.x = Math.random() * WIDTH;\n        }\n    }\n\n    // Particles\n    for (let i = particles.length - 1; i >= 0; i--) {\n        const p = particles[i];\n\n        p.x += p.vx * dt;\n        p.y += p.vy * dt;\n        p.life -= dt;\n        p.vx *= 0.98;\n        p.vy *= 0.98;\n\n        if (p.life <= 0) particles.splice(i, 1);\n    }\n\n    for (let i = rings.length - 1; i >= 0; i--) {\n        const ring = rings[i];\n        ring.r += ring.speed * dt;\n        if (ring.r >= ring.max) rings.splice(i, 1);\n    }\n\n    hurtFlash = Math.max(0, hurtFlash - dt * 1.6);\n\n    if (shake > 0) shake = Math.max(0, shake - 25 * dt);\n\n    // Player movement\n    let dx = 0;\n    let dy = 0;\n\n    if (keys.has(\"a\") || keys.has(\"arrowleft\")) dx--;\n    if (keys.has(\"d\") || keys.has(\"arrowright\")) dx++;\n    if (keys.has(\"w\") || keys.has(\"arrowup\")) dy--;\n    if (keys.has(\"s\") || keys.has(\"arrowdown\")) dy++;\n\n    const length = Math.hypot(dx, dy) || 1;\n\n    player.x += (dx / length) * player.speed * dt;\n    player.y += (dy / length) * player.speed * dt;\n\n    player.x = Math.max(20, Math.min(WIDTH - 20, player.x));\n    player.y = Math.max(25, Math.min(HEIGHT - 25, player.y));\n\n    player.invincible = Math.max(0, player.invincible - dt);\n    player.shield = Math.max(0, player.shield - dt);\n    player.double = Math.max(0, player.double - dt);\n\n    // Continuous shooting\n    player.shootTimer -= dt;\n\n    if (keys.has(\" \") && player.shootTimer <= 0) {\n        playerShoot();\n        player.shootTimer = 0.17;\n    }\n\n    // Waves: 5 normal enemies + 1 mid-level enemy every few seconds\n    if (!bossSpawned) {\n        waveTime += dt;\n\n        while (waveSchedule.length && waveSchedule[0].t <= waveTime) {\n            const next = waveSchedule.shift();\n            if (enemies.length < MAX_ON_SCREEN) spawnEnemy(next.strong);\n        }\n\n        if (waveTime >= WAVE_LENGTH && waveSchedule.length === 0) startWave();\n    }\n\n    // Enemy movement and shooting\n    const slow = (!bossSpawned && gameTime >= BOSS_TIME - 10) ? 0.45 : 1;   // enemies drift in slowly while the boss approaches\n    for (let i = enemies.length - 1; i >= 0; i--) {\n        const enemy = enemies[i];\n\n        enemy.y += enemy.speed * slow * dt;\n        enemy.x += Math.sin(gameTime * 2 + enemy.phase) * 45 * slow * dt;\n        enemy.x = Math.max(20, Math.min(WIDTH - 20, enemy.x));\n\n        if (enemy.strong) {\n            enemy.shootTimer -= dt;\n\n            if (enemy.shootTimer <= 0) {\n                // Mid-level enemy fires straight down (very slight homing), never from the side\n                const aim = Math.max(-30, Math.min(30, (player.x - enemy.x) * 0.15));\n\n                enemyBullets.push({\n                    x: enemy.x,\n                    y: enemy.y + 16,\n                    vx: aim,\n                    vy: 210,\n                    radius: 5,\n                    color: \"#ffae58\"\n                });\n\n                enemy.shootTimer = random(1.6, 2.4);\n            }\n        }\n\n        if (hit(player, enemy, 15, enemy.width * 0.38)) {\n            damagePlayer();\n            defeatEnemy(enemy, i);\n            continue;\n        }\n\n        if (enemy.y > HEIGHT + 40) {\n            enemies.splice(i, 1);\n        }\n    }\n\n    // The DEVOURER arrives 30 seconds after the stage starts\n    if (!bossSpawned && !bossWarned && gameTime >= BOSS_TIME - 3.5) {\n        bossWarned = true;\n        hurtFlash = 0.35;\n        showBanner(\"WARNING\", \"SOMETHING IS COMING\", true);\n    }\n    if (!bossSpawned && gameTime >= BOSS_TIME) spawnBoss();\n\n    updateBoss(dt);\n\n    stageTag.textContent = boss\n        ? `${PLANETS[stageIdx].name} · BOSS FIGHT`\n        : `${PLANETS[stageIdx].name} · BOSS IN ${Math.max(0, Math.ceil(BOSS_TIME - gameTime))}s`;\n\n    // Player bullets\n    for (let i = playerBullets.length - 1; i >= 0; i--) {\n        const bullet = playerBullets[i];\n\n        bullet.x += bullet.vx * dt;\n        bullet.y += bullet.vy * dt;\n\n        let removed = false;\n\n        if (boss && !boss.dead && boss.enter <= 0 && hit(bullet, { x: boss.x, y: boss.y + 8 }, bullet.radius, 76)) {\n            damageBoss(bullet.damage);\n            playerBullets.splice(i, 1);\n            removed = true;\n        }\n\n        if (removed) continue;\n\n        for (let j = enemies.length - 1; j >= 0; j--) {\n            const enemy = enemies[j];\n\n            if (hit(bullet, enemy, bullet.radius, enemy.width * 0.38)) {\n                enemy.hp -= bullet.damage;\n                if (enemy.hp > 0) hitSfx();\n                createParticles(bullet.x, bullet.y, \"#78f3ff\", 3);\n                playerBullets.splice(i, 1);\n                removed = true;\n\n                if (enemy.hp <= 0) {\n                    defeatEnemy(enemy, j);\n                }\n\n                break;\n            }\n        }\n\n        if (!removed && bullet.y < -20) {\n            playerBullets.splice(i, 1);\n        }\n    }\n\n    // Enemy bullets\n    for (let i = enemyBullets.length - 1; i >= 0; i--) {\n        const bullet = enemyBullets[i];\n\n        bullet.x += bullet.vx * dt;\n        bullet.y += bullet.vy * dt;\n\n        if (hit(player, bullet, 12, bullet.radius)) {\n            damagePlayer();\n            enemyBullets.splice(i, 1);\n            continue;\n        }\n\n        if (\n            bullet.y > HEIGHT + 30 ||\n            bullet.y < -30 ||\n            bullet.x < -30 ||\n            bullet.x > WIDTH + 30\n        ) {\n            enemyBullets.splice(i, 1);\n        }\n    }\n\n    // Pickups\n    for (let i = items.length - 1; i >= 0; i--) {\n        const item = items[i];\n\n        item.y += item.speed * dt;\n\n        if (hit(player, item, 15, item.radius)) {\n            collectItem(item);\n            items.splice(i, 1);\n            continue;\n        }\n\n        if (item.y > HEIGHT + 20) {\n            items.splice(i, 1);\n        }\n    }\n\n    updateUI();\n}\n\n<\/script>\n<script>\n\"use strict\";\n\n// ---------- Drawing (premium dark look) ----------\n\n// Pre-rendered deep-space nebula, tiled vertically for a seamless scroll.\nconst nebula = (() => {\n    const c = document.createElement(\"canvas\");\n    c.width = WIDTH;\n    c.height = HEIGHT * 2;\n    const g = c.getContext(\"2d\");\n\n    g.fillStyle = \"#02030a\";\n    g.fillRect(0, 0, c.width, c.height);\n\n    const blobs = [\n        [150, 200, 280, \"92,44,210\", 0.34],\n        [650, 520, 320, \"24,120,230\", 0.26],\n        [420, 900, 340, \"180,34,160\", 0.24],\n        [90, 1060, 260, \"30,150,210\", 0.22],\n        [700, 1150, 300, \"104,54,230\", 0.26],\n        [330, 560, 220, \"60,24,150\", 0.22]\n    ];\n\n    for (const [x, y, r, color, alpha] of blobs) {\n        for (const offset of [-c.height, 0, c.height]) {\n            const gradient = g.createRadialGradient(x, y + offset, 0, x, y + offset, r);\n            gradient.addColorStop(0, `rgba(${color},${alpha})`);\n            gradient.addColorStop(1, `rgba(${color},0)`);\n            g.fillStyle = gradient;\n            g.fillRect(0, 0, c.width, c.height);\n        }\n    }\n\n    return c;\n})();\n\nfunction drawBackground() {\n    ctx.fillStyle = \"#02030a\";\n    ctx.fillRect(0, 0, WIDTH, HEIGHT);\n\n    const offset = bgScroll % (HEIGHT * 2);\n    ctx.drawImage(nebula, 0, offset - HEIGHT * 2);\n    ctx.drawImage(nebula, 0, offset);\n\n    // Stage planet (3D, rotating)\n    drawStagePlanet();\n\n    // Stars (three depth layers, twinkling)\n    for (const star of stars) {\n        const twinkle = 0.55 + 0.45 * Math.sin(time * 2.2 + star.tw);\n        ctx.globalAlpha = (0.3 + star.z * 0.7) * twinkle;\n        ctx.fillStyle = star.color;\n        ctx.fillRect(star.x, star.y, star.size, star.size * (1 + star.z * 2.6));\n    }\n\n    ctx.globalAlpha = 1;\n}\n\nfunction glowCircle(x, y, radius, color, alpha) {\n    const g = ctx.createRadialGradient(x, y, 0, x, y, radius);\n    g.addColorStop(0, `rgba(${color},${alpha})`);\n    g.addColorStop(1, `rgba(${color},0)`);\n    ctx.fillStyle = g;\n    ctx.beginPath();\n    ctx.arc(x, y, radius, 0, Math.PI * 2);\n    ctx.fill();\n}\n\nfunction drawPlayer() {\n    if (\n        player.invincible > 0 &&\n        player.shield <= 0 &&\n        Math.floor(gameTime * 15) % 2 === 0\n    ) {\n        return;\n    }\n\n    ctx.save();\n    ctx.translate(player.x, player.y);\n\n    // Engine glow + flame (additive)\n    const flame = 24 + Math.random() * 9;\n    ctx.globalCompositeOperation = \"lighter\";\n    glowCircle(0, 16, 34, \"80,170,255\", 0.38);\n\n    for (const fx of [-9, 9]) {\n        const fg = ctx.createLinearGradient(0, 12, 0, 12 + flame * 0.75);\n        fg.addColorStop(0, \"rgba(160,240,255,0.95)\");\n        fg.addColorStop(0.5, \"rgba(70,140,255,0.55)\");\n        fg.addColorStop(1, \"rgba(70,70,255,0)\");\n        ctx.fillStyle = fg;\n        ctx.beginPath();\n        ctx.moveTo(fx - 4, 12);\n        ctx.lineTo(fx, 12 + flame * 0.75);\n        ctx.lineTo(fx + 4, 12);\n        ctx.closePath();\n        ctx.fill();\n    }\n\n    const cg = ctx.createLinearGradient(0, 10, 0, 10 + flame);\n    cg.addColorStop(0, \"rgba(255,255,255,0.95)\");\n    cg.addColorStop(0.35, \"rgba(110,225,255,0.75)\");\n    cg.addColorStop(1, \"rgba(60,90,255,0)\");\n    ctx.fillStyle = cg;\n    ctx.beginPath();\n    ctx.moveTo(-5, 10);\n    ctx.lineTo(0, 10 + flame);\n    ctx.lineTo(5, 10);\n    ctx.closePath();\n    ctx.fill();\n    ctx.globalCompositeOperation = \"source-over\";\n\n    // Wings\n    const wing = ctx.createLinearGradient(-30, 0, 30, 0);\n    wing.addColorStop(0, \"#12204a\");\n    wing.addColorStop(0.5, \"#5c8dff\");\n    wing.addColorStop(1, \"#12204a\");\n    ctx.fillStyle = wing;\n    ctx.strokeStyle = \"rgba(127,233,255,0.85)\";\n    ctx.lineWidth = 1;\n    ctx.beginPath();\n    ctx.moveTo(0, -20);\n    ctx.lineTo(8, -4);\n    ctx.lineTo(26, 12);\n    ctx.lineTo(31, 23);\n    ctx.lineTo(11, 15);\n    ctx.lineTo(0, 19);\n    ctx.lineTo(-11, 15);\n    ctx.lineTo(-31, 23);\n    ctx.lineTo(-26, 12);\n    ctx.lineTo(-8, -4);\n    ctx.closePath();\n    ctx.fill();\n    ctx.stroke();\n\n    // Fuselage\n    const body = ctx.createLinearGradient(0, -28, 0, 20);\n    body.addColorStop(0, \"#f2fbff\");\n    body.addColorStop(0.55, \"#8cc4ff\");\n    body.addColorStop(1, \"#3a63c8\");\n    ctx.fillStyle = body;\n    ctx.beginPath();\n    ctx.moveTo(0, -28);\n    ctx.lineTo(6, -6);\n    ctx.lineTo(5, 16);\n    ctx.lineTo(0, 21);\n    ctx.lineTo(-5, 16);\n    ctx.lineTo(-6, -6);\n    ctx.closePath();\n    ctx.fill();\n\n    // Cockpit\n    ctx.shadowBlur = 10;\n    ctx.shadowColor = \"#5fe8ff\";\n    const cockpit = ctx.createLinearGradient(0, -14, 0, 0);\n    cockpit.addColorStop(0, \"#c8fbff\");\n    cockpit.addColorStop(1, \"#1a8dff\");\n    ctx.fillStyle = cockpit;\n    ctx.beginPath();\n    ctx.ellipse(0, -7, 2.8, 7, 0, 0, Math.PI * 2);\n    ctx.fill();\n    ctx.shadowBlur = 0;\n\n    // Wing-tip lights\n    const blink = 0.5 + 0.5 * Math.sin(time * 6);\n    ctx.fillStyle = `rgba(255,90,140,${0.5 + blink * 0.5})`;\n    ctx.beginPath();\n    ctx.arc(-28, 21, 1.8, 0, Math.PI * 2);\n    ctx.fill();\n    ctx.fillStyle = `rgba(110,255,200,${0.5 + (1 - blink) * 0.5})`;\n    ctx.beginPath();\n    ctx.arc(28, 21, 1.8, 0, Math.PI * 2);\n    ctx.fill();\n\n    // Shield\n    if (player.shield > 0 && (player.shield > 1.2 || Math.floor(gameTime * 10) % 2 === 0)) {\n        ctx.globalCompositeOperation = \"lighter\";\n        glowCircle(0, 0, 34, \"90,200,255\", 0.22);\n        ctx.strokeStyle = \"rgba(130,225,255,0.9)\";\n        ctx.lineWidth = 2;\n        ctx.setLineDash([12, 7]);\n        ctx.lineDashOffset = -time * 40;\n        ctx.beginPath();\n        ctx.arc(0, 0, 30, 0, Math.PI * 2);\n        ctx.stroke();\n        ctx.setLineDash([]);\n        ctx.globalCompositeOperation = \"source-over\";\n    }\n\n    ctx.restore();\n}\n\nfunction drawEnemy(enemy) {\n    const rgb = enemy.strong ? \"255,156,85\" : \"255,88,126\";\n    const hex = enemy.strong ? \"#ff9c55\" : \"#ff587e\";\n    const pulse = 0.5 + 0.5 * Math.sin(time * 6 + enemy.phase);\n\n    ctx.save();\n    ctx.translate(enemy.x, enemy.y);\n\n    ctx.globalCompositeOperation = \"lighter\";\n    glowCircle(0, 2, enemy.width * 0.95, rgb, 0.2 + pulse * 0.08);\n    ctx.globalCompositeOperation = \"source-over\";\n\n    const body = ctx.createLinearGradient(0, -16, 0, 20);\n    body.addColorStop(0, enemy.strong ? \"#6a3418\" : \"#6e1630\");\n    body.addColorStop(1, \"#150814\");\n    ctx.fillStyle = body;\n    ctx.strokeStyle = hex;\n    ctx.lineWidth = 1.6;\n    ctx.shadowBlur = 12;\n    ctx.shadowColor = hex;\n\n    ctx.beginPath();\n    ctx.moveTo(0, 18);\n    ctx.lineTo(-enemy.width / 2, -8);\n    ctx.lineTo(-7, -3);\n    ctx.lineTo(0, -15);\n    ctx.lineTo(7, -3);\n    ctx.lineTo(enemy.width / 2, -8);\n    ctx.closePath();\n    ctx.fill();\n    ctx.stroke();\n    ctx.shadowBlur = 0;\n\n    if (enemy.strong) {\n        ctx.strokeStyle = \"rgba(255,200,150,0.55)\";\n        ctx.lineWidth = 1;\n        ctx.beginPath();\n        ctx.moveTo(-enemy.width / 2 + 5, -4);\n        ctx.lineTo(0, 12);\n        ctx.lineTo(enemy.width / 2 - 5, -4);\n        ctx.stroke();\n    }\n\n    // Glowing core\n    ctx.globalCompositeOperation = \"lighter\";\n    glowCircle(0, 1, 9, rgb, 0.7 + pulse * 0.3);\n    ctx.globalCompositeOperation = \"source-over\";\n    ctx.fillStyle = \"#fff\";\n    ctx.beginPath();\n    ctx.arc(0, 1, 2.2, 0, Math.PI * 2);\n    ctx.fill();\n\n    if (enemy.strong) {\n        // gold ring = \"defeat me for a bonus\"\n        ctx.strokeStyle = `rgba(255,210,122,${0.45 + pulse * 0.4})`;\n        ctx.lineWidth = 1.5;\n        ctx.setLineDash([7, 5]);\n        ctx.lineDashOffset = -time * 20;\n        ctx.beginPath();\n        ctx.arc(0, 1, enemy.width * 0.62, 0, Math.PI * 2);\n        ctx.stroke();\n        ctx.setLineDash([]);\n    }\n\n    if (enemy.strong) {\n        ctx.fillStyle = \"rgba(20,8,24,0.85)\";\n        ctx.fillRect(-20, -32, 40, 4);\n        ctx.fillStyle = hex;\n        ctx.shadowBlur = 6;\n        ctx.shadowColor = hex;\n        ctx.fillRect(-20, -32, 40 * enemy.hp / enemy.maxHp, 4);\n        ctx.shadowBlur = 0;\n    }\n\n    ctx.restore();\n}\n\n<\/script>\n<script>\n\"use strict\";\n\n// ---------- Boss sprite: dark battleship ----------\nconst BOSS_IMG = \"data:image/webp;base64,UklGRgquAABXRUJQVlA4WAoAAAAQAAAAfwIA+wEAQUxQSPItAAAN8LZt2+I2trWd130Xl5hlmeMk3T14jLkYfjhDzx7U3WFOzLYssJgK7/tDTLFlyVXb+hARE4CHQbaxcXwQIsb79N9z8cubGI+6aSem4yMntmNtBCNXTedPG348J/vnUvvEzX5f42+fBXGczJ9SYceTqY2CGO214jh/KDpTIaEaeiIdvo7hmGV7JAGAeDIXnE/iNwaHjwuJ6wid+A0I8iIAJBEjzmIYxmQkXUHSJdb6DzpzPr8LYjB+QAonABIikOyi3L/NqyTRO37tx1/GXTedUUmGoQxGHBey36wpHUdaORy9h1rWT51YCnuc73wJgdftxHpOlYOuopF+kZHVIQCzlO1/Fn/4js5+HcVRtn9b6H15DTRf+7nNHDp7o2S1eBE4AwBu2tJlTzIqus+c+In5yDTU/nMJnB05ubXk9OTIKeXpAqYEIQAwriaLzGF5eXQSP1kvTUZcyjrKldmnrm4nbM/Rv0tfQHsN7wKrvGnXJ2Emyz7N4iZPq71zXy2s60YyP+nsdf3iD1WVFH6Be9QNL8h9tzYYCmmtV4J/OvGSlT+LQ1cknzyxxbA/82aBtFeynHCxPwtxgVlOuQLQChv08TxeouesiYRRLRv+NJASAFc54VKJS7nKAICMjCaO4yXBzNQkmKaRxOWEb8g4p1msRN0YjVwAINxWbmlDP0ai/inXGYqvbi1ppQo9C2Ij/I+V2VDgdmvlR4nep3MZE8k/VgYCt5zZ1a3i5B/1mIgdaJ68bWD2ynrY+BTEQ+qGbrJbB6ZbCCYxkdJw4Ogau22QoS9VxEP9wZ5brZrslkm3PU4gJtr8dRCsPSprt0s4rcPQiovI4WEzUyuodJuk0zoc24iP8mToBhK3OegfDyXio/zPm+0jH7c6dEPbcuIjT35QT115u5TMel7+0o+LqNsKBRK3m6dWSvzsQxj/KBaLRMpJdyZxy4mr6ULOdBrtboyD5corhbzPZFBvBLj9TK19t8LVdmcmMWp0wxgGe/THojec+ALB2Jd3ADyzllG1ZJKRZP1XH8L4ReoPaelMAgFIiTtJiqYyq5RTAYbhi1Hsgu1Ynicl7jSBuKYxQEuEk2bcgj2q9IcSc5AAEKmcxjEL+9Ga1wowN4mbSWqEcYrkf80NWgHmqLn2tDD476MYxea6NQgwR8l
